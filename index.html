function startHunt(){
 var pool=BUGS.slice();
 for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;}
 var list=pool.slice(0,10).map(function(b){
  var opts=[b.hunt];
  var others=HUNT_CLASSES.map(function(h){return h.n;}).filter(function(n){return n!==b.hunt;});
  for(var k=others.length-1;k>0;k--){var j2=Math.floor(Math.random()*(k+1));var t2=others[k];others[k]=others[j2];others[j2]=t2;}
  opts=opts.concat(others.slice(0,3));
  for(var m=opts.length-1;m>0;m--){var j3=Math.floor(Math.random()*(m+1));var t3=opts[m];opts[m]=opts[j3];opts[j3]=t3;}
  return{bug:b,opts:opts,a:opts.indexOf(b.hunt)};
 });
 G.enc={kind:'hunt',idx:0,list:list};
 G.mode='hunt';setPauseBtn(false);renderHuntQ();sndClick();
}
function renderHuntQ(){
 var e=G.enc,it=e.list[e.idx],b=it.bug;
 var h='<div class="card"><h2>🎯 Bug Hunt — '+(e.idx+1)+'/10</h2>'+
  '<div style="text-align:center"><img src="'+bugImage(b,96)+'" style="border-radius:50%" width="96" height="96"></div>'+
  '<div class="q" style="text-align:center">'+esc(b.name)+'</div>'+
  '<div style="text-align:center;margin:6px 0">'+gramLabel(b)+'</div>'+
  '<p class="talk">“'+esc(b.clue)+'”</p>'+
  '<div class="q">Which drug class kills it?</div><div class="opts">';
 for(var i=0;i<it.opts.length;i++)h+='<button class="opt" data-i="'+i+'">'+esc(it.opts[i])+'</button>';
 h+='</div></div>';
 show(h);
 var opts=document.querySelectorAll('.opt');
 for(var k=0;k<opts.length;k++)(function(el){
  el.addEventListener('click',function(){answerHunt(+el.getAttribute('data-i'));});
 })(opts[k]);
}
function answerHunt(i){

  show('<div class="card"><div class="banner good">✅ <b>Correct! +15 XP</b><br><img src="'+bugImage(b,48)+'" style="border-radius:50%;vertical-align:middle" width="48" height="48"> '+esc(b.name)+' — killed by <b>'+esc(b.hunt)+'</b>.</div><div class="btnrow"><button class="btn" id="hNext">Next bug →</button></div></div>');

  if(SV.hearts>0)SV.hearts--;

function bugIdQ(b){
 var hunts=[];for(var i=0;i<BUGS.length;i++)if(hunts.indexOf(BUGS[i].hunt)<0)hunts.push(BUGS[i].hunt);
 var r=Math.random(),qd;
 if(r<0.3){
  var o1=[b.name];
  while(o1.length<4){var x1=pick(BUGS);if(o1.indexOf(x1.name)<0)o1.push(x1.name);}
  shuffleArr(o1);
  qd={t:'cause',q:'Which bug causes this?\n"'+b.clue+'"',o:o1,a:o1.indexOf(b.name),
   e:b.name+' — '+b.clue};
 }else if(r<0.55){
  var o2=[b.name];
  while(o2.length<4){var x2=pick(BUGS);if(o2.indexOf(x2.name)<0)o2.push(x2.name);}
  shuffleArr(o2);
  qd={t:'site',q:'Which bug is classically found in:\n'+b.site+'?',o:o2,a:o2.indexOf(b.name),
   e:b.name+' lives in '+b.site+'.'};
 }else if(r<0.8){
  var o3=[b.hunt];
  while(o3.length<4){var x3=pick(hunts);if(o3.indexOf(x3)<0)o3.push(x3);}
  shuffleArr(o3);
  qd={t:'treat',q:'What treats '+b.emoji+' '+b.name+'?',o:o3,a:o3.indexOf(b.hunt),
   e:b.killed+'.'};
 }else{
  var o4=[b.site];
  while(o4.length<4){var x4=pick(BUGS);if(x4.site&&o4.indexOf(x4.site)<0)o4.push(x4.site);}
  shuffleArr(o4);
  qd={t:'where',q:b.emoji+' '+b.name+' is classically found where?',o:o4,a:o4.indexOf(b.site),
   e:b.site+' — treat with '+b.killed+'.'};
 }
 qd.p='ID LAB: '+b.name+' | '+b.site+' | '+b.hunt+'.';
 qd.why=bugWhy(b);
 return qd;
}

/* ============ TEXTBOOK BUG MORPHOLOGY (drawn, not emoji) ============ */
function bugColor(b){
 if(b.gram==='pos')return '#9d6bf3';
 if(b.gram==='neg')return '#f27ba7';
 if(b.gram==='afb')return '#e5484d';
 return '#b8b0a5';
}
function drawBugMorph(c,b,x,y,s){
 /* c=ctx, b=bug, x/y=center, s=scale (1 = ~40px) */
 var col=bugColor(b);
 c.save();c.translate(x,y);c.scale(s,s);
 c.fillStyle=col;c.strokeStyle=col;c.lineWidth=2.5;c.lineCap='round';
 var m=b.morph||'rods';
 if(m==='clusters'){
  /* grape-like clusters (Staph) */
  var pts=[[-12,-6],[0,-12],[12,-6],[-6,4],[6,4],[0,12],[-14,8],[14,8]];
  for(var i=0;i<pts.length;i++){c.beginPath();c.arc(pts[i][0],pts[i][1],7,0,7);c.fill();}
 }else if(m==='chains'){
  /* chains (Strep) */
  for(var j=0;j<5;j++){c.beginPath();c.arc(-20+j*10,0,7,0,7);c.fill();}
 }else if(m==='diplococci'){
  /* lancet diplococci (pneumococcus) */
  for(var k=0;k<3;k++){var dx=-18+k*18;
   c.save();c.translate(dx,0);c.rotate(0.5);
   c.beginPath();c.ellipse(-4,0,7,5,0,0,7);c.fill();
   c.beginPath();c.ellipse(4,0,7,5,0,0,7);c.fill();c.restore();}
 }else if(m==='beandiplococci'){
  /* kidney-bean diplococci (Neisseria) */
  for(var n=0;n<2;n++){var nx=-14+n*28;
   c.beginPath();c.arc(nx-4,0,7,0.6,5.6);c.fill();
   c.beginPath();c.arc(nx+4,0,7,Math.PI+0.6,Math.PI+5.6);c.fill();}
 }else if(m==='rods'){
  /* rods (bacilli) */
  var rp=[[-16,-8],[2,-12],[-8,8],[12,6]];
  for(var r=0;r<rp.length;r++){
   c.save();c.translate(rp[r][0],rp[r][1]);c.rotate(rp[r][0]*0.03);
   c.beginPath();
   if(c.roundRect)c.roundRect(-11,-4,22,8,4);else c.rect(-11,-4,22,8);
   c.fill();c.restore();}
 }else if(m==='coccobacilli'){
  /* tiny coccobacilli */
  for(var cb=0;cb<6;cb++){c.beginPath();c.ellipse(-20+cb*8,(cb%2)*10-5,5,3.5,0.4,0,7);c.fill();}
 }else if(m==='branching'){
  /* branching filaments */
  c.beginPath();c.moveTo(-18,10);c.quadraticCurveTo(-6,-6,4,-12);c.stroke();
  c.beginPath();c.moveTo(-6,2);c.quadraticCurveTo(4,6,14,2);c.stroke();
  c.beginPath();c.moveTo(0,-8);c.quadraticCurveTo(8,-14,16,-10);c.stroke();
  c.beginPath();c.moveTo(-14,6);c.lineTo(-20,14);c.stroke();
 }else if(m==='sporerods'){
  /* rods with terminal spores */
  for(var sp=0;sp<3;sp++){var sx=-16+sp*16;
   c.save();c.translate(sx,0);c.rotate(sp*0.3);
   c.beginPath();if(c.roundRect)c.roundRect(-10,-4,20,8,4);else c.rect(-10,-4,20,8);c.fill();
   c.fillStyle='#fff';c.beginPath();c.arc(8,0,4,0,7);c.fill();c.fillStyle=col;
   c.restore();}
 }else if(m==='curved'){
  /* gull-wing curved rods */
  for(var cu=0;cu<3;cu++){c.beginPath();c.arc(-14+cu*14,0,9,3.4,5.9);c.stroke();}
 }else if(m==='spiral'){
  /* spiral */
  c.beginPath();
  for(var sl=0;sl<=20;sl++){var px=-18+sl*1.8,py=Math.sin(sl*0.8)*8;
   if(sl===0)c.moveTo(px,py);else c.lineTo(px,py);}
  c.stroke();
 }else if(m==='spindle'){
  /* spindle (fusiform) */
  for(var fd=0;fd<3;fd++){c.save();c.translate(-14+fd*14,0);c.rotate(fd*0.4);
   c.beginPath();c.ellipse(0,0,11,3.5,0,0,7);c.fill();c.restore();}
 }else if(m==='wallless'){
  /* no cell wall: irregular blobs */
  for(var wb=0;wb<4;wb++){c.beginPath();
   c.ellipse(-15+wb*10,(wb%2)*8-4,8,6,wb*0.7,0,7);c.fill();}
 }else if(m==='acidfast'){
  /* beaded red rods */
  for(var ab=0;ab<3;ab++){var ax=-16+ab*16;
   for(var bd=0;bd<4;bd++){c.beginPath();c.arc(ax-6+bd*4,0,3.2,0,7);c.fill();}}
 }else if(m==='capsulerods'){
  /* Klebsiella: plump rods with prominent capsule halo */
  var cp=[[-14,-6],[8,-10],[-2,10]];
  for(var cr=0;cr<cp.length;cr++){
   c.save();c.translate(cp[cr][0],cp[cr][1]);c.rotate(cr*0.4);
   c.globalAlpha=0.35;c.beginPath();c.ellipse(0,0,15,8,0,0,7);c.fill();c.globalAlpha=1;
   c.beginPath();if(c.roundRect)c.roundRect(-10,-4.5,20,9,4.5);else c.rect(-10,-4.5,20,9);c.fill();
   c.restore();}
 }else if(m==='pleorods'){
  /* Proteus: pleomorphic — mixed short rods and long filaments */
  var pl=[[-18,-8,20],[-2,-12,34],[10,6,20],[-8,10,44]];
  for(var pr=0;pr<pl.length;pr++){
   c.save();c.translate(pl[pr][0],pl[pr][1]);c.rotate(pr*0.25-0.2);
   c.beginPath();if(c.roundRect)c.roundRect(-pl[pr][2]/2,-4,pl[pr][2],8,4);else c.rect(-pl[pr][2]/2,-4,pl[pr][2],8);c.fill();
   c.restore();}
 }else if(m==='bipolar'){
  /* Yersinia: safety-pin bipolar staining — dark poles */
  for(var bp=0;bp<3;bp++){var bx=-16+bp*16;
   c.save();c.translate(bx,0);c.rotate(bp*0.3);
   c.globalAlpha=0.45;c.beginPath();if(c.roundRect)c.roundRect(-10,-4,20,8,4);else c.rect(-10,-4,20,8);c.fill();c.globalAlpha=1;
   c.beginPath();c.arc(-7,0,3.5,0,7);c.fill();
   c.beginPath();c.arc(7,0,3.5,0,7);c.fill();
   c.restore();}
 }
 c.restore();
}
function bugImage(b,size){
 /* data URL for HTML cards */
 var s=size||96,cv2=document.createElement('canvas');
 cv2.width=cv2.height=s;
 var x2=cv2.getContext('2d');
 /* dark petri background */
 var g=x2.createRadialGradient(s/2,s/2,4,s/2,s/2,s/2);
 g.addColorStop(0,'#1a2440');g.addColorStop(1,'#0a0f22');
 x2.fillStyle=g;x2.fillRect(0,0,s,s);
 drawBugMorph(x2,b,s/2,s/2,s/52);
 return cv2.toDataURL();
}
function genQuestion(){
 var b=pick(BUGS);
 var hunts=[];for(var i=0;i<BUGS.length;i++)if(hunts.indexOf(BUGS[i].hunt)<0)hunts.push(BUGS[i].hunt);
 var sites=[];for(var s=0;s<BUGS.length;s++)if(BUGS[s].site&&sites.indexOf(BUGS[s].site)<0)sites.push(BUGS[s].site);
 var names=BUGS.map(function(x){return x.name;});
 var t=Math.floor(Math.random()*7),qd;
 function mkOpts(correct,pool){
  var o=[correct];
  while(o.length<4){var x=pick(pool);if(o.indexOf(x)<0)o.push(x);}
  shuffleArr(o);
  return {o:o,a:o.indexOf(correct)};
 }
 if(t===0){
  var mo=mkOpts(b.hunt,hunts);
  qd={q:'What drug class kills '+b.emoji+' '+b.name+'?',o:mo.o,a:mo.a,
   e:b.name+' → '+b.hunt+': '+b.killed+'.',p:'GEN: '+b.name+' → '+b.hunt,why:bugWhy(b)};
 }else if(t===1){
  var mo2=mkOpts(b.name,names);
  qd={q:'Which bug causes this?\n"'+b.clue+'"',o:mo2.o,a:mo2.a,
   e:b.name+'. Treat: '+b.killed+'.',p:'GEN: cause → '+b.name,why:bugWhy(b)};
 }else if(t===2){
  var mo3=mkOpts(b.site,sites);
  qd={q:b.emoji+' '+b.name+' is classically found where?',o:mo3.o,a:mo3.a,
   e:b.site+' — treat with '+b.killed+'.',p:'GEN: site → '+b.name,why:bugWhy(b)};
 }else if(t===3){
  /* true/false */
  var isTrue=Math.random()<0.5;
  var claim=isTrue?b.hunt:pick(hunts.filter(function(h){return h!==b.hunt;}));
  qd={q:'True or false?\n"'+b.name+' is treated with '+claim+'."',o:['True','False'],a:isTrue?0:1,
   e:b.name+' → '+b.hunt+'.',p:'GEN: T/F '+b.name,why:bugWhy(b)};
 }else if(t===4){
  /* which of these is killed by X? (distractors are NOT) */
  var killers=BUGS.filter(function(x){return x.hunt===b.hunt&&x.id!==b.id;});
  var correct=killers.length?pick(killers).name:b.name;
  var notK=BUGS.filter(function(x){return x.hunt!==b.hunt;}).map(function(x){return x.name;});
  var mo4=mkOpts(correct,notK);
  qd={q:'Which of these is killed by '+b.hunt+'?',o:mo4.o,a:mo4.a,
   e:correct+' → '+b.hunt+'.',p:'GEN: hunt → bug',why:bugWhy(b)};
 }else if(t===5){
  /* trait → bug */
  var tr=pick(b.traits);
  var mo5=mkOpts(b.name,names);
  qd={q:'Which bug?\n"'+tr+'"',o:mo5.o,a:mo5.a,
   e:b.name+'. Treat: '+b.killed+'.',p:'GEN: trait → '+b.name,why:bugWhy(b)};
 }else{
  /* NOT: which is NOT treated by X (only when the hunt has enough bugs) */
  var sameHunt6=BUGS.filter(function(x){return x.hunt===b.hunt;});
  if(sameHunt6.length<4){
   var mo6=mkOpts(b.hunt,hunts);
   qd={q:'What drug class kills '+b.emoji+' '+b.name+'?',o:mo6.o,a:mo6.a,
    e:b.name+' → '+b.hunt+': '+b.killed+'.',p:'GEN: '+b.name+' → '+b.hunt,why:bugWhy(b)};
  }else{
   var notBugs=BUGS.filter(function(x){return x.hunt!==b.hunt;});
   var notB=pick(notBugs);
   var o6=[notB.name];
   while(o6.length<4){var sh=pick(sameHunt6);if(o6.indexOf(sh.name)<0)o6.push(sh.name);}
   shuffleArr(o6);
   qd={q:'Which is NOT treated by '+b.hunt+'?',o:o6,a:o6.indexOf(notB.name),
    e:notB.name+' is not killed by '+b.hunt+'.',p:'GEN: NOT '+b.hunt,why:bugWhy(notB)};
  }
 }
 qd.pid='gen'+b.id+'t'+t+'r'+Math.floor(Math.random()*1e6);
 return qd;
}

 why:"For MSSA endocarditis, anti-staphylococcal beta-lactams (nafcillin, oxacillin, cefazolin) are superior to vancomycin — faster bacteremia clearance and lower mortality in every comparative study, because beta-lactam PBP binding kills MSSA more rapidly than vancomycin's D-ala-D-ala blockade. AHA guidelines specify 6 weeks of a beta-lactam for uncomplicated native-valve MSSA endocarditis. Two weeks is the duration for uncomplicated bacteremia, not endocarditis; daptomycin is a fallback for beta-lactam allergy, not the drug of choice; ceftriaxone lacks reliable anti-staphylococcal activity."},
{topic:"Endocarditis",q:"Prosthetic aortic valve endocarditis, MRSA isolated. Initial regimen per AHA?",o:["Vancomycin + rifampin + gentamicin","Vancomycin alone","Rifampin alone","Nafcillin + gentamicin"],a:0,
 e:"Prosthetic-valve MRSA endocarditis: vancomycin + rifampin (biofilm) + gentamicin × 2 weeks.",p:"EXAM: prosthetic valve MRSA endocarditis = vanco + rifampin + gentamicin. Rifampin never alone.",
 why:"Prosthetic-valve MRSA endocarditis involves biofilm on foreign material, so AHA recommends vancomycin plus rifampin — which penetrates biofilm and kills adherent staphylococci — plus gentamicin for the first 2 weeks for synergy. Rifampin must never be used alone or added before bacteremia clears, because single-step resistance emerges within days. Vancomycin alone cannot sterilize prosthetic biofilm; nafcillin cannot bind MRSA's PBP2a."},
{topic:"Febrile neutropenia",q:"ANC 180, febrile to 39.1°C, hypotensive. No MRSA history. Empiric therapy?",o:["Cefepime 2g IV q8h","Vancomycin alone","Ciprofloxacin PO","Ceftriaxone"],a:0,
 e:"Febrile neutropenia + hypotension: immediate anti-pseudomonal beta-lactam monotherapy.",p:"EXAM: febrile neutropenia = anti-pseudomonal beta-lactam NOW (cefepime/pip-tazo/meropenem). Vanco only with MRSA risk.",
 why:"Febrile neutropenia with hypotension is a Pseudomonas emergency — IDSA mandates immediate anti-pseudomonal beta-lactam monotherapy (cefepime, piperacillin-tazobactam, or meropenem), because Pseudomonas bacteremia kills neutropenic patients in hours. Vancomycin is added only with specific MRSA risk factors (prior colonization, catheter infection, skin source), not reflexively. Oral ciprofloxacin is prophylaxis, not treatment of septic shock; ceftriaxone has no Pseudomonas activity."},
{topic:"Tuberculosis",q:"Drug-susceptible pulmonary TB, adherent adult. Standard regimen?",o:["2 months RIPE, then 4 months rifampin + isoniazid","Isoniazid alone × 9 months","RIPE × 2 months then stop","Rifampin alone × 6 months"],a:0,
 e:"Standard TB therapy: 2HRZE/4HR — four drugs intensive, two drugs continuation.",p:"EXAM: TB = 2 months RIPE then 4 months RI. Never single-drug therapy.",
 why:"Standard drug-susceptible TB therapy is 2 months of rifampin, isoniazid, pyrazinamide, and ethambutol (intensive phase) followed by 4 months of rifampin plus isoniazid (continuation) — 2HRZE/4HR. Four drugs initially prevent selection of resistant mutants; single-drug therapy guarantees resistance. Stopping after the intensive phase invites relapse; directly observed therapy is the standard of care."},
{topic:"Antifungals",q:"Candidemia, Candida albicans fluconazole-susceptible, clinically stable, line removed. Step-down?",o:["Fluconazole 800mg load, then 400mg daily","Continue micafungin indefinitely","Amphotericin B","Stop antifungals now"],a:0,
 e:"Candidemia: start echinocandin, step down to fluconazole once susceptible and stable.",p:"EXAM: candidemia = echinocandin first, step down to fluconazole if susceptible + stable.",
 why:"IDSA candidemia guidance starts an echinocandin (fungicidal, broad Candida coverage) then steps down to fluconazole once the isolate is confirmed susceptible and the patient is stable — fluconazole's excellent bioavailability and narrow toxicity make it the ideal continuation agent. Continuing micafungin indefinitely wastes resources without benefit; amphotericin B is reserved for resistant or unstable disease given nephrotoxicity; stopping therapy with documented candidemia invites relapse and metastatic seeding."},
{topic:"Antifungals",q:"Prolonged neutropenia, halo sign on CT, galactomannan positive. First-line therapy?",o:["Voriconazole","Fluconazole","Amphotericin B deoxycholate","Micafungin alone"],a:0,
 e:"Invasive aspergillosis: voriconazole first-line (Herbrecht trial).",p:"EXAM: invasive aspergillosis = voriconazole. Fluconazole has no Aspergillus activity.",
 why:"Voriconazole is first-line for invasive aspergillosis — the Herbrecht trial showed superior response and survival versus amphotericin B deoxycholate. It requires therapeutic drug monitoring and vigilance for CYP-mediated interactions, visual disturbances, and hepatotoxicity. Fluconazole has no Aspergillus activity; deoxycholate amphotericin is more toxic and less effective; echinocandin monotherapy is salvage, not primary, therapy."},
{topic:"Surgical prophylaxis",q:"Elective colon surgery, no allergy. Optimal prophylaxis?",o:["Cefazolin within 60 min before incision; redose q4h intraop","Cefazolin the night before","Vancomycin × 5 days post-op","No antibiotics needed"],a:0,
 e:"Surgical prophylaxis: bactericidal tissue levels at incision — cefazolin within 60 min.",p:"EXAM: surgical prophylaxis = cefazolin within 60 min of incision. Post-op courses do not help.",
 why:"Surgical prophylaxis works by having bactericidal tissue levels at the moment of incision — cefazolin within 60 minutes before the cut, redosed every 4 hours during long cases to stay above the MIC. Dosing the night before leaves subtherapeutic levels at incision; prolonged post-operative courses do not reduce surgical site infections and drive resistance. Vancomycin is reserved for MRSA colonization or beta-lactam anaphylaxis."},
{topic:"HIV OIs",q:"CD4 35, subacute headache, cryptococcal meningitis confirmed. Induction therapy?",o:["Liposomal amphotericin B + flucytosine × 2 weeks","Fluconazole alone","Amphotericin B alone indefinitely","Acyclovir"],a:0,
 e:"Cryptococcal meningitis induction: liposomal amphotericin B + flucytosine.",p:"EXAM: crypto meningitis induction = ampho B + flucytosine, then fluconazole consolidation/maintenance.",
 why:"IDSA cryptococcal meningitis induction is liposomal amphotericin B plus flucytosine — the combination achieves faster CSF sterilization and lower mortality than amphotericin alone, and fluconazole alone is inferior for induction with higher relapse. Induction is followed by fluconazole consolidation then maintenance until immune reconstitution. Acyclovir treats herpesviruses, not fungi."}
,{topic:"HIV OIs",q:"CD4 120, new HIV diagnosis, no symptoms. PCP prophylaxis?",o:["TMP-SMX DS daily","Azithromycin weekly","Fluconazole daily","No prophylaxis needed"],a:0,
 e:"CD4 <200: TMP-SMX for PCP prophylaxis.",p:"EXAM: CD4 <200 = TMP-SMX for PCP. CD4 <100 = toxo concern. CD4 <50 = MAC.",
 why:"DHHS guidelines start Pneumocystis prophylaxis with TMP-SMX when CD4 falls below 200 cells/uL — TMP-SMX blocks folate synthesis in Pneumocystis jirovecii and also covers toxoplasmosis at this dose. Azithromycin is MAC prophylaxis at CD4 <50, not PCP prophylaxis; fluconazole prevents cryptococcal disease, not PCP; withholding prophylaxis at CD4 120 invites a preventable, often fatal pneumonia."},
{topic:"HIV OIs",q:"HIV-positive, CD4 45, started ART 2 weeks ago, now worsening cryptococcal meningitis symptoms. Most likely?",o:["Immune reconstitution inflammatory syndrome (IRIS)","ART failure","New bacterial meningitis","Drug-resistant Cryptococcus"],a:0,
 e:"Paradoxical worsening after ART = IRIS.",p:"EXAM: worsening OI shortly after ART start = IRIS. Don't stop ART.",
 why:"Immune reconstitution inflammatory syndrome occurs when recovering immunity mounts an exuberant inflammatory response against residual opportunistic-pathogen antigen — typically 2-12 weeks after ART initiation at low CD4 counts. It is diagnosed by paradoxical clinical worsening despite microbiologic control, and management is anti-inflammatory therapy while continuing ART, not switching antimicrobials. Stopping ART surrenders the immune recovery driving the syndrome."},
{topic:"Hepatitis",q:"Chronic hepatitis B, HBV DNA high, ALT elevated, no cirrhosis. First-line therapy?",o:["Tenofovir or entecavir","Interferon for everyone","Lamivudine alone","No treatment — monitor only"],a:0,
 e:"Chronic HBV with active replication: tenofovir or entecavir (high barrier to resistance).",p:"EXAM: chronic Hep B treatment = tenofovir or entecavir. Lamivudine resistance is rapid.",
 why:"Tenofovir and entecavir are first-line for chronic hepatitis B because they potently suppress HBV DNA with a high genetic barrier to resistance — critical for what is usually lifelong therapy. Lamivudine selects resistance in most patients within a few years and is obsolete as monotherapy. Interferon is an option only in select young patients without cirrhosis given its toxicity; high viral load with elevated ALT meets treatment thresholds, so observation alone allows progressive liver injury."},
{topic:"Hepatitis",q:"Hepatitis C, genotype 1, treatment-naive, no cirrhosis. Modern therapy?",o:["Sofosbuvir/velpatasvir × 12 weeks","Interferon + ribavirin × 48 weeks","Boceprevir triple therapy","Liver transplant evaluation first"],a:0,
 e:"Modern HCV: pangenotypic DAA (sofosbuvir/velpatasvir) × 8-12 weeks, >95% cure.",p:"EXAM: Hep C = direct-acting antivirals, 8-12 weeks, >95% SVR. Interferon era is over.",
 why:"Pangenotypic direct-acting antivirals like sofosbuvir/velpatasvir cure over 95% of hepatitis C infections in 8-12 weeks with minimal toxicity — sofosbuvir inhibits the NS5B polymerase and velpatasvir the NS5A protein, collapsing viral replication. The interferon era's 48-week courses with brutal side effects and ~50% cure rates are obsolete; first-generation protease inhibitors are museum pieces. Transplant evaluation is for decompensated cirrhosis, not uncomplicated chronic infection."},
{topic:"Malaria",q:"Traveler returning from sub-Saharan Africa, fever, P. falciparum on smear, no severe features. Treatment?",o:["Artemether-lumefantrine","Chloroquine","Doxycycline alone","Quinine monotherapy"],a:0,
 e:"Uncomplicated falciparum malaria: artemisinin combination therapy (artemether-lumefantrine).",p:"EXAM: falciparum malaria = artemisinin combination therapy. Chloroquine resistance is widespread.",
 why:"Artemether-lumefantrine is the WHO-recommended artemisinin combination therapy for uncomplicated P. falciparum malaria — artemether rapidly clears parasitemia while lumefantrine mops up residual parasites, and the combination prevents resistance selection. Chloroquine resistance in falciparum is nearly universal outside limited regions; doxycycline alone is too slow for treatment (it's prophylaxis/partner drug); quinine monotherapy is reserved for severe disease when artesunate is unavailable."},
{topic:"Malaria",q:"Severe falciparum malaria, cerebral involvement, parasitemia 18%. First-line?",o:["IV artesunate","Oral artemether-lumefantrine","Exchange transfusion first","IV quinine"],a:0,
 e:"Severe malaria: IV artesunate immediately — superior to quinine (SEAQUAMAT/AQUAMAT).",p:"EXAM: severe malaria = IV artesunate. Don't delay for transfusion.",
 why:"IV artesunate is first-line for severe falciparum malaria — the SEAQUAMAT and AQUAMAT trials showed significantly lower mortality than IV quinine, with faster parasite clearance and less hypoglycemia. Oral therapy cannot be relied upon in cerebral malaria with impaired consciousness; exchange transfusion has no proven mortality benefit and must never delay artesunate. Every hour of delay in severe malaria increases the risk of death."},
{topic:"Vaccines",q:"65-year-old, never vaccinated against pneumococcus. Current recommendation?",o:["Single PCV20 (or PCV21) dose","PPSV23 only","PCV13 then PPSV23 a year later","No vaccine needed at 65"],a:0,
 e:"Age ≥65: single PCV20 (or PCV21) — simplified from the old sequential schedule.",p:"EXAM: pneumococcal at 65+ = single PCV20/21. Know the simplification.",
 why:"ACIP now recommends a single dose of PCV20 (or PCV21) for all adults 65 and older — this simplified the old PCV13-then-PPSV23 sequence while covering the serotypes responsible for most invasive disease in this age group. PPSV23 alone is no longer the standalone recommendation; the sequential schedule is obsolete for routine immunization; and declining vaccination at 65 ignores the age-related spike in invasive pneumococcal disease and mortality."},
{topic:"Vaccines",q:"Pregnant patient at 28 weeks, flu season approaching. Influenza vaccine advice?",o:["Inactivated flu vaccine now — safe and recommended in pregnancy","Wait until after delivery","Live nasal vaccine preferred","Flu vaccine contraindicated in pregnancy"],a:0,
 e:"Pregnancy: inactivated influenza vaccine any trimester — protects mother and newborn.",p:"EXAM: flu vaccine in pregnancy = inactivated, any trimester. Live vaccines contraindicated.",
 why:"Inactivated influenza vaccine is recommended during any trimester of pregnancy — maternal immunization protects the mother from severe influenza (pregnancy increases cardiopulmonary risk) and passes transplacental antibody protecting the infant for the first months of life. The live attenuated nasal vaccine is contraindicated in pregnancy; waiting until delivery leaves both mother and newborn unprotected through flu season."},
{topic:"STIs",q:"Urethral discharge, Gram stain shows intracellular gram-negative diplococci. Treatment?",o:["Ceftriaxone 500mg IM single dose","Azithromycin 1g single dose","Doxycycline 7 days alone","Ciprofloxacin single dose"],a:0,

{topic:"STIs",q:"Painless genital ulcer, darkfield shows thin spirochetes. Diagnosis and treatment?",o:["Primary syphilis — benzathine penicillin G 2.4M units IM single dose","Chancroid — azithromycin","HSV — acyclovir","LGV — doxycycline 21 days"],a:0,

var RECAP_QS=[
{id:"hy0",q:"ESBL-producing Klebsiella bacteremia. Definitive therapy?",o:["Meropenem","Ceftriaxone","Ciprofloxacin","Aztreonam"],a:0,e:"ESBLs hydrolyze penicillins and most cephalosporins; carbapenems are the treatment of choice.",p:"HIGH-YIELD: ESBL → carbapenem (meropenem). Ceftriaxone will fail.",why:"ESBL enzymes (TEM, SHV, CTX-M) hydrolyze the beta-lactam ring of penicillins, cephalosporins, and aztreonam — ceftriaxone will fail regardless of any in-vitro ambiguity. Carbapenems resist ESBL hydrolysis because their carbapenem core is a poor enzyme substrate, making meropenem the definitive therapy for ESBL bacteremia per IDSA guidance. Ciprofloxacin is unreliable because ESBL plasmids frequently carry fluoroquinolone resistance determinants. The MERINO trial settled this: piperacillin-tazobactam was inferior to meropenem for ESBL bloodstream infection."},
{id:"hy1",q:"Why is ceftaroline the only cephalosporin with MRSA activity?",o:["It binds PBP2a","It inhibits beta-lactamase","It uses higher doses","It covers VRE"],a:0,e:"Ceftaroline binds the altered PBP2a target that other beta-lactams cannot.",p:"HIGH-YIELD: Ceftaroline = the only anti-MRSA cephalosporin (PBP2a binding).",why:"MRSA carries mecA, which encodes PBP2a — a transpeptidase with profoundly reduced affinity for all beta-lactams, so penicillins, cephalosporins, and carbapenems cannot bind it at achievable concentrations. Ceftaroline was engineered with a side chain that docks into the PBP2a active site, making it the only cephalosporin with anti-MRSA activity. It does not work by inhibiting beta-lactamase (that is tazobactam's job) or by higher dosing. This is the board's favorite trap: broader beta-lactam coverage never equals MRSA coverage."},
{id:"hy2",q:"VRE evades vancomycin by…",o:["D-ala-D-lac target change","Beta-lactamase production","Efflux pumps","Porin loss"],a:0,e:"vanA/vanB replace D-ala-D-ala with D-ala-D-lac, markedly reducing vancomycin binding.",p:"HIGH-YIELD: VRE = D-ala-D-lac target change. Vancomycin cannot work at any dose.",why:"vanA/vanB gene clusters reprogram cell-wall synthesis so peptidoglycan precursors terminate in D-ala-D-lactate instead of D-ala-D-alanine — vancomycin's binding target. That single-atom change (NH to O) eliminates a critical hydrogen bond, dropping vancomycin affinity roughly a thousand-fold. No dose of vancomycin overcomes a target that no longer exists, which is why VRE demands a target change (daptomycin, linezolid) rather than dose escalation. Efflux pumps and porin loss are gram-negative resistance strategies, not the VRE mechanism."},
{id:"hy3",q:"MRSA pneumonia treated with daptomycin is failing. The most likely reason?",o:["Daptomycin is inactivated by pulmonary surfactant","The dose is too low","It needs a beta-lactam partner","Treatment is too short"],a:0,e:"Daptomycin is inactivated by surfactant — effective for bacteremia, never for pneumonia.",p:"HIGH-YIELD NEVER-EVENT: daptomycin for bacteremia, NEVER for pneumonia (surfactant).",why:"Daptomycin is a cyclic lipopeptide that inserts into bacterial membranes in a calcium-dependent manner — but pulmonary surfactant sequesters and inactivates it in the alveoli. This is a drug-distribution failure, not a dosing failure: higher doses cannot overcome surfactant binding. Hence the never-event rule: daptomycin for bacteremia and right-sided endocarditis, never for pneumonia. Linezolid or ceftaroline covers MRSA pneumonia instead."},
{id:"hy4",q:"Nitrofurantoin is inappropriate for pyelonephritis because…",o:["It achieves no renal tissue or blood levels","E. coli is always resistant","It causes nephrotoxicity","It requires IV administration"],a:0,e:"Nitrofurantoin concentrates only in urine — inadequate for tissue infection or bacteremia.",p:"HIGH-YIELD NEVER-EVENT: nitrofurantoin = cystitis only. Never pyelonephritis, never bacteremia.",why:"Nitrofurantoin is rapidly filtered and concentrated in urine but achieves negligible renal parenchymal levels and zero systemic concentrations — it is a urinary antiseptic, not a tissue antibiotic. Pyelonephritis is tissue-invasive with bacteremia in roughly a quarter of cases, so a drug with no tissue or blood levels cannot treat it. This is pharmacokinetic, not microbiologic: E. coli may test susceptible, but susceptibility without site penetration is meaningless. IDSA is explicit: never nitrofurantoin for pyelonephritis or bacteremia."},
{id:"hy5",q:"A patient on simvastatin needs atypical pneumonia coverage. Which macrolide avoids the interaction?",o:["Azithromycin","Clarithromycin","Erythromycin","Telithromycin"],a:0,e:"Clarithromycin and erythromycin inhibit CYP3A4; azithromycin does not.",p:"HIGH-YIELD: clarithromycin/erythromycin inhibit CYP3A4 (statin → rhabdomyolysis risk). Azithromycin does not.",why:"Clarithromycin and erythromycin are potent CYP3A4 inhibitors — co-administration with simvastatin, a CYP3A4 substrate, raises statin exposure and risks rhabdomyolysis. Azithromycin does not meaningfully inhibit CYP3A4, making it the safe macrolide alongside statins. This is a metabolism distinction, not a class effect: the 14- and 15-membered macrolides differ in CYP interaction. Telithromycin, a ketolide, carries hepatotoxicity and was effectively withdrawn — never the answer."},
{id:"hy6",q:"Which pair both prolong the QT interval?",o:["Macrolides and fluoroquinolones","Beta-lactams and vancomycin","Aminoglycosides and metronidazole","Tetracyclines and TMP-SMX"],a:0,e:"Macrolides and fluoroquinolones prolong QT — assess ECG and interacting drugs for torsades risk.",p:"HIGH-YIELD: macrolides + fluoroquinolones → QT prolongation → torsades risk.",why:"Macrolides and fluoroquinolones both block the hERG potassium channel, delaying ventricular repolarization and prolonging the QT interval — the substrate for torsades de pointes. Risk compounds with hypokalemia, hypomagnesemia, bradycardia, and other QT-prolonging drugs. Beta-lactams, vancomycin, aminoglycosides, and metronidazole do not meaningfully prolong QT. On boards, QT prolongation plus a macrolide or fluoroquinolone order means stop and reassess."},
{id:"hy7",q:"Diffuse flushing during vancomycin infusion, vitals stable. Best action?",o:["Reduce the infusion rate","Discontinue vancomycin permanently","Give IV push faster","Add diphenhydramine and continue the rate"],a:0,e:"Rate-related histamine release (red man syndrome), not IgE-mediated allergy.",p:"HIGH-YIELD: red man = rate-related histamine release. Slow the infusion; avoid inappropriate allergy labeling.",why:"Rapid vancomycin infusion triggers direct, non-IgE-mediated histamine release from mast cells — it is rate-related, not an allergy. Slowing the infusion (60 to 90-plus minutes per gram) prevents recurrence; antihistamine pre-treatment is optional, not the fix. Labeling this an allergy deprives the patient of vancomycin unnecessarily and is a classic stewardship error. True IgE-mediated vancomycin allergy is rare; hypotension with bronchospasm would suggest anaphylaxis, not stable vitals with flushing."},
{id:"hy8",q:"Aminoglycoside toxicities: which statement is correct?",o:["Ototoxicity often irreversible; nephrotoxicity usually reversible","Both always reversible","Ototoxicity never occurs","Nephrotoxicity is permanent"],a:0,e:"Ototoxicity is frequently irreversible; nephrotoxicity is typically reversible with dose adjustment.",p:"HIGH-YIELD: aminoglycoside ototoxicity is often IRREVERSIBLE — act on tinnitus immediately.",why:"Aminoglycosides accumulate in inner-ear endolymph and destroy cochlear and vestibular hair cells — damage that is frequently permanent, so tinnitus or hearing change demands immediate discontinuation. Renal injury occurs via proximal tubular accumulation and is typically reversible with dose adjustment and hydration. This asymmetry drives monitoring: establish baseline hearing, because ototoxicity cannot be undone. Once-daily dosing with drug-free intervals reduces both toxicities."},
{id:"hy9",q:"MRSA bacteremia on vancomycin: trough 28 mcg/mL, creatinine rising. Best move?",o:["Switch to daptomycin","Halve the vancomycin dose","Add gentamicin","Push through — high troughs are good"],a:0,e:"Vancomycin-associated nephrotoxicity warrants switching agents; daptomycin covers bacteremia.",p:"HIGH-YIELD: vancomycin nephrotoxicity → SWITCH agents (daptomycin for bacteremia), don't just dose-reduce.",why:"A trough of 28 mcg/mL with rising creatinine is vancomycin-associated nephrotoxicity — oxidative injury to proximal tubules, amplified by concomitant piperacillin-tazobactam. Dose-reducing a nephrotoxic drug while injury is active keeps the toxin in play; switching to daptomycin removes it entirely while maintaining MRSA bacteremia coverage. Adding gentamicin stacks a second nephrotoxin — the opposite of the answer. AUC-guided dosing prevents this, but once injury occurs, change agents rather than persisting."},
{id:"hy10",q:"Uncomplicated S. aureus bacteremia: total duration?",o:["14 days from first negative blood culture","7 days total","6 weeks","Until afebrile 48 hours"],a:0,e:"Uncomplicated S. aureus bacteremia requires 14 days counted from the first negative culture.",p:"HIGH-YIELD: uncomplicated S. aureus bacteremia = 14 days FROM THE FIRST NEGATIVE blood culture.",why:"S. aureus bacteremia seeds distant sites (vertebrae, joints, endocardium) even when the patient looks well — the 14-day clock starts at the first negative blood culture because only documented clearance proves the bloodstream is sterile. Seven days is the duration for uncomplicated gram-negative bacteremia per BALANCE, not S. aureus. Six weeks is for endocarditis or metastatic infection. Counting from the first positive culture or from defervescence undercounts the true treatment course."},
{id:"hy11",q:"Suspected bacterial meningitis in a 67-year-old. Empiric regimen?",o:["Ceftriaxone + vancomycin + ampicillin","Ceftriaxone alone","Vancomycin + metronidazole","Azithromycin"],a:0,e:"Adults: ceftriaxone + vancomycin; age >50 adds ampicillin for Listeria. Dexamethasone with/before dose one.",p:"HIGH-YIELD: meningitis empiric = ceftriaxone + vancomycin; age >50 (or neonate) → ADD ampicillin; dexamethasone with/before antibiotics.",why:"Adult bacterial meningitis empiric therapy is ceftriaxone (pneumococcus, meningococcus) plus vancomycin (resistant pneumococcus) — given immediately, before the LP if necessary. Age over 50 adds Listeria risk, and ceftriaxone has zero Listeria activity, so ampicillin — a bactericidal aminopenicillin with excellent CSF penetration — is the mandatory add-on. Dexamethasone with or before the first dose blunts the inflammatory injury that causes neurologic sequelae. Metronidazole and azithromycin have no role in bacterial meningitis."},
{id:"hy12",q:"On TMP-SMX, potassium returns 5.9 mmol/L. Mechanism?",o:["Trimethoprim impairs renal potassium excretion","Sulfamethoxazole causes dehydration","Always lab error","Dietary indiscretion"],a:0,e:"Trimethoprim blocks renal potassium handling — monitor K+, especially with ACE-I/ARBs.",p:"HIGH-YIELD: trimethoprim → hyperkalemia. Check potassium, especially with ACE-I/ARBs.",why:"Trimethoprim blocks the epithelial sodium channel (ENaC) in the distal nephron — the same channel amiloride blocks — impairing potassium excretion and causing hyperkalemia. The effect is dose-dependent and amplified by ACE inhibitors, ARBs, or renal impairment. This is pharmacologic, not a lab error: repeat the BMP and hold or switch therapy. Sulfamethoxazole is not the culprit; the trimethoprim moiety drives the potassium effect."},
{id:"hy13",q:"Patient on metronidazole asks about alcohol at a wedding. Counsel?",o:["Avoid — disulfiram-like reaction","One glass is fine","Only beer is banned","Alcohol improves efficacy"],a:0,e:"Disulfiram-like reaction: severe nausea, flushing, hypotension. Avoid during and 48–72h after.",p:"HIGH-YIELD: metronidazole + alcohol = disulfiram-like reaction. Abstain during + 48–72h after.",why:"Metronidazole inhibits aldehyde dehydrogenase, blocking ethanol metabolism at acetaldehyde — producing the disulfiram-like reaction of violent nausea, flushing, tachycardia, and hypotension. The prohibition extends 48 to 72 hours after the last dose because enzyme inhibition persists. This is not a dose-dependent leniency: one glass can trigger it. Counsel firmly before the first dose, not after the wedding."},
{id:"hy14",q:"Essential doxycycline counseling includes…",o:["Upright with water, sunscreen, separate cations","Take at bedtime lying flat","Take with milk and iron","No precautions needed"],a:0,e:"Esophagitis (upright + water), photosensitivity (sunscreen), chelation (separate cations).",p:"HIGH-YIELD: doxycycline — upright with full water, sunscreen, separate calcium/iron/antacids.",why:"Doxycycline causes esophageal ulceration if it lodges — take it upright with a full glass of water and remain upright for 30 minutes. It is phototoxic, so sunscreen and sun avoidance prevent severe photodermatitis. Divalent and trivalent cations (calcium, iron, magnesium, aluminum) chelate doxycycline in the gut and gut absorption — separate by 2 to 3 hours. Bedtime dosing while lying flat and co-administration with milk or iron are the classic counseling failures."},
{id:"hy15",q:"Patient takes ciprofloxacin with morning antacids and iron. Counsel?",o:["Separate by 2h before / 6h after","Take together with milk","Double the dose","No interaction"],a:0,e:"Polyvalent cations chelate fluoroquinolones, markedly reducing absorption.",p:"HIGH-YIELD: separate fluoroquinolones from cations (Mg, Al, Ca, Fe) — 2h before or 6h after.",why:"Polyvalent cations (magnesium, aluminum, calcium, iron) chelate fluoroquinolones in the gastrointestinal lumen, forming insoluble complexes that can cut absorption by more than half. Separating ciprofloxacin 2 hours before or 6 hours after the cation preserves efficacy. Taking them together or doubling the dose does not overcome chelation chemistry. This interaction applies to all oral fluoroquinolones and to tetracyclines as well."},
{id:"hy16",q:"14 weeks pregnant with pyelonephritis. Best choice?",o:["Cephalexin","Ciprofloxacin","Doxycycline","Moxifloxacin"],a:0,e:"Fluoroquinolones are contraindicated in pregnancy (cartilage toxicity); beta-lactams are preferred.",p:"HIGH-YIELD: pregnancy — fluoroquinolones OUT (cartilage); TMP-SMX avoid near term (kernicterus).",why:"Fluoroquinolones are contraindicated in pregnancy because of cartilage toxicity in juvenile animal studies — the class warning stands regardless of human-data debates. Beta-lactams such as cephalexin or ceftriaxone are the safe backbone for pyelonephritis in pregnancy. Doxycycline risks fetal tooth discoloration and maternal hepatotoxicity. Moxifloxacin is still a fluoroquinolone, so the class warning applies; nitrofurantoin treats cystitis but never pyelonephritis."},
{id:"hy17",q:"CrCl 28 mL/min starting gentamicin. Best approach?",o:["Extended interval + level monitoring","Standard q8h dosing","Skip monitoring","Avoid levels — unnecessary"],a:0,e:"Renal impairment requires extended intervals and therapeutic drug monitoring.",p:"HIGH-YIELD renal rule: CrCl <30 on aminoglycosides → extend interval, monitor levels, keep courses short.",why:"Aminoglycoside clearance is almost entirely renal — at CrCl 28 mL/min, standard q8h dosing guarantees accumulation, nephrotoxicity, and ototoxicity. Extended-interval dosing (for example every 24 to 48 hours) with peak and trough monitoring preserves concentration-dependent killing while allowing drug-free washout periods. Skipping monitoring at this creatinine clearance is indefensible. Keep the course as short as susceptibilities allow."},
{id:"hy18",q:"Blood cultures return: MSSA, nafcillin-susceptible. Currently on vancomycin + pip-tazo. Next?",o:["De-escalate to nafcillin alone","Continue both agents","Add daptomycin","Stop all antibiotics"],a:0,e:"De-escalate to the narrowest effective agent; beta-lactams beat vancomycin for MSSA.",p:"HIGH-YIELD: cultures are truth — de-escalate to the NARROWEST effective agent.",why:"MSSA lacks mecA, so its native PBPs bind beta-lactams normally — nafcillin and cefazolin kill MSSA faster and with lower mortality than vancomycin in every comparative study. Continuing vancomycin plus piperacillin-tazobactam after MSSA is identified keeps two broader, more toxic drugs for no benefit. De-escalation is the stewardship imperative: narrow to the documented organism. Adding daptomycin or stopping everything are both wrong — treat the proven pathogen with its best drug."},
{id:"hy19",q:"BALANCE 2024 (bloodstream infection, 7 vs 14 days) found…",o:["7 days non-inferior to 14","14 days clearly superior","Only for gram-positives","No conclusion"],a:0,e:"BALANCE 2024: 7 days non-inferior to 14 days for bloodstream infection.",p:"HIGH-YIELD TRIAL: BALANCE 2024 — 7 days non-inferior to 14 for bloodstream infection. Shorter is better.",why:"The BALANCE trial randomized bloodstream-infection patients to 7 versus 14 days and found 7 days non-inferior for 90-day mortality — supporting shorter courses for uncomplicated bacteremia with adequate source control. This does not apply to S. aureus (still 14 days from the first negative culture), endocarditis, or undrained sources. The stewardship message: duration is a modifiable risk factor for resistance, C. difficile, and toxicity — treat the infection, not the calendar."}
];

function backBtn() {return '<div class="btnrow"><button class="btn ghost" id="bBackP">← Back</button></div>';}
function wireBack(){on('bBackP',function(){sndClick();renderPause();});}
function renderPearls(){
 var h='<div class="card"><h2>💎 Clinical Pearls ('+SV.pearls.length+'/'+TOTAL_PEARLS+')</h2><div class="list">';
 if(!SV.pearls.length)h+='<div class="pearlitem locked">No pearls yet — wrong answers unlock pearls. Every miss makes you sharper.</div>';
 SV.pearls.forEach(function(id){h+='<div class="pearlitem">💎 '+esc(pearlText(id))+'</div>';});
 h+='</div><div class="btnrow"><button class="btn" id="bDl">⬇ Download pearls</button></div>'+backBtn()+'</div>';
 show(h);wireBack();
 on('bDl',function(){sndClick();
  var md='# 💎 Clinical Pearls — Antibiotic Quest: Night Shift\n\n';
  SV.pearls.forEach(function(id,i){md+=(i+1)+'. '+pearlText(id)+'\n';});
  try{
   var blob=new Blob([md],{type:'text/markdown'});
   var url=URL.createObjectURL(blob);
   var a=document.createElement('a');a.href=url;a.download='night-shift-pearls.md';
   document.body.appendChild(a);a.click();
   setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},500);
   toast('⬇ Pearls downloaded!');
  }catch(e){toast('Download failed on this device');}
 });
}
function renderBestiary(){
 var h='<div class="card"><h2>👾 Bug Bestiary ('+SV.bugs.length+'/43)</h2><div class="list">';
 for(var w=0;w<5;w++){
  h+='<h3>'+esc(WINGS[w])+'</h3>';
  BUGS.forEach(function(b){
   if(b.wing!==w)return;
   if(SV.bugs.indexOf(b.id)>=0){
    h+='<div class="bugitem"><img src="'+bugImage(b,56)+'" style="border-radius:50%;vertical-align:middle;margin-right:8px" width="56" height="56"><span class="nm">'+esc(b.name)+'</span> '+gramLabel(b)+'<br>'+
     '☠️ Killed by: '+esc(b.killed)+'<br><span style="opacity:.75">'+b.traits.map(esc).join(' · ')+'</span></div>';
   }else h+='<div class="bugitem" style="opacity:.45">🔒 ??? — '+(w===4?'clear the Rooftop':'clear Wing '+w)+' to reveal</div>';
  });
 }
 h+='</div>'+backBtn()+'</div>';
 show(h);wireBack();
}
function renderPalace(){
 var h='<div class="card"><h2>🧠 Memory Palace ('+SV.charms.length+'/16)</h2><div class="list">';
 CHARMS.forEach(function(c){
  if(SV.charms.indexOf(c.id)>=0)
   h+='<div class="charmitem">✨ <b>'+esc(c.code+' — '+c.title)+'</b><br>'+esc(c.text)+'</div>';
  else h+='<div class="charmitem locked">🔒 Charm '+esc(c.code)+' — find it glowing in Wing '+c.wing+'</div>';
 });
 h+='</div>'+backBtn()+'</div>';
 show(h);wireBack();
}

/* ---------- boot & main loop ---------- */
function dailyCheck(){
 var t=todayStr();
 heartTick();
 if(SV.lastPlayed&&SV.lastPlayed!==t){
  if(SV.lastPlayed===yesterdayStr()){
   SV.streakAtRisk=true;SV._returnMsg=pick(MASCOT.return);
  }else{
   SV.streakDays=1;SV._freshMsg='Fresh start — the night shift believes in you!';
  }
  save();
 }
}
var lastT=0,lastFrameTs=0,_zbv=null;
function syncZoomBox(){var v=G.mode==='play';if(v!==_zbv){_zbv=v;var zb=$('zoomBox');if(zb)zb.style.display=v?'flex':'none';}}
function loop(ts){
 if(SV.flight){if(ts-lastFrameTs<33){requestAnimationFrame(loop);return;}lastFrameTs=ts;}
 var dt=Math.min(0.05,(ts-lastT)/1000||0.016);lastT=ts;
 update(dt);
 updateFx(dt,ts/1000);
 syncZoomBox();
 if(G.mode==='play'||G.mode==='talk'||G.mode==='chart'||G.mode==='quiz'||G.mode==='skirmish'||G.mode==='boss'||G.mode==='bossintro'||G.mode==='charm'||G.mode==='pause'){
  drawWorld(ts/1000);
 }
 requestAnimationFrame(loop);
}
fitCanvas();
dailyCheck();
renderTitle();
requestAnimationFrame(loop);
