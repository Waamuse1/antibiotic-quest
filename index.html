<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌙 Antibiotic Quest: Night Shift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#03060c;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#e8eef7;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03060c}
#stage{position:relative;width:100dvw;height:100dvh}
body.portrait #stage{width:100dvw;height:100dvh;max-height:none;aspect-ratio:auto}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#04121a}
/* ---------- touch controls ---------- */
#touch{position:absolute;left:0;right:0;bottom:2%;display:flex;justify-content:space-between;padding:0 3%;pointer-events:none;z-index:30}
.tgrp{display:flex;gap:10px;pointer-events:auto}
.tbtn{width:64px;height:64px;border-radius:50%;background:rgba(20,30,48,.55);border:2px solid rgba(140,180,255,.5);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#btnL,#btnR{display:none}/* finger-drag replaces arrow buttons */
.tbtn:active{background:rgba(60,110,200,.7)}
#btnAct{width:84px;border-radius:18px;font-size:15px;font-weight:700;flex-direction:column;line-height:1.1}
#btnAct small{font-size:10px;font-weight:400;opacity:.85}
/* ---------- pause button ---------- */
#pauseBtn{position:absolute;top:2%;right:2%;z-index:40;width:44px;height:44px;border-radius:12px;background:rgba(20,30,48,.6);border:2px solid rgba(140,180,255,.5);color:#fff;font-size:22px;display:none;align-items:center;justify-content:center}
/* ---------- camera zoom buttons ---------- */
#zoomBox{position:absolute;top:15%;left:2%;z-index:35;display:none;flex-direction:column;gap:8px}
.zbtn{width:42px;height:42px;border-radius:50%;background:rgba(20,30,48,.6);border:2px solid rgba(140,180,255,.5);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center}
.zbtn:active{background:rgba(60,110,200,.7)}
/* ---------- rotate hint / fades / wing banner ---------- */
#rotateHint{position:absolute;top:2%;left:50%;transform:translateX(-50%);z-index:45;display:none;background:rgba(10,22,40,.9);border:2px solid #ffd76a;color:#ffd76a;border-radius:12px;padding:6px 14px;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s ease-out;z-index:48}
#wingBanner{position:absolute;top:-80px;left:50%;transform:translateX(-50%);z-index:46;background:rgba(10,22,40,.94);border:2px solid #4aa3ff;color:#fff;border-radius:14px;padding:10px 22px;font-size:17px;font-weight:800;white-space:nowrap;pointer-events:none;transition:top .45s cubic-bezier(.2,1.2,.4,1),opacity .4s}
#wingBanner.show{top:9%}
.bossdrop{animation:bossdrop .65s cubic-bezier(.2,1.3,.4,1)}
@keyframes bossdrop{0%{transform:translateY(-160px) scale(1.3);opacity:0}60%{transform:translateY(8px) scale(1);opacity:1}80%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.tauntslide{animation:tauntslide .5s ease-out}
@keyframes tauntslide{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(2,6,12,.72);padding:3vmin}
#overlay.on{display:flex}
.card{background:#0d1626;border:2px solid #2c4a7c;border-radius:16px;max-width:640px;width:min(94vw,640px);max-height:94dvh;overflow-y:auto;padding:18px 20px;box-shadow:0 0 40px rgba(40,90,200,.35);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-size:20px;margin-bottom:8px;color:#bfe0ff}
.card h3{font-size:16px;margin:12px 0 6px;color:#9fc3f0}
.card p{font-size:15px;line-height:1.5;margin:8px 0}
.talk{font-style:italic;background:#13233d;border-left:4px solid #4aa3ff;padding:10px 12px;border-radius:0 10px 10px 0}
.chart{background:#101b30;border:1px solid #2c4a7c;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;white-space:pre-wrap}
.q{font-size:17px;font-weight:700;margin:10px 0;color:#fff}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{background:#16294a;border:2px solid #33507f;border-radius:10px;padding:10px 12px;font-size:15px;color:#e8eef7;text-align:left;cursor:pointer}
.opt:active{background:#23406e}
.opt.right{border-color:#3ddc84;background:#123b28}
.opt.wrongpick{border-color:#ff5d5d;background:#3d1518}
.banner{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;line-height:1.5}
.banner.good{background:#103b26;border:1px solid #3ddc84}
.banner.bad{background:#3d1518;border:1px solid #ff5d5d}
.pearl{background:#2a1f0d;border:1px solid #d8a93f;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.5}
.guide-review{background:#0e2233;border:1px solid #4aa3ff;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.5;text-align:left}
.guide-review ul{margin:8px 0 2px;padding-left:20px}
.guide-review li{margin:6px 0}
.pearl b{color:#ffd76a}
.whybox{background:#101a2e;border:1px solid #7b9cf0;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.55;text-align:left}
.whybox b{color:#9db8e8}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{background:#2c6fe0;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:700;padding:12px 18px;cursor:pointer}
.btn:active{background:#1d4fa8}
.btn.ghost{background:#1a2740;border:2px solid #33507f}
.hpbar{height:18px;background:#3d1518;border-radius:9px;overflow:hidden;margin:8px 0;border:1px solid #7c2c2c}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5d5d,#ff9d5d);transition:width .3s}
.bossemoji{font-size:72px;text-align:center;animation:bossbob 1.6s ease-in-out infinite}
@keyframes bossbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bossemoji.hurt{animation:bosshurt .4s}
@keyframes bosshurt{0%{transform:translateX(0) scale(1)}25%{transform:translateX(-14px) scale(1.15);filter:brightness(2)}50%{transform:translateX(12px)}100%{transform:translateX(0) scale(1)}}
.list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pearlitem{background:#141f36;border:1px solid #2c4a7c;border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.45}
.pearlitem.locked{opacity:.4;font-style:italic}
.bugitem{background:#141f36;border:1px solid #2c4a7c;border-radius:8px;padding:8px 10px;font-size:13.5px}
.bugitem .nm{font-weight:700;font-size:15px}
.charmitem{background:#14240f;border:1px solid #4a7c2c;border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.45}
.charmitem.locked{opacity:.4}
.charmitem b{color:#b8f07a}
.tipline{background:#13233d;border:1px dashed #4aa3ff;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0;line-height:1.5}
.prompt{position:absolute;z-index:20;transform:translate(-50%,-100%);background:rgba(10,20,38,.85);border:2px solid #4aa3ff;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;pointer-events:none;white-space:nowrap;display:none}
.titlecard{text-align:center}
.briefcard{background:rgba(90,140,255,.10);border:1px solid rgba(140,180,255,.35);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14px;line-height:1.5;color:#dbe6ff;text-align:left}
.briefcard b{color:#ffd76a}
.titlecard h1{font-size:30px;margin:6px 0 2px;color:#fff;text-shadow:0 0 18px rgba(90,160,255,.8)}
.titlecard .sub{opacity:.75;margin-bottom:10px}
.bigbtn{font-size:18px;padding:14px 26px;margin:6px}
.rankline{font-size:15px;margin:8px 0;color:#ffd76a}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat{background:#141f36;border-radius:8px;padding:8px;font-size:14px}
.kbd{background:#1a2740;border:1px solid #33507f;border-radius:6px;padding:2px 8px;font-family:monospace}
.xpbar{height:14px;background:#1a2740;border-radius:7px;overflow:hidden;margin:6px 0;border:1px solid #33507f}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#2c6fe0,#7ad0ff)}
.flash{animation:flash .5s}
@keyframes flash{0%{filter:brightness(2.5)}100%{filter:brightness(1)}}
@media (max-height:500px){.card{padding:12px 14px}.card h2{font-size:17px}.tbtn{width:54px;height:54px;font-size:22px}}
/* ---------- narrow / zoomed phone screens: compact cards, sticky actions ---------- */
@media (max-width:560px){
 .card{padding:12px 13px;font-size:14px;max-height:94%}
 .card h2{font-size:clamp(16px,4.6vmin,20px);margin-bottom:6px}
 .card h3{font-size:clamp(13px,3.8vmin,16px);margin:8px 0 4px}
 .card p{font-size:clamp(13px,3.9vmin,15px);line-height:1.45;margin:6px 0}
 .talk{font-size:clamp(13px,3.9vmin,15px);padding:8px 10px}
 .chart{font-size:clamp(11px,3.3vmin,13.5px);line-height:1.55;padding:8px 10px}
 .q{font-size:clamp(14px,4.2vmin,17px);margin:8px 0}
 .opts{gap:6px;margin-top:8px}
 .opt{padding:9px 10px;font-size:clamp(13px,3.9vmin,15px)}
 .banner,.pearl,.whybox{font-size:clamp(12.5px,3.7vmin,14px);padding:8px 10px;margin:8px 0;line-height:1.4}
 .tipline{font-size:clamp(12.5px,3.7vmin,14px);padding:8px 10px;margin:8px 0}
 .btnrow{position:sticky;bottom:0;background:#0d1626;padding:10px 2px 4px;margin-top:8px;z-index:2}
 .btn{padding:10px 14px;font-size:clamp(14px,4.1vmin,16px)}
 .bigbtn{font-size:clamp(15px,4.4vmin,18px);padding:12px 20px}
 .titlecard h1{font-size:clamp(22px,6.4vmin,30px)}
 .bossemoji{font-size:56px}
 .list{max-height:52vh}
 .pearlitem,.bugitem,.charmitem{font-size:clamp(12px,3.6vmin,13.5px);padding:7px 9px}
 .statgrid{grid-template-columns:1fr 1fr;gap:6px}
 .stat{font-size:clamp(12px,3.6vmin,14px);padding:7px}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="prompt" id="prompt"></div>
    <button id="pauseBtn" aria-label="Pause">⏸️</button>
    <div id="zoomBox">
      <div class="zbtn" id="zoomIn" aria-label="Zoom in">🔍+</div>
      <div class="zbtn" id="zoomOut" aria-label="Zoom out">🔍−</div>
    </div>
    <div id="rotateHint">🔄 Landscape = cinema view</div>
    <div id="wingBanner"></div>
    <div id="fade"></div>
    <div id="touch">
      <div class="tgrp">
        <div class="tbtn" id="btnL">◀</div>
        <div class="tbtn" id="btnR">▶</div>
      </div>
      <div class="tgrp">
        <div class="tbtn" id="btnFire">💊</div>
        <div class="tbtn" id="btnJ">⤒</div>
        <div class="tbtn" id="btnAct">ACTION<small id="actLabel">—</small></div>
      </div>
    </div>
    <div id="overlay"></div>
  </div>
</div>

{"id":"syph","name":"Treponema pallidum","emoji":"🌀","wing":1,"gram":"none","hunt":"Beta-lactams","killed":"Benzathine penicillin G 2.4M units IM single dose (early syphilis)","site":"Genital chancre, then disseminated","morph":"spiral","dose":"Benzathine penicillin G 2.4M units IM x1 (early); 3 weekly doses (late latent)","odose":"No oral alternative — must receive IM penicillin","traits":["Thin spirochete — invisible on Gram stain, seen on darkfield","Painless chancre → secondary rash on palms/soles → latent → tertiary"],"clue":"Painless genital ulcer. Darkfield: thin corkscrew spirochetes."},];
var WORLDS=[{"emoji":"🧱","name":"Beta-Lactam Bastion","intro":"The Resistance Legion has breached the Outer Wall! You are the Pharmacist-Hero, defender of the Body Kingdom. Your first weapons: the Beta-Lactam Blades. Master them — then face the MRSA Marauder in his fortress.","scrolls":[{"t":"⚔️ How Beta-Lactams Kill","b":["Bind penicillin-binding proteins (PBPs), inhibiting transpeptidation","Block peptidoglycan cross-linking → loss of wall integrity → osmotic LYSIS","Bactericidal","Time-dependent killing: efficacy correlates with time above the MIC","Active only against organisms actively synthesizing peptidoglycan"]},{"t":"🛡️ The Arsenal","b":["Penicillin G / amoxicillin: strep, meningococcus, syphilis (+ clavulanate bodyguard = broader)","Nafcillin / oxacillin: MSSA specialists — NOT MRSA!","Piperacillin-tazobactam: broad, including Pseudomonas","Cephalosporins 1st→5th: cefazolin (skin/MSSA) … ceftaroline (the MRSA-active one!)","Carbapenems (meropenem/imipenem): nearly everything; ertapenem skips Pseudomonas","Aztreonam: gram-negatives ONLY — safe in penicillin allergy"]},{"t":"☠️ Adverse Effects & Resistance","b":["Most common: hypersensitivity reactions, ranging from rash to anaphylaxis","Neurotoxicity/seizures at elevated doses or in renal impairment (highest with imipenem); C. difficile risk","Prolonged nafcillin/oxacillin courses: neutropenia","Resistance: beta-lactamases (ESBL, AmpC, KPC) hydrolyze the beta-lactam ring","Resistance: altered PBPs — mecA encodes PBP2a with low beta-lactam affinity","Beta-lactamase inhibitors (clavulanate, sulbactam, tazobactam) act as suicide substrates"]}],"qs":[{"q":"Penicillin's killing blow works by…","o":["Binding PBPs and blocking peptidoglycan cross-linking","Blocking 50S protein synthesis","Shredding bacterial DNA","Starving the cell of folate"],"a":0,"e":"Beta-lactams bind penicillin-binding proteins (PBPs), inhibiting peptidoglycan cross-linking; loss of cell-wall integrity causes osmotic lysis.","p":"Beta-lactams are bactericidal with time-dependent killing; efficacy correlates with time above the MIC.","why":"Beta-lactams such as penicillin bind penicillin-binding proteins (PBPs), the transpeptidases that cross-link peptidoglycan strands during cell-wall assembly. Blocking cross-linking produces a structurally defective wall, and the actively growing bacterium dies by osmotic lysis, which is why beta-lactams are bactericidal rather than bacteriostatic. The distractors describe other classes: 50S binding is macrolides and lincosamides, DNA gyrase inhibition is fluoroquinolones, and folate blockade is trimethoprim-sulfamethoxazole. Pharmacodynamically, beta-lactams exhibit time-dependent killing, so efficacy tracks the fraction of the dosing interval that free drug stays above the MIC, which is why frequent dosing or prolonged infusions matter more than large peaks."},{"q":"MSSA cellulitis, no allergy. Best beta-lactam?","o":["Nafcillin / oxacillin (or cefazolin)","Penicillin G","Aztreonam","Ertapenem"],"a":0,"e":"S. aureus produces penicillinase, inactivating penicillin G; use penicillinase-resistant nafcillin/oxacillin or cefazolin.","p":"Penicillin G is inactivated by staphylococcal penicillinase; MSSA requires nafcillin, oxacillin, or cefazolin.","why":"Staphylococcus aureus produces beta-lactamase (penicillinase), which hydrolyzes the beta-lactam ring of penicillin G and renders it useless. The antistaphylococcal penicillins nafcillin and oxacillin resist that enzyme, and cefazolin is equally effective for MSSA, so either is the correct beta-lactam here. Aztreonam is a gram-negative-only monobactam with no staphylococcal activity, making it a tempting but wrong answer for someone fixated on beta-lactam allergies. Ertapenem is unnecessarily broad and adds nothing for MSSA, so per IDSA skin-and-soft-tissue guidance, the narrow penicillinase-resistant agent wins."},{"q":"Which cephalosporin kills MRSA?","o":["Ceftaroline","Ceftriaxone","Cefepime","Cefazolin"],"a":0,"e":"Fifth-generation ceftaroline binds PBP2a; it is the only cephalosporin with MRSA activity.","p":"Ceftaroline is the only cephalosporin with MRSA activity, via PBP2a binding.","why":"Ceftaroline is a fifth-generation cephalosporin with high affinity for PBP2a, the altered transpeptidase encoded by mecA that confers methicillin resistance in MRSA. Ceftriaxone, cefepime, and cefazolin bind only normal PBPs, so mecA makes the organism resistant to all of them while ceftaroline retains activity. It is the only cephalosporin with reliable MRSA activity, approved for acute bacterial skin infections and community-acquired pneumonia. Note it is not approved for MRSA bacteremia or endocarditis despite in-vitro activity, so do not extrapolate this pearl to bloodstream infections."},{"q":"Penicillin anaphylaxis history, needs gram-negative coverage. Safest pick?","o":["Aztreonam","Piperacillin-tazobactam","Meropenem","Amoxicillin-clavulanate"],"a":0,"e":"Aztreonam is a monobactam with gram-negative-only activity and no cross-reactivity with penicillin.","p":"Aztreonam covers gram-negatives only and lacks cross-reactivity in penicillin anaphylaxis.","why":"Aztreonam is a monobactam whose single-ring structure shares no side chains with penicillin, so it has no meaningful cross-reactivity even in patients with penicillin anaphylaxis. It kills gram-negatives by binding PBP3, which makes it the safe pick when gram-negative coverage is needed and the beta-lactam ring is forbidden. Piperacillin-tazobactam, meropenem, and amoxicillin-clavulanate all contain a beta-lactam ring with cross-reactivity risk that is unacceptable with an anaphylaxis history. Remember aztreonam has no gram-positive or anaerobic activity, so never use it alone when those organisms are in play."},{"q":"ESBL-producing E. coli laughs at ceftriaxone. Why?","o":["It makes beta-lactamase enzymes that destroy the drug","It thickened its cell wall","It pumps out every drug made","It stopped growing entirely"],"a":0,"e":"ESBLs hydrolyze the beta-lactam ring of penicillins and most cephalosporins.","p":"ESBLs hydrolyze penicillins and most cephalosporins; carbapenems are the treatment of choice.","why":"Extended-spectrum beta-lactamases are plasmid-mediated enzymes that hydrolyze the beta-lactam ring of penicillins, aztreonam, and nearly all cephalosporins including ceftriaxone, which is why the organism laughs at it. This is enzymatic destruction of the drug, not a thicker wall (that is the VISA phenotype) or efflux. Because ESBLs are poorly inhibited by clavulanate and tazobactam in serious infections, carbapenems such as meropenem are the treatment of choice per IDSA guidance for ESBL bloodstream and tissue infections. Recognizing the mechanism matters because it predicts the whole susceptibility pattern, not just ceftriaxone."}],"boss":{"name":"MRSA Marauder","emoji":"🦠","taunts":["You think your puny penicillins scare me? I've got mecA armor!","My beta-lactamases feast on your little blades!","The Body Kingdom will fall, Pharmacist!"],"case":"A 45-year-old man has rapidly spreading NONPURULENT cellulitis of the leg. No abscess, no MRSA risk factors, vitals stable. The Marauder's scouts were reported nearby…","qs":[{"q":"Choose your weapon for empiric therapy:","o":["Cephalexin","Trimethoprim-sulfamethoxazole","Doxycycline","Azithromycin"],"a":0,"e":"Nonpurulent cellulitis without MRSA risk factors is typically streptococcal — a beta-lactam such as cephalexin.","p":"Nonpurulent cellulitis without MRSA risk: beta-lactam for streptococci; reserve MRSA-active agents for purulent infections.","why":"Nonpurulent cellulitis without MRSA risk factors is overwhelmingly caused by beta-hemolytic streptococci, usually Streptococcus pyogenes, so empiric therapy targets strep rather than MRSA. Cephalexin, a first-generation cephalosporin with strong streptococcal and MSSA activity, is the correct empiric weapon per IDSA skin-and-soft-tissue guidelines. Trimethoprim-sulfamethoxazole and doxycycline are tempting MRSA-active choices, but both have unreliable activity against S. pyogenes, so they fail the actual pathogen here. Azithromycin adds nothing and macrolide resistance in streptococci is rising."},{"q":"TWIST: he says amoxicillin once closed his throat — anaphylaxis. Now?","o":["Clindamycin","Cefazolin — cephalosporins are fine","Aztreonam","High-dose amoxicillin"],"a":0,"e":"True penicillin anaphylaxis warrants avoidance of penicillins and cephalosporins; per IDSA guidance, clindamycin is appropriate for cellulitis, while aztreonam covers gram-negatives only.","p":"Penicillin anaphylaxis: avoid cephalosporins as well; clindamycin covers cellulitis, aztreonam gram-negatives only.","why":"A history of true penicillin anaphylaxis means avoiding penicillins and, per guideline-conservative practice, cephalosporins as well, because shared beta-lactam side chains carry cross-reactivity risk. Clindamycin binds the 50S subunit and covers both streptococci and MSSA, making it the IDSA-endorsed option for cellulitis when beta-lactams are off the table. Cefazolin is not safe here despite being a cephalosporin, and aztreonam is a tempting allergy-safe answer that fails because it covers only gram-negatives. High-dose amoxicillin is simply rechallenge and risks fatal anaphylaxis."},{"q":"Day 3: erythema receding, afebrile, cultures negative. Your call?","o":["5 days total, then stop","14 days of IV therapy","Switch to vancomycin to be safe","Continue until the leg looks perfect"],"a":0,"e":"Per IDSA guidance, 5 days suffices for uncomplicated cellulitis when improving; prolonged courses select for resistance.","p":"Uncomplicated cellulitis: 5 days if improving. Assess MRSA risk factors before broadening empiric coverage.","why":"Per IDSA skin-and-soft-tissue guidelines, uncomplicated cellulitis that is clearly improving needs only 5 days of therapy total. Extending to 14 days of IV therapy or continuing until the leg looks perfect adds cost, line risk, and resistance selection without benefit. Switching to vancomycin to be safe is defensive medicine that exposes the patient to nephrotoxicity and ototoxicity for no MRSA indication. The clinical pearl is to treat the patient, not the erythema: afebrile with receding borders means stop at day five."}]}},{"emoji":"🎷","name":"Macrolide Melody Halls","intro":"Atypical invaders slip past the walls — too strange for normal sentries to see! The Mycoplasma Menace and his spies strike the lungs from the shadows. Your new weapons: the Macrolide Melodies — songs that jam the enemy's factories.","scrolls":[{"t":"🎵 How Macrolides Kill","b":["Bind the 50S ribosomal subunit, inhibiting translocation","Block translocation, arresting protein synthesis","Predominantly BACTERIOSTATIC","Achieve high intracellular concentrations → active against intracellular atypicals","Azithromycin piles into tissues; long half-life (Z-pack = 5 days)"]},{"t":"🎯 Targets","b":["Atypicals: Mycoplasma, Chlamydophila, Legionella","Clarithromycin: key player in H. pylori triple therapy","Azithromycin: atypical CAP coverage, chlamydia STI","Pertussis (whooping cough)","Erythromycin: the old soldier, mostly replaced (GI misery)"]},{"t":"☠️ Adverse Effects & Resistance","b":["QT-interval prolongation → torsades de pointes risk; assess baseline ECG and interacting drugs","Erythromycin: GI upset via motilin-receptor agonism","Clarithromycin and erythromycin inhibit CYP3A4; azithromycin does not","Resistance: erm-mediated 50S ribosomal methylation","Resistance: mef-mediated efflux"]}],"qs":[{"q":"Macrolides kill (stall) by…","o":["Binding the 50S subunit, blocking protein synthesis","Binding PBPs","Inhibiting DNA gyrase","Blocking folate synthesis"],"a":0,"e":"Macrolides bind the 50S ribosomal subunit, inhibiting translocation during protein synthesis.","p":"Macrolides inhibit protein synthesis via 50S binding and are predominantly bacteriostatic.","why":"Macrolides bind the 50S ribosomal subunit at the peptidyl transferase center and block translocation, stalling protein synthesis in a bacteriostatic fashion. PBP binding is the beta-lactam mechanism, DNA gyrase inhibition is fluoroquinolones, and folate blockade is trimethoprim-sulfamethoxazole. The 50S target explains the classic cross-resistance pattern: erm-mediated methylation of the ribosome confers resistance to macrolides, lincosamides, and streptogramin B as a group. This is high-yield because the mechanism predicts both the spectrum and the resistance phenotype."},{"q":"Atypical pneumonia (Mycoplasma). Weapon?","o":["Azithromycin","Amoxicillin","Vancomycin","Nitrofurantoin"],"a":0,"e":"Mycoplasma lacks a cell wall, rendering beta-lactams and vancomycin ineffective; macrolides achieve intracellular concentrations.","p":"Organisms lacking a cell wall (Mycoplasma) require macrolides, doxycycline, or respiratory fluoroquinolones.","why":"Mycoplasma pneumoniae has no cell wall, so beta-lactams like amoxicillin and glycopeptides like vancomycin are intrinsically useless against it. Azithromycin concentrates inside cells and respiratory tissues, reaching the intracellular niche where Mycoplasma lives, and its atypical coverage makes it the standard weapon. Nitrofurantoin achieves meaningful concentrations only in urine, so it is irrelevant to pneumonia. Per ATS and IDSA community-acquired pneumonia guidelines, atypical features demand a macrolide, doxycycline, or respiratory fluoroquinolone, never a beta-lactam alone."},{"q":"Patient on simvastatin needs a macrolide. Safest?","o":["Azithromycin","Clarithromycin","Erythromycin","No macrolide is safe with statins"],"a":0,"e":"Clarithromycin and erythromycin inhibit CYP3A4, raising statin exposure and rhabdomyolysis risk; azithromycin does not.","p":"Clarithromycin and erythromycin are CYP3A4 inhibitors (caution with statins); azithromycin is not.","why":"Clarithromycin and erythromycin are potent CYP3A4 inhibitors that raise simvastatin exposure and can precipitate rhabdomyolysis and acute renal failure. Azithromycin does not meaningfully inhibit CYP3A4, so it is the safe macrolide choice for a patient on a CYP3A4-metabolized statin. The distractor claiming no macrolide is safe is wrong: the interaction is specific to the CYP3A4-inhibiting members of the class. This is a classic board-exam drug interaction because the mechanism is pharmacokinetic, not pharmacodynamic, and the fix is simply choosing the right macrolide."},{"q":"Erythromycin's notorious GI cramping happens because it…","o":["Stimulates motilin receptors","Kills gut flora","Causes stomach ulcers","Blocks folate absorption"],"a":0,"e":"Erythromycin is a motilin-receptor agonist causing GI hypermotility; low doses are used as a prokinetic.","p":"Erythromycin stimulates motilin receptors, causing cramping and diarrhea — counsel accordingly.","why":"Erythromycin is a motilin-receptor agonist that stimulates gastrointestinal hypermotility, which is why cramping, nausea, and diarrhea are its notorious adverse effects. Low doses are even used therapeutically as a prokinetic for gastroparesis, which confirms the mechanism is receptor-mediated rather than antimicrobial. It does not kill gut flora to cause the cramping, cause ulcers, or block folate absorption. This is why erythromycin is the macrolide most associated with GI intolerance, and why azithromycin is better tolerated."},{"q":"Pneumococcus resists azithromycin via the erm gene. How?","o":["Methylates the 50S target so the drug can't bind","Makes beta-lactamase","Thickens its cell wall","Destroys the drug with enzymes"],"a":0,"e":"erm-mediated 50S ribosomal methylation prevents macrolide binding.","p":"erm-mediated 50S methylation confers macrolide resistance via target modification.","why":"The erm gene encodes a methyltransferase that methylates the 23S rRNA of the 50S subunit, the exact binding site of macrolides, so azithromycin can no longer dock. This produces the MLS-B phenotype: resistance to macrolides, lincosamides like clindamycin, and streptogramin B, all of which share the site. It is target modification, not enzymatic destruction of the drug or wall thickening. Efflux via mef genes is the alternative mechanism but gives a narrower phenotype, so erm predicts clindamycin resistance too, which matters when clindamycin is the backup plan."}],"boss":{"name":"Mycoplasma Menace","emoji":"👾","taunts":["You can't hit what you can't see! I have no wall!","Your beta-lactams pass right through me, hero!","Cough… cough… the lungs are MINE!"],"case":"A 28-year-old has 1 week of dry cough, low-grade fever, headache. Chest X-ray: patchy infiltrates. Classic 'walking pneumonia'. The Menace giggles in the shadows…","qs":[{"q":"Empiric weapon?","o":["Azithromycin","Amoxicillin","Ceftriaxone","Metronidazole"],"a":0,"e":"Atypical features warrant a macrolide; beta-lactams are ineffective against cell-wall-deficient Mycoplasma.","p":"Subacute dry cough with patchy infiltrates suggests atypical pneumonia — azithromycin or doxycycline.","why":"Atypical pneumonia features such as dry cough, extrapulmonary symptoms, or interstitial patterns point to Mycoplasma, which lacks a cell wall and is therefore immune to beta-lactams like amoxicillin and ceftriaxone. Azithromycin is the empiric weapon because it concentrates intracellularly and covers atypical organisms. Metronidazole covers only anaerobes and has no respiratory atypical activity. The IDSA and ATS community-acquired pneumonia guidelines specifically endorse macrolide monotherapy for healthy outpatients with suspected atypical pneumonia."},{"q":"TWIST: ECG shows prolonged QT, and he takes simvastatin.","o":["Doxycycline","Azithromycin anyway","Clarithromycin","IV erythromycin"],"a":0,"e":"QT prolongation + CYP3A4 substrate on board → dodge macrolides. Doxycycline covers atypicals safely.","p":"QT prolongation or CYP3A4 substrates on board → dodge macrolides; doxycycline covers atypicals.","why":"Macrolides prolong the QT interval, and adding azithromycin to a patient with baseline QT prolongation risks torsades de pointes. Clarithromycin compounds the danger by inhibiting CYP3A4 and raising simvastatin levels, and IV erythromycin carries the highest torsades risk of the class. Doxycycline covers atypical organisms including Mycoplasma and Legionella without QT prolongation or CYP3A4 inhibition, making it the safe pivot. This is the classic board-exam scenario testing that you know both the cardiac and the pharmacokinetic liabilities of macrolides."},{"q":"Lab calls: Legionella urinary antigen POSITIVE.","o":["Continue azithromycin — it kills Legionella","Switch to amoxicillin","Add vancomycin","Stop antibiotics — must be viral"],"a":0,"e":"Azithromycin covers Legionella. The positive antigen confirms your weapon — don't switch.","p":"Azithromycin covers Legionella. A positive urinary antigen CONFIRMS your pick — continue the current regimen.","why":"A positive Legionella urinary antigen confirms infection with Legionella pneumophila serogroup 1, an intracellular pathogen that lives inside alveolar macrophages. Azithromycin concentrates intracellularly and is highly active against Legionella, so the antigen result validates rather than changes the empiric choice. Switching to amoxicillin would be a disaster: beta-lactams cannot reach intracellular organisms and have no atypical coverage. Adding vancomycin or stopping antibiotics abandons a regimen that is already correct, so per ATS and IDSA guidance, continue the macrolide."}]}},{"emoji":"⚡","name":"Fluoroquinolone Storm Peaks","intro":"The Pseudomonas Punisher floods the urinary gates with his gram-negative horde! You forge Lightning Blades that target bacterial DNA replication itself. But beware, hero — these blades are cursed and can wound the wielder.","scrolls":[{"t":"⚡ How Fluoroquinolones Kill","b":["Inhibit DNA gyrase and topoisomerase IV","Bactericidal via inhibition of DNA replication","CONCENTRATION-dependent killing: efficacy correlates with peak concentration","Post-antibiotic effect suppresses regrowth after drug removal"]},{"t":"🎯 The Arsenal","b":["Ciprofloxacin: Pseudomonas + UTIs — the urinary blade","Levofloxacin: RESPIRATORY — pneumonia blade","Moxifloxacin: anaerobes… but NO Pseudomonas","Memory hook: Cipro = pee, Levo = lungs, Moxi = mixed"]},{"t":"☠️ Curses & Enemy Armor","b":["FDA boxed warnings: tendinopathy/rupture, peripheral neuropathy, CNS effects (seizures, confusion)","Aortic aneurysm/dissection, hypoglycemia — rare but real","Divalent/trivalent cations (antacids, iron, calcium, magnesium) chelate fluoroquinolones — separate administration","Avoid in pregnancy and children (cartilage toxicity in animal models)","C. difficile risk","Resistance: gyrA/parC target mutations, efflux pumps, qnr plasmid genes"]}],"qs":[{"q":"Fluoroquinolones kill by…","o":["Inhibiting DNA gyrase / topoisomerase IV","Binding the 30S subunit","Binding PBPs","Blocking folate synthesis"],"a":0,"e":"Fluoroquinolones inhibit DNA gyrase and topoisomerase IV, arresting DNA replication.","p":"Fluoroquinolones are bactericidal with concentration-dependent killing.","why":"Fluoroquinolones inhibit DNA gyrase in gram-negatives and topoisomerase IV in gram-positives, enzymes that manage DNA supercoiling during replication. Blocking them arrests DNA synthesis and is bactericidal. They exhibit concentration-dependent killing, so efficacy tracks the peak-to-MIC or AUC-to-MIC ratio rather than time above MIC. The 30S, PBP, and folate distractors belong to aminoglycosides, beta-lactams, and trimethoprim-sulfamethoxazole respectively."},{"q":"Uncomplicated cystitis, outpatient. Which fluoroquinolone?","o":["Ciprofloxacin","Levofloxacin","Moxifloxacin","Azithromycin"],"a":0,"e":"Ciprofloxacin is preferred for urinary indications including Pseudomonas; reserve respiratory fluoroquinolones for pneumonia.","p":"Cipro = urinary + Pseudomonas. Levo = lungs. Moxi = anaerobes, no Pseudomonas.","why":"Ciprofloxacin is the fluoroquinolone of choice for urinary indications because it concentrates well in urine and covers Pseudomonas, the feared uropathogen in complicated cases. Levofloxacin and moxifloxacin are respiratory fluoroquinolones reserved for pneumonia per antimicrobial stewardship, and moxifloxacin actually has poor urinary excretion. Azithromycin has no meaningful urinary activity. Per IDSA urinary tract infection guidance, using cipro for cystitis preserves the respiratory agents for the lungs."},{"q":"Patient takes daily antacids + iron. Cipro counseling?","o":["Separate cipro 2h before / 6h after cations","Take it together with milk","Double the dose","No interaction exists"],"a":0,"e":"Magnesium, aluminum, calcium, and iron chelate fluoroquinolones, markedly reducing absorption.","p":"Polyvalent cations chelate fluoroquinolones; separate administration is required.","why":"Magnesium, aluminum, calcium, and iron form insoluble chelation complexes with fluoroquinolones in the gut, markedly reducing absorption and risking treatment failure. Counsel the patient to take ciprofloxacin at least 2 hours before or 6 hours after antacids, iron, calcium, or dairy. Taking it with milk or doubling the dose does not overcome chelation, and there is no scenario where the interaction simply does not exist. This is one of the most testable counseling points in infectious diseases pharmacy."},{"q":"Which toxicity is NOT linked to fluoroquinolones?","o":["Red man syndrome","Tendon rupture","Aortic dissection","Peripheral neuropathy"],"a":0,"e":"Red man syndrome is specific to vancomycin infusion; fluoroquinolone toxicities include tendinopathy, neuropathy, aortic injury, CNS effects, and dysglycemia.","p":"Red man syndrome is vancomycin-specific. Fluoroquinolone toxicities: tendinopathy, neuropathy, aortic injury, CNS effects, dysglycemia.","why":"Red man syndrome is a rate-related histamine reaction specific to vancomycin infusion and has nothing to do with fluoroquinolones. The genuine fluoroquinolone toxicities include tendinopathy and tendon rupture, aortic dissection and aneurysm, peripheral neuropathy that may be irreversible, CNS effects including seizures and confusion, dysglycemia, and QT prolongation. The FDA has issued boxed warnings on several of these, and they drive the IDSA recommendation to reserve fluoroquinolones for situations where safer agents will not do. Knowing the full toxicity list is how you recognize which adverse effect does not belong."},{"q":"Pseudomonas resists cipro via a gyrA mutation. Meaning?","o":["The target enzyme changed — the drug can't bind","It made beta-lactamase","It thickened its wall","It stopped absorbing drugs"],"a":0,"e":"gyrA/parC mutations alter the fluoroquinolone target; efflux pumps and qnr plasmid genes confer additional resistance.","p":"gyrA/parC mutations = FQ target change. Armor also includes efflux + qnr plasmids.","why":"A gyrA mutation alters the quinolone resistance-determining region of DNA gyrase, changing the drug's target so ciprofloxacin can no longer bind it. This is target modification, distinct from beta-lactamase production or wall thickening. Pseudomonas stacks additional defenses including efflux pumps and plasmid-mediated qnr genes, which is why fluoroquinolone resistance in Pseudomonas tends to be durable and multidrug in character. The mechanism predicts that raising the dose will not help, since the target itself is changed."}],"boss":{"name":"Pseudomonas Punisher","emoji":"🦠","taunts":["I swim in your antibiotics, Pharmacist!","My efflux pumps spit out your lightning!","The urinary gates are MINE!"],"case":"A 62-year-old woman: dysuria, frequency, fever 38.5°C, flank pain, CVA tenderness. Vitals stable. Acute pyelonephritis — the Punisher's horde is at the kidney gates!","qs":[{"q":"Choose your weapon for empiric therapy:","o":["Ciprofloxacin","Nitrofurantoin","Amoxicillin","Azithromycin"],"a":0,"e":"Stable acute pyelonephritis → ciprofloxacin or levofloxacin per IDSA.","p":"For stable acute pyelonephritis, ciprofloxacin or levofloxacin is appropriate empiric therapy.","why":"For stable acute pyelonephritis, IDSA urinary tract infection guidelines recommend ciprofloxacin or levofloxacin as first-line empiric therapy because they achieve high renal tissue and serum concentrations. Nitrofurantoin concentrates only in urine with negligible tissue and serum levels, so it cannot treat tissue-invasive infection. Amoxicillin has poor activity against contemporary E. coli, and azithromycin is not a urinary agent. The key discriminator in this scenario is tissue penetration, which is what separates pyelonephritis drugs from cystitis-only drugs."},{"q":"TWIST: she takes calcium + iron every morning with breakfast.","o":["Counsel: cipro 2h before or 6h after the cations","Take cipro with the supplements","Switch to nitrofurantoin","Stop the supplements forever"],"a":0,"e":"Separate administration to avoid chelation-mediated reductions in absorption.","p":"Separate fluoroquinolones from cation-containing products by 2 hours before or 6 hours after.","why":"Calcium and iron chelate ciprofloxacin in the gut and markedly reduce its absorption, so the counseling point is to separate dosing by at least 2 hours before or 6 hours after the cations. Taking cipro with the supplements guarantees subtherapeutic levels and treatment failure. Switching to nitrofurantoin is wrong because it has no renal tissue levels and is never appropriate for pyelonephritis. Stopping the supplements forever is overkill when simple separation solves the problem."},{"q":"Culture: E. coli, cipro-S, nitrofurantoin-S. Blood cultures POSITIVE.","o":["Continue cipro — nitrofurantoin never for tissue/bloodstream","De-escalate to nitrofurantoin","Add metronidazole","Stop antibiotics, she feels better"],"a":0,"e":"Nitrofurantoin achieves inadequate renal tissue and serum concentrations — never for pyelonephritis or bacteremia.","p":"Nitrofurantoin is appropriate for cystitis only; inadequate tissue levels preclude use in pyelonephritis or bacteremia.","why":"Positive blood cultures mean the infection has invaded tissue and the bloodstream, and nitrofurantoin achieves negligible renal parenchymal and serum concentrations despite excellent urine levels. De-escalating to nitrofurantoin here would leave bacteremia untreated and risk sepsis. Ciprofloxacin achieves the tissue and serum levels needed for pyelonephritis with bacteremia, so continue it. This is the hard limit of nitrofurantoin that the boards love: bladder only, never tissue or blood."}]}},{"emoji":"🔨","name":"Aminoglycoside Siege Works","intro":"The gram-negative horde returns wearing enzyme-forged shields! You need the Siege Hammers — concentration-dependent bactericidal agents. But with dose-dependent nephrotoxicity and ototoxicity. Therapeutic drug monitoring is essential.","scrolls":[{"t":"🔨 How They Smash","b":["Bind 30S irreversibly → mistranslation; protein synthesis halts","Bactericidal","Concentration-dependent killing + post-antibiotic effect → once-daily (extended-interval) dosing","Oxygen-dependent uptake → inactive against anaerobes"]},{"t":"🎯 Targets","b":["Gram-negative aerobes, including Pseudomonas","Tobramycin: most anti-pseudomonal of the class","SYNERGY with beta-lactams for endocarditis (enterococci)","Amikacin: the reserve agent — resists most modifying enzymes"]},{"t":"☠️ Toxicities & Resistance","b":["Ototoxicity: frequently irreversible — tinnitus, hearing loss","Nephrotoxicity: typically reversible — monitor serum creatinine","Therapeutic drug monitoring required","Resistance: aminoglycoside-modifying enzymes (acetyltransferases, phosphotransferases, nucleotidyltransferases)","Amikacin resists most aminoglycoside-modifying enzymes"]}],"qs":[{"q":"Aminoglycosides kill by…","o":["Irreversible 30S binding, halting protein synthesis","Binding PBPs","Blocking DNA gyrase","Blocking folate synthesis"],"a":0,"e":"They bind the 30S ribosomal subunit irreversibly, causing mistranslation and arresting protein synthesis.","p":"Aminoglycosides bind 30S irreversibly; they are bactericidal with concentration-dependent killing.","why":"Aminoglycosides bind the 30S ribosomal subunit irreversibly and induce mistranslation of mRNA, producing defective proteins that kill the bacterium. The irreversible binding is what separates them from tetracyclines, which bind the 30S reversibly and are merely bacteriostatic. They exhibit concentration-dependent killing with a post-antibiotic effect, which is the pharmacodynamic basis for extended-interval dosing. PBP binding and DNA gyrase inhibition belong to beta-lactams and fluoroquinolones."},{"q":"Why does once-daily (extended-interval) dosing work?","o":["Concentration-dependent killing + post-antibiotic effect","Very long half-life","Time-dependent killing","They accumulate in bone"],"a":0,"e":"Concentration-dependent killing plus a post-antibiotic effect supports extended-interval dosing.","p":"Concentration-dependent killing and the post-antibiotic effect enable once-daily aminoglycoside dosing.","why":"Aminoglycosides kill in a concentration-dependent fashion, so higher peaks produce more killing, and they have a post-antibiotic effect that suppresses bacterial regrowth after levels fall. Together these properties allow a single large daily dose to be effective while the long drug-free interval lets troughs fall, reducing nephrotoxicity and ototoxicity. The half-life is actually short, around 2 to 3 hours, so the extended interval is pharmacodynamic, not pharmacokinetic. Time-dependent killing is the beta-lactam pattern and would demand the opposite strategy."},{"q":"Inactive against anaerobes because…","o":["Uptake requires oxygen","Anaerobes lack ribosomes","Stomach acid destroys the drug","They can't enter gram-negatives"],"a":0,"e":"Aminoglycoside uptake requires oxygen; they lack activity against anaerobes.","p":"No oxygen → no aminoglycoside uptake. Never for anaerobes.","why":"Aminoglycoside uptake into the bacterial cell is an oxygen-dependent active transport process, so anaerobes simply cannot internalize the drug. This is why the entire class is inactive against anaerobes regardless of the organism's ribosomes, which are perfectly good 30S targets. Facultative anaerobes are killed in aerobic environments but survive in anaerobic ones, which is a classic exam twist. Stomach acid and gram-negative entry are not the issue, since aminoglycosides are given IV and kill aerobes well."},{"q":"On gentamicin, the patient reports ringing in the ears. Your move?","o":["Hold the drug, check levels — act fast","Reassure: it always resolves","Double the dose","Add furosemide"],"a":0,"e":"Aminoglycoside ototoxicity is frequently irreversible; new tinnitus warrants holding therapy and checking levels.","p":"New tinnitus or hearing change on aminoglycosides requires prompt evaluation — ototoxicity is often irreversible.","why":"New tinnitus on gentamicin signals ototoxicity, which with aminoglycosides is frequently irreversible, so the correct move is to hold the drug and check levels immediately. Reassuring the patient that it always resolves is dangerous because cochlear damage does not reliably reverse. Adding furosemide compounds the injury since loop diuretics are independently ototoxic and synergize with aminoglycosides. Nephrotoxicity from aminoglycosides is usually reversible, but ototoxicity is the one that leaves permanent damage."},{"q":"Amikacin's edge over gentamicin?","o":["Resists most modifying enzymes","No nephrotoxicity","Covers anaerobes","Oral absorption"],"a":0,"e":"Amikacin resists most aminoglycoside-modifying enzymes, reserving it for resistant isolates.","p":"Amikacin withstands most aminoglycoside-modifying enzymes.","why":"Amikacin's bulky side chains sterically hinder most aminoglycoside-modifying enzymes, the acetyltransferases, phosphotransferases, and nucleotidyltransferases that inactivate gentamicin and tobramycin. That enzyme resistance is its entire edge and why it is reserved for resistant gram-negatives rather than used first-line. It is still nephrotoxic and ototoxic, still inactive against anaerobes, and still given IV, so none of the distractor advantages exist. Stewardship keeps amikacin in reserve precisely because it defeats the most common resistance mechanism."}],"boss":{"name":"E. coli Enforcer","emoji":"🦠","taunts":["My enzymes will modify your hammers into toys!","You need oxygen to hurt me? I HAVE oxygen!","Siege weapons? I'll siege YOUR kidneys!"],"case":"A 70-year-old man, septic, gram-negative bacteremia. Suspected urinary source, recent hospitalization — Pseudomonas possible. The Enforcer cracks his knuckles…","qs":[{"q":"Choose your empiric weapons:","o":["Piperacillin-tazobactam + tobramycin","Tobramycin alone","Metronidazole + azithromycin","Oral amoxicillin"],"a":0,"e":"Sepsis with Pseudomonas risk warrants an antipseudomonal beta-lactam, with an aminoglycoside for synergy.","p":"Septic + Pseudomonas risk → anti-pseudomonal beta-lactam ± aminoglycoside for synergy.","why":"Sepsis with Pseudomonas risk factors demands an antipseudomonal beta-lactam backbone, and piperacillin-tazobactam fits because it covers Pseudomonas plus the likely gram-negatives and anaerobes. Tobramycin is added for empiric synergy while cultures are pending, not as monotherapy, since aminoglycoside monotherapy is inadequate for sepsis. Metronidazole plus azithromycin misses Pseudomonas entirely, and oral amoxicillin is absurd for sepsis. Once cultures return, the aminoglycoside is typically stopped, which is the de-escalation principle the next question tests."},{"q":"TWIST: baseline creatinine 1.8 mg/dL, CrCl 28 mL/min.","o":["Extended-interval dosing + monitor levels; keep the course short","Standard doses — kidneys will cope","Add vancomycin for good measure","Skip level monitoring — not needed"],"a":0,"e":"Renal impairment requires dose adjustment and therapeutic drug monitoring given nephrotoxicity risk.","p":"With CrCl <30 mL/min, extend the aminoglycoside interval with level monitoring and limit duration; nephrotoxicity is typically reversible, ototoxicity often is not.","why":"With a creatinine clearance of 28 mL per minute, standard aminoglycoside doses will accumulate and cause nephrotoxicity and ototoxicity, so the regimen needs renal dose adjustment with therapeutic drug monitoring. Extended-interval dosing can still be used with adjusted intervals, but levels are mandatory because aminoglycosides have a narrow therapeutic index. Keeping standard doses and hoping the kidneys cope invites irreversible ototoxicity. Adding vancomycin compounds nephrotoxicity for no benefit, and skipping level monitoring abandons the main safety tool."},{"q":"Cultures: E. coli, pip-tazo susceptible. Afebrile 48 hours.","o":["Stop tobramycin, continue pip-tazo alone","Continue both for 14 days","Switch to oral ciprofloxacin now","Add amikacin"],"a":0,"e":"Aminoglycosides added for empiric synergy should be discontinued once cultures allow narrower therapy.","p":"Discontinue empiric aminoglycoside synergy once susceptibilities permit narrower therapy.","why":"The tobramycin was added for empiric synergy against possible Pseudomonas, and now that cultures show susceptible E. coli and the patient has been afebrile for 48 hours, its job is done. Continuing dual therapy for 14 days adds nephrotoxicity and ototoxicity risk without benefit, and adding amikacin would be irrational escalation. Per stewardship principles, stop the aminoglycoside and continue the effective beta-lactam alone. Switching to oral ciprofloxacin is premature before full clinical stability and susceptibility confirmation."}]}},{"emoji":"🛡️","name":"Glycopeptide Shield Vault","intro":"The MRSA Marauder is BACK — and he's brought the VRE Vanquisher, intrinsically resistant to vancomycin! Your shield: Vancomycin, the ancient glycopeptide. Understand its spectrum and limitations.","scrolls":[{"t":"🛡️ How Vancomycin Works","b":["Binds the D-ala-D-ala terminus of peptidoglycan precursors","Blocks wall synthesis at a site distinct from beta-lactams","Bactericidal vs most gram-positives","Bacteriostatic vs enterococci","IV for systemic; ORAL is not absorbed → stays in the gut"]},{"t":"🎯 Targets","b":["MRSA infections — the classic indication","Empiric meningitis WITH ceftriaxone","ORAL: C. difficile colitis (stays in the lumen)","NOT for MSSA — beta-lactams win there","NOT for VRE — it will fail"]},{"t":"☠️ Curses & Enemy Armor","b":["Red man syndrome: rate-related histamine release — not IgE-mediated → reduce the infusion rate","Nephrotoxicity and ototoxicity — AUC-guided therapeutic drug monitoring","Resistance: VRE replaces D-ala-D-ala with D-ala-D-lac","VRSA remains exceedingly rare"]}],"qs":[{"q":"Vancomycin's grip on the enemy:","o":["Binds D-ala-D-ala, blocking wall synthesis","Binds PBPs","Binds the 50S subunit","Blocks DNA gyrase"],"a":0,"e":"Vancomycin binds the D-ala-D-ala terminus — a site distinct from beta-lactam targets.","p":"Vancomycin binds the D-ala-D-ala terminus — a site distinct from beta-lactams.","why":"Vancomycin binds the D-alanyl-D-alanine terminus of peptidoglycan precursors, capping the substrate that transpeptidases need to cross-link the cell wall. This target is entirely distinct from penicillin-binding proteins, which is why beta-lactam resistance mechanisms like mecA do not confer vancomycin resistance. The D-ala-D-ala binding explains the VRE mechanism too: swap the terminus to D-ala-D-lactate and vancomycin can no longer grip it. It is a glycopeptide, not a beta-lactam, so none of the PBP or ribosomal distractors apply."},{"q":"MSSA bacteremia: vancomycin vs nafcillin?","o":["Nafcillin — beta-lactams beat vanco for MSSA","Vancomycin, always","They are exactly equal","Neither — use ciprofloxacin"],"a":0,"e":"For MSSA bacteremia, beta-lactams demonstrate superior outcomes versus vancomycin; reserve vancomycin for MRSA.","p":"For MSSA, nafcillin or cefazolin is preferred over vancomycin; reserve vancomycin for MRSA.","why":"For MSSA bacteremia, beta-lactams such as nafcillin or cefazolin produce superior outcomes to vancomycin, with lower mortality and higher cure rates in clinical studies. Vancomycin is slower to kill staphylococci and is reserved for MRSA or true beta-lactam allergy. Using vancomycin for MSSA because it feels stronger is one of the most tested stewardship errors. Ciprofloxacin is not a staphylococcal bacteremia drug at all."},{"q":"Diffuse red flushing mid-infusion, vitals stable. Diagnosis + action?","o":["Red man syndrome — slow the infusion","Anaphylaxis — never give vanco again","Sepsis is worsening","Normal — speed the drip up"],"a":0,"e":"Rate-related histamine release, not IgE-mediated allergy; reduce the infusion rate and avoid inappropriate allergy labeling.","p":"Red man syndrome reflects rate-related histamine release, not allergy; reduce the infusion rate and avoid inappropriate allergy labeling.","why":"Diffuse flushing during vancomycin infusion with stable vitals is red man syndrome, a rate-related histamine release caused by direct mast cell degranulation, not IgE-mediated anaphylaxis. The fix is to slow the infusion and consider antihistamine premedication, not to discontinue vancomycin forever or label the patient allergic. Speeding the drip worsens the reaction, and calling it anaphylaxis leads to inappropriate lifelong avoidance. True anaphylaxis would show hypotension, bronchospasm, or angioedema, which are absent here."},{"q":"Oral vancomycin cures C. difficile because…","o":["Negligible systemic absorption — it remains intraluminal","It's stronger when swallowed","IV vanco never reaches the colon","It works through the liver"],"a":0,"e":"Oral vancomycin is negligibly absorbed; intraluminal concentrations treat C. difficile but it cannot treat bacteremia.","p":"Oral vancomycin stays in the gut lumen — perfect for C. difficile, useless for bacteremia.","why":"Oral vancomycin is negligibly absorbed from the gut, so it stays intraluminal and reaches very high colonic concentrations that kill Clostridioides difficile. That same poor absorption means it cannot treat systemic infection, so oral vancomycin is useless for bacteremia and IV vancomycin is the wrong formulation for C. difficile since it does not reach the colonic lumen well. Per IDSA C. difficile guidelines, oral vancomycin or fidaxomicin is first-line therapy. The formulation determines the indication, which is why the route question is the whole point."},{"q":"VRE resists vancomycin by…","o":["Swapping D-ala-D-ala → D-ala-D-lac","Making beta-lactamase","Efflux pumps","Thickening its wall"],"a":0,"e":"Target modification to D-ala-D-lac markedly reduces vancomycin binding.","p":"VRE replaces the vancomycin target with D-ala-D-lac.","why":"VRE carries the vanA or vanB gene cluster, which reprograms cell-wall synthesis to end in D-alanyl-D-lactate instead of D-alanyl-D-alanine. Vancomycin's binding affinity for the altered terminus drops roughly a thousandfold, so the drug cannot cap the substrate. This is target modification, not beta-lactamase production or efflux. The mechanism predicts that no dose increase can overcome resistance, because the target itself is gone, which is why the correct response to VRE bacteremia is switching agents rather than pushing vancomycin."}],"boss":{"name":"VRE Vanquisher","emoji":"👾","taunts":["Your precious vancomycin can't even SEE me!","D-ala-D-LAC, hero. Try to grab THAT!","The Marauder sends his regards…"],"case":"A 58-year-old man, hypotensive. 2/2 blood cultures: gram-positive cocci in CLUSTERS. History of MRSA colonization. The Vanquisher steps from the Marauder's shadow…","qs":[{"q":"Choose your empiric weapon:","o":["Vancomycin IV","Nafcillin","Ceftriaxone","Azithromycin"],"a":0,"e":"Sepsis with gram-positive cocci in clusters and MRSA risk factors warrants empiric vancomycin per IDSA guidance.","p":"Sepsis with gram-positive cocci in clusters and MRSA risk factors warrants empiric vancomycin per IDSA guidance.","why":"Gram-positive cocci in clusters with MRSA risk factors in a septic patient demands empiric vancomycin per IDSA guidance, because the cost of missing MRSA bacteremia is death. Nafcillin, ceftriaxone, and azithromycin all lack MRSA activity, so any of them leaves the likely pathogen uncovered. Empiric therapy is about covering the worst plausible organism until cultures return, then narrowing. Once MRSA is confirmed or excluded, the regimen is adjusted, but the opening move must include vancomycin."},{"q":"TWIST: during the infusion — diffuse red flushing, itching, BP stable.","o":["Slow the infusion — red man syndrome","Stop vanco forever — anaphylaxis","Push antihistamine, keep the rate","Switch to daptomycin now"],"a":0,"e":"Rate-related histamine release with stable vitals; reduce the infusion rate rather than discontinuing.","p":"Flushing + itching DURING vanco infusion, vitals stable = red man. Slow it, don't abandon it.","why":"Diffuse red flushing and itching with stable blood pressure during vancomycin infusion is red man syndrome, a rate-related histamine release, not anaphylaxis. The correct action is to slow the infusion, since the reaction is infusion-rate dependent. Stopping vancomycin forever or switching to daptomycin abandons effective therapy over a manageable infusion reaction. Pushing antihistamine while keeping the rate misses the point: the rate is the problem, so fix the rate."},{"q":"Cultures: Enterococcus faecium, vancomycin-RESISTANT (VRE).","o":["Switch to daptomycin — vanco will fail","Increase the vancomycin dose","Add gentamicin to vanco","Continue vanco — it's mostly working"],"a":0,"e":"VRE reflects target modification; vancomycin is ineffective regardless of dose. Daptomycin is appropriate for bacteremia but inactivated by pulmonary surfactant — never for pneumonia.","p":"VRE bacteremia: vancomycin is ineffective. Options include daptomycin (bacteremia only — inactivated by surfactant) or linezolid.","why":"VRE means the D-ala-D-ala target is gone, so vancomycin is ineffective at any dose and continuing it only delays effective therapy. Daptomycin is the correct switch for VRE bacteremia because it kills gram-positives by a completely different mechanism, calcium-dependent membrane depolarization. The critical caveat is that daptomycin is inactivated by pulmonary surfactant, so it must never be used for pneumonia, where linezolid is the alternative. Adding gentamicin to vancomycin adds toxicity without overcoming target-based resistance."}]}},{"emoji":"🌿","name":"Tetracycline Jungle","intro":"From the deep jungle come the atypical pathogens — Rickettsia, riding ticks into the bloodstream! Your weapon: Doxycycline, a first-line agent. It remains first-line at any age for RMSF.","scrolls":[{"t":"🌿 How Doxycycline Works","b":["Binds 30S reversibly → protein synthesis is inhibited","Bacteriostatic","Broad: gram-positives, gram-negatives, atypicals, Rickettsia, Lyme","Drug of choice for Rocky Mountain spotted fever — EVEN in kids"]},{"t":"🎯 Targets","b":["RMSF and tick-borne diseases","Lyme disease","Atypical pneumonia","Acne","Community MRSA SKIN infections — never bacteremia"]},{"t":"☠️ Curses & Enemy Armor","b":["Photosensitivity — advise sun protection","Tooth discoloration if age <8 years or in pregnancy (short RMSF courses still indicated in children)","Esophagitis — administer upright with a full glass of water","Chelation by calcium, iron, and antacids — separate administration","Resistance: efflux pumps and ribosomal protection proteins"]}],"qs":[{"q":"Doxycycline's action:","o":["Reversible 30S binding — bacteriostatic","Irreversible 30S binding — bactericidal","Binds PBPs","Blocks folate synthesis"],"a":0,"e":"Doxycycline reversibly binds the 30S subunit; aminoglycosides, by contrast, bind irreversibly and are bactericidal.","p":"Doxycycline binds 30S reversibly (bacteriostatic); aminoglycosides bind irreversibly (bactericidal).","why":"Doxycycline binds the 30S ribosomal subunit reversibly, blocking tRNA docking and stalling protein synthesis, which makes it bacteriostatic. The reversibility is the key contrast with aminoglycosides, which bind the 30S irreversibly, cause mistranslation, and are bactericidal. This is why doxycycline is appropriate for skin infections and atypical pneumonia but never for bacteremia. PBP binding and folate blockade belong to beta-lactams and trimethoprim-sulfamethoxazole."},{"q":"7-year-old, fever + rash + tick bite. RMSF suspected. Weapon?","o":["Doxycycline — drug of choice even in kids","Amoxicillin","Azithromycin","Wait for serology"],"a":0,"e":"RMSF can be rapidly fatal; doxycycline is first-line at any age — never delay for serology.","p":"Suspected RMSF warrants immediate doxycycline at any age; do not await serologic confirmation.","why":"Rocky Mountain spotted fever can be rapidly fatal, and doxycycline is the drug of choice per CDC guidance at any age, including children under 8. The old fear of dental staining applies to prolonged tetracycline courses, not the short course used for RMSF, and the AAP explicitly endorses doxycycline for RMSF and ehrlichiosis regardless of age. Waiting for serology kills: antibodies take days to appear while the rickettsiae disseminate. Amoxicillin and azithromycin are ineffective against Rickettsia, which are obligate intracellular organisms."},{"q":"Doxycycline counseling must include…","o":["Take upright with water; avoid sun; separate from dairy/antacids","Take at bedtime lying flat","No sun precautions needed","Take with iron for absorption"],"a":0,"e":"Administer upright with a full glass of water (esophagitis risk), advise sun protection (photosensitivity), and separate polyvalent cations.","p":"Doxy: upright + full glass of water, sunscreen, separate cations.","why":"Doxycycline can cause esophageal ulceration, so it must be taken upright with a full glass of water and never at bedtime lying flat. It causes photosensitivity, so sun protection counseling is required. Like other tetracyclines, it chelates polyvalent cations, so dairy, antacids, and iron must be separated. Taking it with iron or milk reduces absorption, which is the opposite of what the tempting distractor suggests."},{"q":"Community MRSA abscess, outpatient, doxy prescribed. Its limit?","o":["Fine for skin — NEVER for MRSA bacteremia","Also first-line for MRSA bacteremia","Useless against MRSA","Only the IV form works"],"a":0,"e":"Doxycycline is appropriate for community MRSA skin infections but not for bacteremia, which requires vancomycin or daptomycin.","p":"Doxycycline covers community-associated MRSA skin infections, not bloodstream infections.","why":"Doxycycline is appropriate for community-acquired MRSA skin and soft-tissue infections per IDSA guidance, where its bacteriostatic activity suffices for localized disease. It is never appropriate for MRSA bacteremia, which requires bactericidal therapy with vancomycin or daptomycin because bloodstream clearance demands killing, not stalling. The IV and oral forms are equally effective systemically, so the route is not the limitation. The distractor claiming it is first-line for bacteremia confuses skin efficacy with bloodstream efficacy."},{"q":"Tetracycline resistance via ribosomal protection proteins means…","o":["The bug shields its ribosome so the drug can't stall it","The drug is enzymatically destroyed","The wall thickens","The target becomes PBPs"],"a":0,"e":"Ribosomal protection proteins dislodge tetracyclines; efflux pumps reduce intracellular concentrations.","p":"Tetracycline resistance arises via ribosomal protection proteins and efflux pumps.","why":"Ribosomal protection proteins such as TetM bind the ribosome and dislodge tetracycline from its 30S binding site, shielding the target so the drug cannot stall protein synthesis. This is target protection, not enzymatic destruction of the drug. Efflux pumps like TetK are the parallel mechanism, reducing intracellular drug concentrations. Tigecycline was designed to evade both mechanisms, which is why knowing the resistance type predicts the next-line agent."}],"boss":{"name":"Rickettsia Reaper","emoji":"🦟","taunts":["Tick… tock… your time is running out, hero!","Serology takes days. Your patient has HOURS!","Even your young can't escape me!"],"case":"A 34-year-old hiker: 5 days of fever, headache, rash starting on WRISTS and ANKLES spreading inward. Tick bite 10 days ago. The Reaper rides…","qs":[{"q":"Choose your weapon:","o":["Doxycycline immediately","Amoxicillin","Wait for RMSF serology","Azithromycin"],"a":0,"e":"RMSF is a clinical diagnosis; initiate doxycycline on suspicion without awaiting serology.","p":"RMSF is a clinical diagnosis — start doxycycline empirically; serology follows.","why":"RMSF is a clinical diagnosis based on fever, rash, tick exposure, and epidemiology, and doxycycline must be started on suspicion because the disease can be fatal within days. Serology is retrospective: antibodies do not appear until well into the illness, so waiting for confirmation guarantees delay. Amoxicillin and azithromycin have no activity against obligate intracellular Rickettsia. The CDC is explicit that treatment should never be delayed for laboratory confirmation."},{"q":"TWIST: her 6-year-old son has identical symptoms.","o":["Doxycycline for him too — benefit outweighs teeth risk","Amoxicillin for kids","No antibiotics for children","Azithromycin"],"a":0,"e":"Per AAP/IDSA guidance, doxycycline is first-line for RMSF at any age; the mortality benefit outweighs dental staining risk.","p":"Pediatric RMSF still warrants doxycycline regardless of age.","why":"Per AAP and CDC guidance, doxycycline is first-line for RMSF at any age, and the mortality benefit of prompt treatment vastly outweighs the dental staining risk. The staining concern comes from prolonged tetracycline courses during tooth development, not the short course used for rickettsial disease. Giving amoxicillin to a child with RMSF is giving an ineffective drug for a potentially fatal disease. Azithromycin is not active against Rickettsia, so doxycycline for the son is the only correct answer."},{"q":"She's discharged on doxycycline. Key counseling?","o":["Upright with full water, sunscreen, finish the course","Take at bedtime","Take with milk and antacids","Stop when the fever breaks on day 2"],"a":0,"e":"Counsel on esophagitis prevention, photosensitivity, and adherence.","p":"Counsel EVERY doxy patient: upright + water, sun protection, complete the course.","why":"Discharge counseling for doxycycline must cover esophagitis prevention with upright dosing and a full glass of water, photosensitivity with sunscreen, and adherence through the full course. Stopping when the fever breaks on day 2 risks relapse of rickettsial disease, which typically needs 5 to 7 days with at least 3 afebrile days. Taking it at bedtime invites pill esophagitis, and taking it with milk or antacids chelates the drug. The counseling points all trace back to the drug's adverse-effect and interaction profile."}]}},{"emoji":"🎯","name":"Folate Saboteur Sanctum","intro":"Two additional drug classes: the Folate Saboteurs, which inhibit folate-dependent DNA synthesis — and Metronidazole, a nitroimidazole active under anaerobic conditions where Bacteroides hides.","scrolls":[{"t":"🎯 TMP-SMX: The Double Blockade","b":["Sulfamethoxazole blocks dihydropteroate synthase","Trimethoprim blocks dihydrofolate reductase","Sequential blockade — bactericidal in combination","Depletes tetrahydrofolate, impairing DNA synthesis"]},{"t":"🎯 Targets & The Assassin","b":["TMP-SMX: UTI, MRSA skin, PCP treatment + prophylaxis, Nocardia, Stenotrophomonas","Metronidazole: anaerobes (Bacteroides), C. difficile, Giardia","Metronidazole is reductively activated only under anaerobic conditions"]},{"t":"☠️ Curses","b":["Trimethoprim → hyperkalemia via impaired renal potassium excretion; monitor serum potassium","Stevens-Johnson syndrome/toxic epidermal necrolysis — discontinue at first mucocutaneous signs","Bone marrow suppression","Avoid near term (risk of kernicterus)","Metronidazole + alcohol → disulfiram-like reaction","Metallic taste; peripheral neuropathy with long courses"]}],"qs":[{"q":"TMP-SMX kills by…","o":["Sequential folate blockade (SMX, then TMP)","Binding PBPs","Binding the 50S subunit","Shredding DNA directly"],"a":0,"e":"Two sequential blocks in folate synthesis — bactericidal in combination.","p":"Double blockade of folate synthesis — bactericidal IN COMBINATION.","why":"Sulfamethoxazole inhibits dihydropteroate synthase and trimethoprim inhibits dihydrofolate reductase, two sequential enzymes in bacterial folate synthesis. Blocking the pathway twice in series is synergistic and bactericidal, which is why the combination is far more than the sum of its parts. Bacteria must synthesize folate de novo while humans use dietary folate, giving the selective toxicity. PBP binding, 50S binding, and direct DNA shredding describe beta-lactams, macrolides, and nobody in particular."},{"q":"PCP pneumonia prophylaxis in HIV. Weapon?","o":["Trimethoprim-sulfamethoxazole","Azithromycin","Ciprofloxacin","Doxycycline"],"a":0,"e":"TMP-SMX is the drug of choice for PCP treatment AND prophylaxis.","p":"TMP-SMX = PCP treatment AND prophylaxis. Know it cold.","why":"Trimethoprim-sulfamethoxazole is the drug of choice for both treatment and prophylaxis of Pneumocystis pneumonia per HIV opportunistic infection guidelines. Prophylaxis is indicated when CD4 counts fall below 200, and TMP-SMX also conveniently covers toxoplasmosis. Azithromycin is for MAC prophylaxis, not PCP, and ciprofloxacin and doxycycline have no meaningful Pneumocystis activity. The alternatives for TMP-SMX-intolerant patients are dapsone, atovaquone, or aerosolized pentamidine, but none match TMP-SMX efficacy."},{"q":"On TMP-SMX, potassium comes back 5.8. Cause?","o":["Trimethoprim impairs renal potassium excretion","Sulfa causes dehydration","It's just the infection","Always a lab error"],"a":0,"e":"Trimethoprim blocks renal K+ handling — hyperkalemia, especially with ACE-I/ARBs.","p":"Trimethoprim → HYPERKALEMIA. Check K+, especially with ACE-I/ARBs.","why":"Trimethoprim is structurally related to the potassium-sparing diuretic amiloride and blocks the epithelial sodium channel in the distal nephron, impairing renal potassium excretion. The result is hyperkalemia, which is amplified by ACE inhibitors, ARBs, CKD, and old age. Sulfamethoxazole is not the culprit, and dismissing the value as lab error risks missing a drug-induced emergency. This is why potassium must be monitored on TMP-SMX, especially in patients on renin-angiotensin blockers."},{"q":"Metronidazole's hunting ground:","o":["Anaerobic environments only","Any bacteria anywhere","Only gram-positives","Only in the lungs"],"a":0,"e":"Metronidazole undergoes reductive activation only in anaerobic organisms.","p":"Metronidazole activates ONLY without oxygen — anaerobes, C. diff, Giardia.","why":"Metronidazole is a prodrug that requires reductive activation by anaerobic metabolism, specifically nitroreductases that generate cytotoxic nitro radicals. Aerobic organisms cannot perform this reduction, so the drug is selectively toxic in anaerobic environments only. This is why it covers Bacteroides, Clostridioides, and anaerobic protozoa but nothing aerobic. Its hunting ground is defined by the organism's redox chemistry, not by gram stain."},{"q":"On metronidazole, the patient asks about wedding champagne. You say…","o":["Avoid alcohol — disulfiram-like reaction","One glass is fine","Alcohol boosts the drug","Only beer is banned"],"a":0,"e":"Disulfiram-like reaction: violent nausea, flushing, hypotension. Abstain during and 48–72h after.","p":"Metronidazole + alcohol = disulfiram-like misery. Abstain during + 48–72h after.","why":"Metronidazole inhibits aldehyde dehydrogenase, so concurrent alcohol leads to acetaldehyde accumulation and a disulfiram-like reaction with violent nausea, flushing, and hypotension. Patients must abstain during therapy and for 48 to 72 hours after the last dose. One glass of champagne is not fine, and alcohol does not boost the drug. This is a counseling point with immediate clinical consequences, since the reaction can be severe enough to send the patient to the emergency department."}],"boss":{"name":"Bacteroides Baron","emoji":"🦠","taunts":["You can't see me in the dark, hero!","Oxygen is poison — this dungeon is MINE!","Your blades rust down here!"],"case":"A 50-year-old man with perforated diverticulitis and peritonitis, heading to the OR. The Baron lurks in the oxygen-free deep…","qs":[{"q":"Choose your empiric weapons:","o":["Ceftriaxone + metronidazole","Metronidazole alone","Azithromycin + doxycycline","Oral vancomycin"],"a":0,"e":"Intra-abdominal sepsis requires gram-negative plus anaerobe coverage — e.g., ceftriaxone plus metronidazole.","p":"Intra-abdominal sepsis requires gram-negative plus anaerobe coverage — e.g., ceftriaxone plus metronidazole.","why":"Intra-abdominal sepsis is polymicrobial: gram-negatives like E. coli plus anaerobes like Bacteroides fragilis. Ceftriaxone covers the gram-negatives while metronidazole, which requires anaerobic reductive activation, covers the anaerobes, and the combination is a classic IDSA-endorsed regimen. Metronidazole alone leaves E. coli uncovered, and oral vancomycin stays in the gut lumen. Azithromycin plus doxycycline has no meaningful intra-abdominal gram-negative or anaerobic coverage."},{"q":"TWIST: he admits he drinks daily and won't abstain.","o":["Warn firmly: disulfiram-like reaction — no alcohol during + 72h after","It's a minor interaction","Switch to ciprofloxacin","Double the metronidazole"],"a":0,"e":"The disulfiram-like reaction causes severe nausea, flushing, and hypotension — thorough counseling is essential.","p":"Metronidazole + alcohol = severe nausea, flushing, hypotension. Alcohol is contraindicated during therapy and for 48–72 hours after.","why":"The disulfiram-like reaction between metronidazole and alcohol causes severe nausea, flushing, and hypotension, and a patient who drinks daily and will not abstain is at high risk of experiencing it. The warning must be firm and explicit: no alcohol during therapy and for 72 hours after. Calling it a minor interaction invites a preventable emergency, and doubling the metronidazole only deepens the problem. In a truly non-abstinent patient, consider an anaerobe-active alternative without the interaction, such as piperacillin-tazobactam."},{"q":"OR cultures: Bacteroides fragilis + E. coli (ceftriaxone-S).","o":["Continue both — both pathogens need their coverage","Stop metronidazole — anaerobes are covered","Switch to oral azithromycin","Add vancomycin"],"a":0,"e":"Bacteroides requires dedicated anaerobe coverage; continue effective targeted therapy against documented pathogens.","p":"Continue targeted therapy against documented pathogens — Bacteroides needs metronidazole.","why":"Both pathogens are real and both need their coverage: ceftriaxone handles the susceptible E. coli while metronidazole is required for Bacteroides fragilis, against which ceftriaxone has poor activity. Stopping metronidazole on the theory that anaerobes are covered would leave the Bacteroides untreated. Oral azithromycin has no place in intra-abdominal sepsis, and adding vancomycin covers nothing documented here. Targeted therapy means continuing what works against what grew."}]}},{"emoji":"👑","name":"The Resistance Council","intro":"The Resistance Council convenes — every villain you've faced, united in the dark. Four IDSA-style trials. No new weapons: only everything you've mastered. Prove you are the ID Legend.","scrolls":[{"t":"📜 Trial Rules","b":["Four cases. Three questions each. Twelve strikes.","Each case: empiric pick → pharmacist's TWIST → culture-guided finale","Wrong answers wound YOU — the Council counterattacks","Beat all four trials to claim the crown"]},{"t":"📜 The Council Assembles","b":["CAP Legion — pneumonia invaders","Pyelo Horde — kidney-gate raiders","MRSA Marauder — returned, angrier","Meningitis Wraith — the fastest killer of all"]},{"t":"📜 The Pharmacist's Edge","b":["Allergy histories change everything — ask, then choose","Kidneys, pregnancy, QT, CYP interactions: check them all","Cultures are truth — de-escalate to the narrowest weapon","Counsel every discharge: the last mile is yours"]}],"qs":[{"q":"Warm-up: time-dependent killing means…","o":["Efficacy depends on time above MIC","Bigger peaks kill better","One dose cures all","Levels don't matter"],"a":0,"e":"Beta-lactams and vancomycin: keep levels above the MIC as long as possible.","p":"Time-dependent killing (beta-lactams, vancomycin) depends on time above the MIC; concentration-dependent killing (fluoroquinolones, aminoglycosides) depends on peak concentration.","why":"Time-dependent killing means efficacy depends on the fraction of the dosing interval that free drug concentrations remain above the MIC. Beta-lactams and vancomycin follow this pattern, which is why frequent dosing and prolonged infusions improve outcomes. Bigger peaks do not add killing for these drugs, and the one-dose-cures-all distractor ignores pharmacodynamics entirely. The practical consequence is that missing doses hurts more than giving a smaller peak."},{"q":"Concentration-dependent killing means…","o":["Bigger peaks kill better","Time above MIC matters most","Small frequent doses win","Peaks are irrelevant"],"a":0,"e":"Fluoroquinolones and aminoglycosides: maximize the peak.","p":"For concentration-dependent agents, maximize the peak concentration.","why":"Concentration-dependent killing means efficacy tracks the peak-to-MIC or AUC-to-MIC ratio: bigger peaks kill better. Fluoroquinolones, aminoglycosides, and daptomycin follow this pattern, which is the pharmacodynamic basis for high-dose extended-interval aminoglycoside regimens. Small frequent doses are the time-dependent strategy and would waste the concentration advantage. Knowing which pattern a drug follows dictates the entire dosing design."},{"q":"Bactericidal vs bacteriostatic — which pair is right?","o":["Beta-lactams kill; macrolides mostly stall","Macrolides kill; beta-lactams stall","All antibiotics kill","All antibiotics stall"],"a":0,"e":"Beta-lactams are bactericidal via cell-wall lysis; macrolides and tetracyclines are bacteriostatic via protein-synthesis inhibition.","p":"Bactericidal: beta-lactams, fluoroquinolones, aminoglycosides, vancomycin. Bacteriostatic: macrolides, tetracyclines.","why":"Beta-lactams are bactericidal because blocking peptidoglycan cross-linking during growth leads to osmotic lysis, while macrolides are mostly bacteriostatic because they reversibly stall protein synthesis at the 50S subunit. The distinction matters clinically: bacteremia, endocarditis, and meningitis generally demand bactericidal agents. Not all antibiotics kill and not all stall, so the paired statement must match each class to its mechanism. Tetracyclines join macrolides on the bacteriostatic side."},{"q":"Red man syndrome is…","o":["Rate-related histamine flush — slow the infusion","True allergy — never give vanco again","A beta-lactam reaction","Harmless — speed the drip"],"a":0,"e":"Vancomycin's famous infusion curse: slow the rate, don't label an allergy.","p":"Red man = slow the infusion. NOT an allergy.","why":"Red man syndrome is a rate-related histamine flush from direct mast cell degranulation during vancomycin infusion, not an IgE-mediated allergy. The management is to slow the infusion, and premedication with antihistamines can prevent recurrence. Labeling it a true allergy leads to inappropriate lifelong vancomycin avoidance and forces inferior alternatives. It is not a beta-lactam reaction and it is not harmless, since rapid infusion can cause severe flushing and hypot
