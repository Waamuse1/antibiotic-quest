ension."},{"q":"Nitrofurantoin's hard limit:","o":["Bladder only — no tissue or blood levels","Useless in the bladder","Covers Pseudomonas","First-line for pyelonephritis"],"a":0,"e":"No kidney tissue levels → never for pyelonephritis or bacteremia.","p":"Nitrofurantoin = bladder ONLY. Never pyelo, never bacteremia.","why":"Nitrofurantoin concentrates in urine but achieves negligible renal parenchymal and serum levels, so its activity is confined to the bladder. That pharmacokinetic profile makes it an excellent cystitis drug and a dangerous pyelonephritis or bacteremia drug. It does not cover Pseudomonas, and it is never first-line for pyelonephritis. The hard limit is tissue penetration, which is the single most tested fact about nitrofurantoin."}],"boss":{"name":"The Resistance Council","emoji":"👑","taunts":["Four villains. One hero. You are OUTNUMBERED!","Your pearls won't save you now!","The Body Kingdom falls TONIGHT!"],"case":"TRIAL 1 — CAP Legion: 65-year-old, cough, fever, lobar infiltrate, outpatient, no comorbidities.","qs":[{"q":"Trial 1a — empiric weapon?","o":["Amoxicillin","Ciprofloxacin","Vancomycin","Aztreonam"],"a":0,"e":"Per IDSA guidance, healthy outpatients with CAP may receive amoxicillin, doxycycline, or a macrolide.","p":"Healthy outpatient CAP: amoxicillin, doxycycline, or a macrolide per IDSA guidance.","why":"Per ATS and IDSA community-acquired pneumonia guidelines, healthy outpatients without comorbidities can be treated with amoxicillin, doxycycline, or a macrolide. Amoxicillin covers the most likely pathogen, Streptococcus pneumoniae, while doxycycline and macrolides add atypical coverage. Ciprofloxacin is not a respiratory agent and vancomycin is for MRSA, neither of which belongs in uncomplicated outpatient CAP. Aztreonam covers only gram-negatives and has no pneumococcal activity."},{"q":"Trial 1b — TWIST: he actually has COPD and took amoxicillin last month.","o":["Levofloxacin (respiratory FQ)","Same amoxicillin","Nitrofurantoin","Metronidazole"],"a":0,"e":"CAP with comorbidities or recent antibiotic exposure warrants a respiratory fluoroquinolone or beta-lactam plus macrolide/doxycycline.","p":"CAP with comorbidities or recent antibiotics: levofloxacin or a beta-lactam plus macrolide/doxycycline.","why":"COPD plus recent amoxicillin exposure changes the CAP calculus: comorbidities raise the risk of drug-resistant pneumococcus and gram-negatives, and recent beta-lactam use predicts beta-lactam resistance. Per ATS and IDSA guidelines, the options are a respiratory fluoroquinolone like levofloxacin or a beta-lactam plus a macrolide or doxycycline. Repeating amoxicillin ignores the resistance risk, while nitrofurantoin and metronidazole have no respiratory activity. The twist tests that you escalate based on risk factors, not habit."},{"q":"Trial 1c — Legionella urinary antigen POSITIVE, on levofloxacin.","o":["Continue levofloxacin — it covers Legionella","Switch to amoxicillin","Add vancomycin","Stop — the antigen must be false"],"a":0,"e":"Respiratory fluoroquinolones cover Legionella; a positive urinary antigen confirms the regimen.","p":"Respiratory fluoroquinolones cover Legionella — a positive antigen confirms therapy; do not switch.","why":"A positive Legionella urinary antigen confirms Legionella pneumophila serogroup 1, an intracellular pathogen that requires an agent with intracellular penetration. Levofloxacin, a respiratory fluoroquinolone, concentrates intracellularly and is highly active against Legionella, so the antigen validates the current regimen. Switching to amoxicillin would abandon atypical coverage since beta-lactams cannot reach intracellular organisms. Adding vancomycin or stopping therapy would discard a regimen that is already correct."},{"q":"Trial 2a — Pyelo Horde: 30-year-old woman, fever, flank pain, stable.","o":["Ciprofloxacin","Nitrofurantoin","Amoxicillin","Doxycycline"],"a":0,"e":"Stable acute pyelonephritis → ciprofloxacin or levofloxacin. Nitrofurantoin has no tissue levels.","p":"Stable pyelo → cipro/levo. NEVER nitrofurantoin (no tissue levels).","why":"Stable acute pyelonephritis requires an agent with renal tissue and serum penetration, and IDSA guidelines recommend ciprofloxacin or levofloxacin first-line. Nitrofurantoin is the classic trap: excellent urine levels but negligible tissue and serum levels, so it cannot treat tissue-invasive infection. Amoxicillin lacks reliable E. coli coverage and doxycycline is not a pyelonephritis drug. The question tests the same tissue-penetration principle as the nitrofurantoin hard-limit question."},{"q":"Trial 2b — TWIST: she is 14 weeks pregnant.","o":["Cephalexin (beta-lactam)","Ciprofloxacin anyway","Moxifloxacin","Doxycycline"],"a":0,"e":"Fluoroquinolones are contraindicated in pregnancy (cartilage toxicity); beta-lactams such as cephalexin are preferred.","p":"Pyelonephritis in pregnancy: beta-lactams such as cephalexin; fluoroquinolones are contraindicated.","why":"Fluoroquinolones are contraindicated in pregnancy because animal studies show cartilage and joint toxicity in developing fetuses, so ciprofloxacin and moxifloxacin are both out. Beta-lactams such as cephalexin are the preferred agents for pyelonephritis in pregnancy, with established safety and adequate tissue penetration. Doxycycline is contraindicated due to effects on fetal teeth and bone. The scenario tests that you know both the pregnancy contraindication and the correct substitute, not just the contraindication."},{"q":"Trial 2c — Culture: E. coli, cipro-R, TMP-SMX-S. Not bacteremic, improving.","o":["De-escalate to TMP-SMX","Nitrofurantoin","Continue cipro — it'll work","IV meropenem"],"a":0,"e":"De-escalate to the narrowest-spectrum susceptible oral agent once susceptibilities return.","p":"De-escalate to the narrowest-spectrum susceptible agent based on culture results.","why":"Once susceptibilities return showing ciprofloxacin resistance and TMP-SMX susceptibility in an improving, non-bacteremic patient, de-escalate to the narrowest-spectrum susceptible oral agent: TMP-SMX. Continuing ciprofloxacin against a resistant organism invites failure, and nitrofurantoin remains inappropriate for pyelonephritis regardless of susceptibility. IV meropenem is massive overtreatment for a stable, improving outpatient and violates every stewardship principle. De-escalation is the expected move and the boards reward it."},{"q":"Trial 3a — MRSA Marauder returns: 55-year-old, hypotensive, gram-positive cocci in clusters, 2/2 bottles.","o":["Vancomycin","Nafcillin","Ceftriaxone","Piperacillin-tazobactam"],"a":0,"e":"Septic + clusters + MRSA risk → empiric vancomycin.","p":"Septic + clusters + MRSA risk → empiric vancomycin.","why":"A hypotensive 55-year-old with gram-positive cocci in clusters in 2 of 2 bottles is presumed staphylococcal bacteremia, and MRSA risk factors make empiric vancomycin mandatory per IDSA guidance. Nafcillin, ceftriaxone, and piperacillin-tazobactam all lack MRSA activity, so each would leave the likely pathogen uncovered during the highest-risk window. Empiric therapy covers the worst plausible organism first and narrows when cultures speciate. Missing MRSA bacteremia at presentation is a fatal error the guidelines are designed to prevent."},{"q":"Trial 3b — TWIST: trough 28 mcg/mL, creatinine rising.","o":["Switch to daptomycin","Push through — high troughs are good","Add gentamicin","Halve the dose and continue"],"a":0,"e":"Vancomycin-associated nephrotoxicity — switch agents rather than persisting with dose reduction; daptomycin is appropriate for bacteremia.","p":"Vancomycin-associated nephrotoxicity warrants switching agents; daptomycin for bacteremia.","why":"A vancomycin trough of 28 with rising creatinine is vancomycin-associated nephrotoxicity, and the correct move is to switch agents rather than persist with dose reduction. Daptomycin is bactericidal, concentration-dependent, and appropriate for MRSA bacteremia, making it the natural switch. Pushing through high troughs invites permanent renal injury, and adding gentamicin compounds nephrotoxicity without the synergy benefit once routine for staphylococci. Modern practice targets an AUC of 400 to 600 rather than chasing troughs, but a trough of 28 with rising creatinine is toxic by any metric."},{"q":"Trial 3c — MRSA confirmed, TEE negative, cultures clearing, uncomplicated.","o":["2 weeks from first negative cultures","5 days total","6 weeks","Until he feels better"],"a":0,"e":"Uncomplicated S. aureus bacteremia requires 14 days of therapy counted from the first negative blood culture.","p":"Uncomplicated S. aureus bacteremia: 14 days from the first negative blood culture.","why":"Uncomplicated Staphylococcus aureus bacteremia requires 14 days of effective therapy counted from the first negative blood culture, per IDSA guidance. Five days is the cellulitis duration and is grossly inadequate for bacteremia, while 6 weeks is the complicated bacteremia or endocarditis duration. The clock starts at culture clearance, not at symptom improvement, because persistent bacteremia changes the diagnosis. Getting the duration anchor right is one of the highest-yield facts in infectious diseases."},{"q":"Trial 4a — Meningitis Wraith: 22-year-old, fever, neck stiffness, altered.","o":["Ceftriaxone + vancomycin","Amoxicillin alone","Azithromycin","Ciprofloxacin"],"a":0,"e":"Empiric therapy for community-acquired bacterial meningitis in adults: ceftriaxone plus vancomycin.","p":"Adult meningitis empiric = ceftriaxone + vancomycin.","why":"Empiric therapy for community-acquired bacterial meningitis in adults is ceftriaxone plus vancomycin per IDSA guidelines. Ceftriaxone covers Neisseria meningitidis, Haemophilus influenzae, and susceptible pneumococcus with excellent CSF penetration in inflamed meninges, while vancomycin covers ceftriaxone-resistant pneumococcus. Amoxicillin, azithromycin, and ciprofloxacin each miss critical meningitis pathogens and lack the guideline endorsement. The regimen is chosen before the organism is known, so it must cover the deadly possibilities simultaneously."},{"q":"Trial 4b — TWIST: the patient is 67 years old.","o":["Add ampicillin for Listeria","Same regimen","Add metronidazole","Remove vancomycin"],"a":0,"e":"Age >50 years confers Listeria risk — add ampicillin per IDSA guidance.","p":"Meningitis with age >50 years (or neonatal/immunocompromised status) warrants ampicillin for Listeria coverage.","why":"Ampicillin is an aminopenicillin that is bactericidal against Listeria monocytogenes and achieves excellent CSF penetration in inflamed meninges. Ceftriaxone has no activity against Listeria due to intrinsic resistance, so the standard ceftriaxone plus vancomycin backbone leaves a fatal gap in patients over 50, neonates, and the immunocompromised. Per IDSA meningitis guidelines, add ampicillin for Listeria coverage in these high-risk groups. Removing vancomycin would abandon coverage of resistant pneumococcus, and metronidazole adds nothing to meningitis therapy."},{"q":"Trial 4c — Dexamethasone timing?","o":["Before or with the first antibiotics","After cultures return","On day 3","Never in meningitis"],"a":0,"e":"Dexamethasone attenuates the inflammatory response — administer with or before the first antibiotic dose.","p":"Dexamethasone should be administered with or before the first antibiotic dose in suspected bacterial meningitis.","why":"Dexamethasone attenuates the inflammatory cascade triggered by bacterial lysis, and it only works if given before or with the first antibiotic dose. Giving it after cultures return or on day 3 misses the window when lysis-driven inflammation causes neurologic injury. In pneumococcal meningitis, adjunctive dexamethasone reduces mortality and neurologic sequelae, which is why the IDSA guidelines specify the timing precisely. Never in meningitis ignores the evidence, and the timing is the entire point of the question."}]}}];

  steps:[
   {q:"First move?",o:["Draw blood cultures, then start empiric antibiotics promptly","Start azithromycin alone, no cultures","Wait for sputum culture before any antibiotics","Antipyretics and observe"],a:0,e:"Cultures before antibiotics — but never delay the first dose.",p:"Blood cultures BEFORE antibiotics, but never delay the first dose.",why:"Blood cultures drawn before antibiotics identify the pathogen and enable de-escalation, but the draw must never delay the first dose — IDSA/ATS guidance is cultures then antibiotics within the hour for suspected sepsis. Each hour of delay in severe community-acquired pneumonia increases mortality. Azithromycin alone without cultures misses bacteremic pneumococcus and forfeits susceptibility data; waiting for sputum squanders the empiric window."},
   {q:"Empiric antibiotic?",o:["Amoxicillin","Ciprofloxacin","Vancomycin","Nitrofurantoin"],a:0,e:"Healthy outpatient CAP → amoxicillin, doxycycline, or macrolide (IDSA).",p:"Healthy outpatient CAP: amoxicillin, doxycycline, or a macrolide per IDSA guidance.",why:"Healthy-adult outpatient CAP is overwhelmingly Streptococcus pneumoniae, a beta-lactam-susceptible gram-positive diplococcus. Amoxicillin binds penicillin-binding proteins, blocking peptidoglycan cross-linking with time-dependent bactericidal killing, and achieves excellent lung parenchyma concentrations. IDSA/ATS 2019 lists amoxicillin, doxycycline, or a macrolide for healthy outpatients. Ciprofloxacin has unreliable pneumococcal activity and drives resistance; vancomycin adds nephrotoxicity without benefit; nitrofurantoin never leaves the urinary tract."},
   {q:"TWIST — chart update: she has COPD and took amoxicillin last month.",o:["Levofloxacin","Same amoxicillin","Nitrofurantoin","Metronidazole"],a:0,e:"Comorbidities or recent antibiotics → respiratory fluoroquinolone.",p:"CAP + comorbidities or recent antibiotics → levofloxacin (or beta-lactam + macrolide/doxy).",why:"COPD plus recent beta-lactam exposure raises the risk of drug-resistant pneumococcus, Haemophilus influenzae, and Moraxella — organisms a plain aminopenicillin may miss. Levofloxacin inhibits DNA gyrase and topoisomerase IV with concentration-dependent killing, penetrates lung tissue and alveolar macrophages superbly, and covers typical plus atypical pathogens in one agent. IDSA/ATS endorses respiratory fluoroquinolone monotherapy for CAP with comorbidities. Repeating amoxicillin after recent exposure selects for resistance; nitrofurantoin and metronidazole achieve no meaningful lung levels."},
   {q:"Day 2: Legionella urinary antigen POSITIVE. She's improving on levofloxacin.",o:["Continue levofloxacin — it covers Legionella","Switch to amoxicillin","Add vancomycin","Stop antibiotics"],a:0,e:"Respiratory FQs cover Legionella — the antigen confirms your pick.",p:"Positive Legionella antigen CONFIRMS a respiratory-FQ pick — continue the current regimen.",why:"Levofloxacin covers Legionella pneumophila, an intracellular pathogen that beta-lactams cannot touch because they cannot reach therapeutic intracellular concentrations — fluoroquinolones concentrate inside alveolar macrophages where Legionella replicates. A positive urinary antigen confirms the diagnosis and validates the empiric choice, so switching to amoxicillin would abandon atypical coverage mid-course. Adding vancomycin contributes only nephrotoxicity. The rule: a positive Legionella antigen on an effective regimen means continue, not switch."}]},
 {id:"p1",guide:"cystitis",name:"Jess, 24",title:"burning pee",x:1400,

   {q:"First move?",o:["Send urine culture, then start empiric therapy","Start ciprofloxacin now, no culture","Reassure — no treatment needed","Order a CT scan"],a:0,e:"Urine culture before therapy guides you if she fails treatment.",p:"Urine culture before therapy in cystitis — your backup plan if she fails.",why:"A urine culture before therapy captures the organism and susceptibilities that guide you if she fails empiric treatment, which happens in a meaningful minority of cystitis cases. Cystitis is a clinical diagnosis, but treating blindly with ciprofloxacin risks missing resistant E. coli and forfeits your backup plan. Reassurance ignores documented bacteriuria with symptoms; a CT scan has no role in uncomplicated cystitis."},

[{id:"p0",guide:"pyelo",name:"Rosa, 62",title:"flank pain & fever",x:500,

  chart:"62F · T 38.5°C · CVA tenderness · PMH: hypertension · Allergies: NKDA · Labs: WBC 15.0 · UA: WBC too numerous, nitrites +",
  steps:[
   {q:"First move?",o:["Blood AND urine cultures, then empiric therapy","Nitrofurantoin right now","Cranberry + hydration","Wait for culture results"],a:0,e:"Pyelonephritis is systemic → blood + urine cultures before antibiotics.",p:"Pyelo = systemic → blood AND urine cultures before antibiotics.",why:"Pyelonephritis is tissue-invasive with bacteremia in roughly a quarter of cases, so both blood and urine cultures precede antibiotics — the bloodstream isolate may differ in susceptibilities and changes duration decisions. Nitrofurantoin achieves no renal parenchyma or serum levels, making it a dangerous trap here despite working for cystitis. Cranberry and hydration are not therapy for febrile upper-tract infection."},
   {q:"Empiric antibiotic?",o:["Ciprofloxacin","Nitrofurantoin","Amoxicillin","Azithromycin"],a:0,e:"Stable acute pyelonephritis → ciprofloxacin or levofloxacin (IDSA).",p:"Stable acute pyelonephritis → ciprofloxacin or levofloxacin.",why:"Ciprofloxacin inhibits bacterial DNA gyrase and topoisomerase IV with concentration-dependent bactericidal killing, and it concentrates superbly in renal parenchyma and urine while covering E. coli including many resistant strains. IDSA endorses ciprofloxacin or levofloxacin for acute uncomplicated pyelonephritis. Nitrofurantoin cannot treat tissue infection; amoxicillin faces high resistance; azithromycin lacks gram-negative activity."},
   {q:"TWIST — med list: calcium + iron every morning with breakfast.",o:["Counsel: cipro 2h before / 6h after the cations","Take cipro with the supplements","Switch to nitrofurantoin","Stop the supplements forever"],a:0,e:"Cations chelate fluoroquinolones in the gut — separate dosing.",p:"Separate fluoroquinolones from cations: 2h before or 6h after.",why:"Divalent and trivalent cations — calcium, iron, magnesium, aluminum — chelate fluoroquinolones in the gut lumen, forming insoluble complexes that cut absorption by 30 to 50 percent. Subtherapeutic levels mean treatment failure and resistance selection. Dosing ciprofloxacin 2 hours before or 6 hours after the supplements preserves absorption; taking them together is a pharmacokinetic own-goal."},
   {q:"Cultures: E. coli, cipro-S. Blood cultures POSITIVE.",o:["Continue cipro — nitrofurantoin never for tissue/bloodstream","De-escalate to nitrofurantoin","Add metronidazole","Stop — she feels better"],a:0,e:"Nitrofurantoin has no kidney tissue or blood levels — never for pyelo/bacteremia.",p:"Nitrofurantoin = bladder ONLY. Never for pyelonephritis or bacteremia.",why:"Positive blood cultures prove tissue and bloodstream invasion — nitrofurantoin is filtered into urine and never achieves serum or parenchymal levels, so de-escalating to it would leave bacteremia untreated. Continuing ciprofloxacin, to which the isolate is susceptible and which penetrates both kidney tissue and blood, is the correct narrow-but-adequate choice. Feeling better does not shorten bacteremia therapy."}]},
 {id:"p1",guide:"dfi",name:"Sam, 58",title:"diabetic foot ulcer",x:1400,
  talk:"This sore on my foot won't heal, and now the redness is spreading up my ankle. It smells bad.",
  chart:"58M · T 38.4°C · HR 102 · spreading foot erythema, foul odor · PMH: type 2 diabetes (A1c 9.8) · Allergies: NKDA · Labs: WBC 13.8 · glucose 268 · X-ray: no gas",
  steps:[
   {q:"First move?",o:["Deep tissue cultures + empiric broad therapy (systemic signs)","Superficial swab only","Amoxicillin alone","Warm soaks and observe"],a:0,e:"Infected diabetic foot + systemic signs → deep cultures + broad empiric cover.",p:"Diabetic foot + systemic signs → deep tissue cultures + broad empiric cover.",why:"A diabetic foot infection with systemic signs is limb-threatening and polymicrobial — MRSA, Pseudomonas, anaerobes, and gram-negatives all possible. Superficial swabs grow colonizers; deep tissue or bone specimens are the microbiologic truth. IDSA diabetic foot guidance demands deep cultures plus immediate broad empiric cover for severe infection; narrow or delayed therapy risks amputation."},
   {q:"Empiric antibiotics?",o:["Piperacillin-tazobactam + vancomycin","Amoxicillin alone","Azithromycin","Nitrofurantoin"],a:0,e:"Severe diabetic foot = MRSA + Pseudomonas risk → broad cover.",p:"Severe diabetic foot infection → cover MRSA + Pseudomonas empirically.",why:"Piperacillin-tazobactam pairs an anti-pseudomonal penicillin with a beta-lactamase inhibitor, covering Pseudomonas, enteric gram-negatives, and anaerobes; vancomycin adds the MRSA backbone that beta-lactams cannot provide against mecA-mediated resistance. Severe diabetic foot infection per IDSA/IWGDF requires empiric MRSA plus Pseudomonas coverage. Amoxicillin alone misses both; azithromycin and nitrofurantoin have no relevant spectrum here."},
   {q:"TWIST — creatinine 1.9 (baseline 1.0). Acute kidney injury.",o:["Renally dose vancomycin + monitor levels; avoid stacking nephrotoxins","Standard doses — kidneys will cope","Add gentamicin for synergy","Stop all antibiotics"],a:0,e:"AKI on vancomycin → renal dosing + level monitoring; don't stack nephrotoxins.",p:"AKI on vanco → renally dose, monitor levels. Never stack nephrotoxins casually.",why:"Vancomycin is nephrotoxic, and the piperacillin-tazobactam combination amplifies acute kidney injury risk — with creatinine nearly doubled, standard dosing guarantees accumulation. Renal dose adjustment with AUC-guided therapeutic monitoring keeps efficacy while limiting further renal injury, and stacking an aminoglycoside would add a second nephrotoxin plus ototoxicity. Monitor levels and keep the course as short as cultures allow."},
   {q:"Deep cultures: MSSA only.",o:["De-escalate to cefazolin","Continue pip-tazo + vanco for 14 days","Switch to oral ciprofloxacin","Add metronidazole"],a:0,e:"MSSA → beta-lactams beat vancomycin. De-escalate.",p:"MSSA → nafcillin/cefazolin BEAT vancomycin. De-escalate.",why:"MSSA means beta-lactams are superior to vancomycin — nafcillin and cefazolin clear MSSA bacteremia faster with lower mortality than vancomycin in every comparative study. With only MSSA documented, continuing piperacillin-tazobactam plus vancomycin is excess spectrum driving resistance and toxicity. De-escalate to cefazolin; oral ciprofloxacin has unreliable staphylococcal activity and is not a de-escalation target."}]},
 {id:"p2",guide:"sepsis",name:"Mr. Chen, 70",title:"septic post-op",x:2200,
  talk:"(nurse) 70, post-op day 4, spiking fevers, hypotensive, new infiltrate. He looks septic.",
  chart:"70M · T 39.1°C · BP 88/54 · HR 118 · PMH: colectomy 4 days ago · Allergies: NKDA · Labs: WBC 18.2 · lactate 3.8 · creatinine 1.8 (baseline 1.1)",
  steps:[
   {q:"First move?",o:["Blood cultures x2 + lactate, broad empiric therapy NOW","Wait for sputum culture","Normal saline only","CT scan first"],a:0,e:"Sepsis = cultures + broad-spectrum within the hour.",p:"Sepsis: cultures + broad-spectrum within the hour. Every hour counts.",why:"The sepsis bundle is uncompromising: two sets of blood cultures and lactate first, then broad-spectrum antibiotics within the hour — each hour of delay measurably increases mortality. Lactate stratifies severity and guides resuscitation. Waiting for sputum cultures or CT imaging before antibiotics trades a diagnostic nicety for the patient's life; fluids alone do not kill bacteria."},
   {q:"Empiric weapons? (Pseudomonas possible)",o:["Piperacillin-tazobactam + tobramycin","Tobramycin alone","Metronidazole + azithromycin","Oral amoxicillin"],a:0,e:"Septic + possible Pseudomonas → anti-pseudomonal beta-lactam + aminoglycoside synergy.",p:"Septic + Pseudomonas risk → anti-pseudomonal beta-lactam ± aminoglycoside.",why:"Post-operative sepsis carries Pseudomonas risk, demanding an anti-pseudomonal beta-lactam backbone; the aminoglycoside adds concentration-dependent bactericidal synergy and covers resistant gram-negatives during the critical early hours. Tobramycin is preferred among aminoglycosides for Pseudomonas. Aminoglycoside monotherapy is inadequate for sepsis; metronidazole plus azithromycin has no Pseudomonas activity; oral amoxicillin in septic shock is indefensible."},
   {q:"TWIST — CrCl 28 mL/min.",o:["Extended-interval AG dosing + monitor levels; keep the course short","Standard doses","Add vancomycin for good measure","Skip level monitoring"],a:0,e:"Renal impairment → extend the interval, monitor levels, keep it short.",p:"CrCl <30 on aminoglycosides → extend interval, monitor levels, keep it short.",why:"Aminoglycosides are nephrotoxic and ototoxic with purely renal clearance — at CrCl 28, standard interval dosing accumulates to toxic levels, and ototoxicity can be irreversible. Extended-interval dosing with peak and trough monitoring exploits their concentration-dependent killing and post-antibiotic effect while allowing renal washout between doses. Keep the course short and stop the aminoglycoside the moment cultures permit."},
   {q:"Cultures: E. coli, pip-tazo susceptible. Afebrile 48 hours.",o:["Stop tobramycin, continue pip-tazo alone","Continue both for 14 days","Switch to oral ciprofloxacin now","Add amikacin"],a:0,e:"The aminoglycoside was empiric synergy — de-escalate once cultures narrow therapy.",p:"Discontinue empiric aminoglycoside synergy once susceptibilities permit narrower therapy.",why:"The aminoglycoside was empiric synergy for possible resistant Pseudomonas; cultures grew susceptible E. coli, which piperacillin-tazobactam kills definitively alone. Continuing tobramycin adds nephrotoxicity and ototoxicity with zero incremental benefit — de-escalation is the central commandment of sepsis stewardship. Fourteen days of dual therapy would be toxicity without purpose."}]}],
/* ---- WING 2 : ICU ---- */
[{id:"p0",guide:"mrsa-bacteremia",name:"Marcus, 55",title:"crashing — clusters on Gram stain",x:500,
  talk:"(nurse) 55, hypotensive, rigors. Gram stain just called: gram-positive cocci in clusters, 2 of 2 bottles.",
  chart:"55M · BP 82/50 · T 39.4°C · PMH: MRSA colonization · Allergies: NKDA · Labs: WBC 19.5 · lactate 4.2",
  steps:[
   {q:"First move?",o:["Blood cultures already drawn — start empiric vancomycin NOW","Wait for susceptibilities","Nafcillin","Ceftriaxone"],a:0,e:"Septic + clusters + MRSA risk → empiric vancomycin without delay.",p:"Septic + clusters + MRSA risk → empiric vancomycin without delay.",why:"Septic shock with gram-positive cocci in clusters plus known MRSA colonization is MRSA bacteremia until proven otherwise — vancomycin starts immediately after cultures, not after susceptibilities. Vancomycin binds D-ala-D-ala, blocking cell-wall synthesis in staphylococci. Nafcillin cannot bind PBP2a encoded by mecA and will fail; ceftriaxone has no MRSA activity; waiting for susceptibilities wastes the golden hour."},
   {q:"Vancomycin dosing?",o:["Weight-based loading + maintenance with level monitoring","Fixed 1g q12h for everyone","Oral vancomycin","Daptomycin first-line here"],a:0,e:"Weight-based dosing + AUC/level monitoring — one dose does not fit all.",p:"Vancomycin: weight-based + monitor levels. One dose does not fit all.",why:"Vancomycin pharmacokinetics scale with weight and renal function — a fixed 1 gram every 12 hours underdoses large patients into treatment failure and overdoses small or renally impaired patients into nephrotoxicity. AUC-guided dosing with therapeutic monitoring, per IDSA, keeps the drug in the effective window. Oral vancomycin is not absorbed and cannot treat bacteremia; that route is strictly a luminal C. difficile therapy."},
   {q:"TWIST — mid-infusion: diffuse red flushing, itching, BP stable.",o:["Slow the infusion — red man syndrome","Stop vancomycin forever — anaphylaxis","Push antihistamine, keep the rate","Switch to daptomycin now"],a:0,e:"Rate-related histamine flush with stable vitals — slow it, don't abandon it.",p:"Red man = rate-related histamine flush, NOT allergy. Slow the drip.",why:"Diffuse flushing and itching with stable blood pressure during vancomycin infusion is red man syndrome — rate-related histamine release, not IgE-mediated anaphylaxis. Slowing the infusion and considering antihistamine premedication resolves it; abandoning vancomycin surrenders your MRSA backbone over a manageable infusion reaction. Switching to daptomycin here is premature escalation for a non-allergic event."},
   {q:"Cultures: Enterococcus faecium, vancomycin-RESISTANT (VRE).",o:["Switch to daptomycin — vancomycin will fail","Increase the vancomycin dose","Add gentamicin to vancomycin","Continue vancomycin"],a:0,e:"VRE = target change; vancomycin cannot work at any dose. Daptomycin for bacteremia (never pneumonia — surfactant).",p:"VRE bacteremia → vancomycin is DEAD. Daptomycin (never lungs).",why:"The vanA/vanB gene cluster rewrites the target from D-ala-D-ala to D-ala-D-lac — vancomycin cannot bind at any dose, so dose escalation is futile. Daptomycin is a cyclic lipopeptide that depolarizes the bacterial membrane with rapid bactericidal killing, and it is the agent of choice for VRE bacteremia. It is inactivated by pulmonary surfactant and must never be used for pneumonia; adding gentamicin to a dead drug adds toxicity without synergy."}]},
 {id:"p1",guide:"meningitis",name:"Aisha, 22",title:"fever, stiff neck",x:1400,
  talk:"(nurse) Fever, brutal headache, neck stiffness — and she's getting confused.",
  chart:"22F · T 39.6°C · altered, nuchal rigidity · PMH: none · Allergies: NKDA · Labs: WBC 17.0",
  steps:[
   {q:"First move?",o:["Blood cultures x2 + empiric antibiotics immediately (don't delay for LP)","Wait for lumbar puncture first","CT head, then decide","Ibuprofen and observe"],a:0,e:"Suspected bacterial meningitis: cultures + antibiotics FIRST — LP must not delay therapy.",p:"Bacterial meningitis: blood cultures + antibiotics FIRST. LP must not delay therapy.",why:"Bacterial meningitis kills in hours — blood cultures and empiric antibiotics come first, and the lumbar puncture must never delay therapy. Every guideline is explicit: treat on suspicion, confirm when safe. Waiting for the tap or for CT imaging before antibiotics trades diagnostic elegance for brain injury and death; ibuprofen does nothing against bacterial replication in the subarachnoid space."},
   {q:"Empiric antibiotics?",o:["Ceftriaxone + vancomycin","Amoxicillin alone","Azithromycin","Ciprofloxacin"],a:0,e:"Adult empiric meningitis = ceftriaxone + vancomycin.",p:"Adult meningitis empiric = ceftriaxone + vancomycin.",why:"Ceftriaxone is a third-generation cephalosporin that crosses inflamed meninges to bactericidal CSF concentrations, covering pneumococcus and meningococcus; vancomycin covers penicillin-resistant pneumococcus until susceptibilities return. Adult empiric meningitis therapy per IDSA is exactly this pair. Amoxicillin alone misses resistant pneumococcus; azithromycin and ciprofloxacin do not reliably achieve bactericidal CSF levels."},
   {q:"TWIST — correction: she is 67, not 22.",o:["Add ampicillin for Listeria","Same regimen","Add metronidazole","Remove vancomycin"],a:0,e:"Age >50 years confers Listeria risk — add ampicillin per IDSA guidance.",p:"Meningitis + age >50 → ADD AMPICILLIN for Listeria.",why:"Age over 50 — like neonatal age or immunocompromise — confers Listeria monocytogenes risk, and ceftriaxone has no activity against Listeria. Ampicillin, an aminopenicillin with excellent CSF penetration, is bactericidal for Listeria and is mandated by IDSA as the add-on in these risk groups. Omitting it leaves a fatal coverage gap; metronidazole adds nothing against Listeria."},
   {q:"LP confirms bacterial meningitis. Dexamethasone?",o:["With or before the first antibiotic dose","After cultures return","On day 3","Never in meningitis"],a:0,e:"Steroids blunt inflammatory injury — give with or before the first dose.",p:"Dexamethasone: WITH or BEFORE the first antibiotic dose.",why:"Bacterial lysis floods the subarachnoid space with inflammatory mediators, driving cerebral edema, hearing loss, and neurologic injury. Dexamethasone blunts this inflammatory cascade, but only when given with or before the first antibiotic dose — afterward, the inflammatory die is cast. Trials show mortality and morbidity benefit in pneumococcal meningitis with this timing; day-3 steroids are theater."}]},
 {id:"p2",guide:"iai",name:"Leo, 50",title:"perforated diverticulitis",x:2200,
  talk:"(surgeon) 50, perforated diverticulitis, peritonitis, heading to the OR. He needs antibiotics now.",
  chart:"50M · T 38.8°C · rigid abdomen · PMH: none · Allergies: NKDA · Labs: WBC 16.4 · lactate 3.1",
  steps:[
   {q:"First move?",o:["Blood cultures + empiric gram-negative + anaerobe cover","Metronidazole alone","Wait for OR cultures","Oral vancomycin"],a:0,e:"Intra-abdominal sepsis = gram-negatives + anaerobes, covered before the OR.",p:"Intra-abdominal sepsis = gram-negatives + anaerobes before the OR.",why:"Perforated diverticulitis with peritonitis is polymicrobial — E. coli, Klebsiella, Bacteroides, enterococci — and demands source control plus antibiotics covering gram-negatives and anaerobes before the operating room. Blood cultures precede therapy. Metronidazole alone leaves gram-negatives untouched; waiting for operative cultures delays the only therapy that works before source control."},
   {q:"Empiric weapons?",o:["Ceftriaxone + metronidazole","Metronidazole alone","Azithromycin + doxycycline","Oral vancomycin"],a:0,e:"Intra-abdominal sepsis requires gram-negative plus anaerobe coverage — e.g., ceftriaxone plus metronidazole.",p:"Intra-abdominal sepsis → ceftriaxone + metronidazole.",why:"Ceftriaxone covers the enteric gram-negatives while metronidazole, a nitroimidazole that disrupts DNA in obligate anaerobes, assassinates Bacteroides fragilis — together they match the perforation flora. IDSA intra-abdominal guidance requires gram-negative plus anaerobe coverage for moderate-severe community infection. Metronidazole alone has no gram-negative activity; azithromycin-doxycycline is a respiratory regimen; oral vancomycin never leaves the gut lumen."},
   {q:"TWIST — he drinks daily and won't abstain.",o:["Warn firmly: disulfiram-like reaction — no alcohol during + 72h after","It's a minor interaction","Switch to ciprofloxacin","Double the metronidazole"],a:0,e:"Disulfiram-like reaction: violent nausea, flushing, hypotension.",p:"Metronidazole + alcohol = disulfiram-like misery. No alcohol during + 48–72h after.",why:"Metronidazole inhibits aldehyde dehydrogenase, so ethanol metabolism stalls at acetaldehyde — producing violent nausea, flushing, tachycardia, and hypotension in a disulfiram-like reaction. The patient must abstain during therapy and for 48 to 72 hours after the last dose. Calling this interaction minor invites an emergency department visit; switching antibiotics solely for drinkability is poor stewardship when counseling suffices."},
   {q:"OR cultures: Bacteroides fragilis + E. coli (ceftriaxone-S).",o:["Continue both — both pathogens need their coverage","Stop metronidazole now","Switch to oral azithromycin","Add vancomycin"],a:0,e:"Bacteroides needs its assassin; the regimen is already appropriately narrow.",p:"Continue targeted therapy against documented pathogens.",why:"Operative cultures documented exactly the two pathogen classes the regimen targets — ceftriaxone-susceptible E. coli and Bacteroides fragilis — so the empiric regimen is already appropriately narrow for perforation with peritonitis. Stopping metronidazole abandons the anaerobe; switching to azithromycin abandons both. With source control achieved, completing targeted therapy against documented pathogens is correct."}]}],
/* ---- WING 3 : PHARMACY → ROOFTOP ---- */
[{id:"p0",guide:"atypical",name:"Nina, 28",title:"walking pneumonia",x:500,
  talk:"Just this dry cough that won't quit — a week now. Low fever, headache. I can still work, mostly.",
  chart:"28F · T 37.9°C · PMH: none · Allergies: NKDA · Labs: WBC 10.8 · CXR: patchy infiltrates",
  steps:[
   {q:"First move?",o:["Start empiric atypical coverage on clinical grounds","Blood cultures first","Amoxicillin","Wait another week"],a:0,e:"Walking pneumonia = clinical diagnosis; atypical coverage starts on suspicion.",p:"Walking pneumonia is a clinical diagnosis — treat on suspicion.",why:"Walking pneumonia — dry cough, low-grade fever, patchy infiltrates — is Mycoplasma, Chlamydophila, or Legionella until proven otherwise, and it is a clinical diagnosis because serology and PCR return too slowly to guide initial therapy. Beta-lactams are useless against cell-wall-deficient Mycoplasma, so amoxicillin is a category error. Waiting another week risks progression; atypical coverage starts on suspicion."},
   {q:"Empiric antibiotic?",o:["Azithromycin","Amoxicillin","Ceftriaxone","Metronidazole"],a:0,e:"Atypical features warrant a macrolide; beta-lactams are ineffective against cell-wall-deficient Mycoplasma.",p:"No cell wall (Mycoplasma) → beta-lactams useless. Macrolide / doxy / respiratory FQ.",why:"Azithromycin inhibits 50S protein synthesis and concentrates inside alveolar macrophages and lung tissue at levels far exceeding serum — precisely where intracellular atypical organisms replicate. Beta-lactams require a cell-wall target that Mycoplasma lacks. Ceftriaxone and metronidazole have no atypical activity; the macrolide is the mechanistically matched weapon."},
   {q:"TWIST — ECG: QTc 492 ms. Med list: simvastatin.",o:["Switch to doxycycline","Azithromycin anyway","Clarithromycin","IV erythromycin"],a:0,e:"QT prolongation + CYP3A4 substrate → dodge macrolides. Doxycycline covers atypicals.",p:"QT prolongation or CYP3A4 substrates → dodge macrolides; doxycycline covers atypicals.",why:"A QTc of 492 ms plus a CYP3A4 substrate is a double red flag for macrolides: they prolong the QT interval toward torsades de pointes and inhibit CYP3A4, which would spike simvastatin levels toward rhabdomyolysis. Doxycycline inhibits 30S protein synthesis, covers all atypicals including Legionella, and carries neither the QT nor the CYP3A4 liability. Clarithromycin and erythromycin are worse on both counts."},
   {q:"Legionella urinary antigen POSITIVE. She's on doxycycline.",o:["Continue doxycycline — it covers Legionella","Switch back to azithromycin","Add vancomycin","Stop antibiotics"],a:0,e:"Doxycycline covers Legionella too — the antigen confirms atypical, continue the current regimen.",p:"Doxycycline covers Legionella — positive antigen CONFIRMS, don't switch.",why:"Doxycycline covers Legionella pneumophila, so the positive urinary antigen confirms the atypical diagnosis and validates the QT-driven switch — the regimen is already correct. Switching back to azithromycin would reintroduce torsades and interaction risk for zero microbiologic gain. The antigen result is confirmation, not an indication to change."}]},
 {id:"p1",guide:"lyme",name:"Hiker, 34",title:"tick bite rash",x:1400,
  talk:"Fever five days, splitting headache, and this rash started on my wrists and ankles, spreading inward. Tick bite about ten days ago.",
  chart:"34F · T 39.0°C · centripetal rash · PMH: none · Allergies: NKDA",
  steps:[
   {q:"First move?",o:["Start doxycycline immediately on clinical suspicion","Wait for RMSF serology","Amoxicillin","Supportive care only"],a:0,e:"RMSF is a clinical diagnosis — serology takes days the patient doesn't have.",p:"RMSF = CLINICAL diagnosis. Start doxycycline on suspicion.",why:"Rocky Mountain spotted fever kills, and serology takes days to weeks to turn positive — antibodies appear after the therapeutic window closes. Tick exposure with fever and a centripetal rash starting at wrists and ankles is a clinical diagnosis demanding immediate doxycycline. Amoxicillin cannot touch obligate intracellular Rickettsia; supportive care alone is fatal; waiting for serology is waiting for the autopsy."},
   {q:"Weapon of choice?",o:["Doxycycline immediately","Amoxicillin","Wait for RMSF serology","Azithromycin"],a:0,e:"Classic RMSF — start doxycycline on suspicion.",p:"Suspected RMSF → doxycycline IMMEDIATELY, any age.",why:"Doxycycline inhibits 30S protein synthesis and penetrates host cells where Rickettsia rickettsii replicates as an obligate intracellular parasite. It is the CDC drug of choice for RMSF, and delayed therapy directly increases mortality. Amoxicillin and azithromycin are ineffective against Rickettsia; no alternative is acceptable."},
   {q:"TWIST — her 6-year-old son has identical symptoms.",o:["Doxycycline for him too — benefit outweighs teeth risk","Amoxicillin for kids","No antibiotics for children","Azithromycin"],a:0,e:"Doxycycline is the drug of choice for RMSF at any age.",p:"RMSF in kids → doxycycline REGARDLESS of age.",why:"The historic teeth-staining concern does not survive contact with RMSF mortality — the CDC and AAP state doxycycline is the drug of choice for RMSF at any age, and short courses carry negligible staining risk. A child with suspected RMSF given amoxicillin instead of doxycycline faces a preventable death from a treatable disease. Benefit outweighs the theoretical dental risk absolutely."},
   {q:"Discharged on doxycycline. Key counseling?",o:["Upright with full water, sunscreen, finish the course","Take at bedtime","Take with milk and antacids","Stop when fever breaks on day 2"],a:0,e:"Esophagitis, photosensitivity, and adherence are the key counseling points.",p:"Doxycycline counseling: upright administration with water, sun protection, and course completion.",why:"Doxycycline causes pill esophagitis — it must be taken upright with a full glass of water, never at bedtime — plus photosensitivity demanding sunscreen, and chelation by calcium, iron, magnesium, and antacids that guts absorption. Bedtime dosing invites esophageal ulceration; dairy and antacid co-administration wastes the dose. Completing the course prevents relapse."}]},
 {id:"p2",guide:"cdiff",name:"Edna, 78",title:"watery diarrhea after antibiotics",x:2200,
  talk:"Watery diarrhea for days — ever since those antibiotics for my tooth. My belly's cramping something awful.",
  chart:"78F · T 37.8°C · PMH: recent clindamycin course · Allergies: NKDA · Labs: WBC 13.0 · stool toxin pending",
  steps:[
   {q:"First move?",o:["Stop the clindamycin + send stool toxin test","Continue clindamycin","Loperamide only","High-fiber diet"],a:0,e:"Suspected C. diff: stop the inciting antibiotic + test for toxins.",p:"Suspected C. diff → stop the inciting drug + test for toxins.",why:"Clindamycin is the classic C. difficile precipitant — its anaerobic wipeout lets C. difficile spores germinate unchecked. Suspected C. difficile demands stopping the inciting antibiotic and sending stool toxin testing; continuing clindamycin fuels the fire. Loperamide alone risks toxic megacolon by slowing clearance of toxin; fiber is not therapy."},
   {q:"Empiric therapy?",o:["Oral vancomycin","IV vancomycin","Metronidazole alone","Ciprofloxacin"],a:0,e:"Oral vancomycin stays in the gut lumen — perfect for C. diff.",p:"C. diff → ORAL vancomycin (stays in the lumen) or fidaxomicin.",why:"Oral vancomycin is negligibly absorbed, so it stays in the gut lumen achieving colonic concentrations that dwarf the MIC for C. difficile — it is a luminal weapon by pharmacokinetic design. Intravenous vancomycin does not reach the lumen in meaningful amounts and is a classic board-exam trap. Metronidazole is no longer first-line given inferior cure rates; ciprofloxacin causes C. difficile rather than treating it."},
   {q:"TWIST — toxin positive. She's also on a daily PPI.",o:["Review the PPI — PPIs raise C. diff risk; stop if not indicated","PPIs don't matter here","Double the PPI","Add antacids"],a:0,e:"PPIs raise C. difficile risk — deprescribe when not indicated.",p:"PPIs raise C. diff risk — deprescribe when not indicated.",why:"Proton pump inhibitors raise gastric pH, improving C. difficile spore survival through the stomach, and are independently associated with increased infection and recurrence risk. Every PPI without a firm indication should be deprescribed in a C. difficile patient. Doubling the dose amplifies the risk; dismissing the interaction ignores the epidemiology."},
   {q:"Day 3: improving, stools forming.",o:["Complete 10 days of oral vancomycin","Stop now — she feels better","Switch to IV vancomycin","Probiotics instead"],a:0,e:"C. diff = full 10-day course even when improving early.",p:"C. diff = 10 days even when improving early.",why:"C. difficile spores persist after symptoms improve, and truncated courses drive the 20 to 30 percent recurrence rate — IDSA specifies 10 days of oral vancomycin (or fidaxomicin) even with early improvement. Stopping at day 3 because stools are forming invites relapse; switching to intravenous vancomycin abandons the gut lumen where the organism lives."}]}]
];

/* Resistance Council questions — verbatim */
var RESISTANCE_QS=[
{q:"Trial — E. coli pyelonephritis, cipro-R, TMP-SMX-S, improving, not bacteremic.",o:["De-escalate to TMP-SMX","Nitrofurantoin","Continue ciprofloxacin","IV meropenem"],a:0,e:"De-escalate to the narrowest-spectrum susceptible oral agent once susceptibilities return.",p:"De-escalate to the narrowest-spectrum susceptible agent based on culture results.",why:"With ciprofloxacin-resistant, TMP-SMX-susceptible E. coli in an improving, non-bacteremic patient, the correct move is de-escalation to the narrowest-spectrum susceptible oral agent, which is TMP-SMX. Continuing ciprofloxacin against a resistant isolate risks treatment failure, while nitrofurantoin is never appropriate for pyelonephritis because it achieves negligible renal tissue and serum levels. IV meropenem is gross overtreatment for a stable outpatient and a stewardship violation. This trial tests the core stewardship reflex: narrow once susceptibilities allow."},
{q:"Trial — MRSA bacteremia on vancomycin: trough 28 mcg/mL, creatinine rising.",o:["Switch to daptomycin","Push through — high troughs are good","Add gentamicin","Halve the dose and continue"],a:0,e:"Vancomycin-associated nephrotoxicity — switch agents rather than persisting with dose reduction; daptomycin is appropriate for bacteremia.",p:"Vanco nephrotoxicity → SWITCH. Daptomycin for bacteremia.",why:"A vancomycin trough of 28 mcg per mL with rising creatinine is nephrotoxicity, and the correct response is to switch agents rather than push through or merely halve the dose. Daptomycin is bactericidal against MRSA via calcium-dependent membrane depolarization and is appropriate for bacteremia, making it the right switch. Adding gentamicin compounds nephrotoxicity without meaningful synergy against staphylococci. The critical caveat is that daptomycin is inactivated by pulmonary surfactant, so this switch is valid for bacteremia but never for pneumonia."},

function fitCanvas(){
 try{
  var cssW=window.innerWidth||0,cssH=window.innerHeight||0;
  var portrait=cssW>0&&cssH>0&&(cssW/cssH)<1;
  G.portrait=portrait;
  if(document.body&&document.body.classList)document.body.classList.toggle('portrait',portrait);
  if(portrait){VW=560;VH=Math.max(700,Math.round(560*cssH/Math.max(1,cssW)));}
  else{var _asp=cssW/Math.max(1,cssH);VW=_asp>1.85?Math.min(1280,Math.round(540*_asp)):960;VH=540;}
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,2.5);
  var w=Math.max(2,Math.round(r.width*dpr)),h=Math.max(2,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  G.pxScale=cv.width/VW;
  var rh=$('rotateHint');
  if(rh)rh.style.display=(portrait&&(G.mode==='title'||G.mode==='path'))?'block':'none';
 }catch(e){}
}

/* finger-drag movement: virtual joystick anchored at touchdown — drag direction = move direction */
var dragFinger=null,dragCX=0,dragAX=0;
function dragStart(e){

 }

}

  if(e.changedTouches[i].identifier===dragFinger)dragFinger=null;

function burst(x,y,n,colors){
 if(SV.flight)n=Math.max(2,Math.ceil(n/2));
 if(G.particles.length>220)return;
 n=Math.min(n,220-G.particles.length);
 for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=60+Math.random()*220;
  G.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:0.9+Math.random()*0.5,t:0,
   c:colors[i%colors.length],r:3+Math.random()*4});}

function updateFx(dt,t){
 /* particles */
 for(var i=G.particles.length-1;i>=0;i--){var p=G.particles[i];p.t+=dt;
  if(p.t>=p.life){G.particles.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;}
 /* floating combat text */
 for(var f=G.floats.length-1;f>=0;f--){var fl=G.floats[f];fl.t+=dt;fl.y-=36*dt;
  if(fl.t>=fl.life)G.floats.splice(f,1);}
 /* 💊 projectiles */
 for(var q=G.projs.length-1;q>=0;q--){var pr=G.projs[q];pr.t+=dt;
  if(pr.t>=pr.life){G.projs.splice(q,1);try{if(pr.onHit)pr.onHit();}catch(e){}}}
 /* screen shake + red vignette decay */
 if(G.shake>0){G.shake*=Math.pow(0.015,dt);if(G.shake<0.25)G.shake=0;}
 if(G.vignette>0)G.vignette=Math.max(0,G.vignette-dt*1.4);
 /* squash & stretch recovery */
 G.sqx+=(1-G.sqx)*Math.min(1,dt*11);G.sqy+=(1-G.sqy)*Math.min(1,dt*11);
 /* minion knockback + hit-flash decay */
 for(var m=0;m<G.minions.length;m++){var mn=G.minions[m];
  if(mn.kbx){mn.x+=mn.kbx*dt;mn.kbx*=Math.pow(0.02,dt);if(Math.abs(mn.kbx)<8)mn.kbx=0;}
  if(mn.flash>0)mn.flash-=dt;}
 /* patient bounce decay */
 for(var b=0;b<G.patients.length;b++){if(G.patients[b].bounce>0)G.patients[b].bounce-=dt;}
 /* ambient dust motes drift */
 for(var d=0;d<G.motes.length;d++){var mo=G.motes[d];mo.x-=mo.sp*dt;mo.y+=Math.sin((t||0)*0.8+mo.ph)*8*dt;
  if(mo.x<-10){mo.x=LW+10;mo.y=Math.random()*VH;}}
}

/* ============ UPDATE ============ */
function update(dt){
 if(G.mode!=='play')return;
 /* NPC capture timer — bugs snatch your team! */
 if(G.npcs&&G.npcs.length){
  G.capTimer-=dt;
  if(G.capTimer<=0){
   G.capTimer=60+Math.random()*45; /* next capture in 60-105s */
   var free=G.npcs.filter(function(n){return!n.captured;});
   if(free.length){
    var victim=free[Math.floor(Math.random()*free.length)];
    var ros=WING_MINIONS[G.wing]||['mssa'];
    var bid=ros[Math.floor(Math.random()*ros.length)];
    victim.captured=true;victim.capBug=bid;
    var bb=G._bugMap[bid];
    sndBad();addShake(6);
    floatText(victim.x,FLOOR-130,'🆘 '+victim.name+' CAPTURED!','#ff5d5d');
    mascotSay('🆘 '+victim.name+' was grabbed by '+(bb?bb.name:'a bug')+'! Rescue them!');
   }
  }
 }
 /* horizontal: eased acceleration / snappy deceleration */
 var sp=380,ax=0;
 if(dragFinger!==null){
  /* relative drag: direction of finger movement from touchdown, not position */
  var _dx=dragCX-dragAX;
  if(_dx>24)ax=1;else if(_dx<-24)ax=-1;
 }else{
  if(G.keys.left)ax-=1;if(G.keys.right)ax+=1;
 }
 var tgt=ax*sp,rate=ax!==0?10:15;
 G.vx+=(tgt-G.vx)*Math.min(1,dt*rate);
 if(ax===0&&Math.abs(G.vx)<5)G.vx=0;
 G.px+=G.vx*dt;
 if(ax!==0)G.face=ax;
 if(G.px<30)G.px=30;if(G.px>LW-30)G.px=LW-30;
 /* vertical */
 var prevFeet=G.py,wasGround=G.onGround;
 G.vy+=1500*dt;G.py+=G.vy*dt;G.onGround=false;
 if(G.py>=FLOOR){G.py=FLOOR;G.vy=0;G.onGround=true;}
 for(var i=0;i<G.plats.length;i++){var p=G.plats[i];
  if(G.vy>=0&&prevFeet<=p.y+10&&G.py>=p.y&&G.px>p.x-14&&G.px<p.x+p.w+14){
   G.py=p.y;G.vy=0;G.onGround=true;break;}
 }
 if(G.onGround&&!wasGround){G.sqx=0.72;G.sqy=1.32;dustPuff(G.px,G.py);}
 /* camera: zoom-aware, clamped to level bounds.
    Landscape: player horizontally centered, classic framing. Portrait: player at ~62% of visible height. */
 var z=SV.zoom||1,visW=VW/z,visH=VH/z;
 G.cam=clampNum(G.px-visW/2,0,Math.max(0,LW-visW));
 if(G.portrait)G.camy=clampNum((G.py-40)-visH*0.62,-700,Math.max(0,VH-visH)+120);
 else G.camy=clampNum((G.py-40)-visH/2,0,Math.max(0,VH-visH));
 /* 💊 shots: fly straight, hit minions → teach or quiz */
 if(G.fireCd>0)G.fireCd-=dt;
 if((G.iframes||0)>0)G.iframes-=dt;
 for(var si=G.shots.length-1;si>=0;si--){var sh=G.shots[si];
  sh.x+=sh.vx*dt;sh.life-=dt;
  var hit=false;
  for(var mi=0;mi<G.minions.length;mi++){var mni=G.minions[mi];if(mni.used)continue;
   if(Math.abs(sh.x-mni.x)<30&&Math.abs(sh.y-(FLOOR-24))<44){
    hit=true;mni.flash=0.3;
    burst(mni.x,FLOOR-40,10,['#ffd76a','#fff']);
    earnXP(2);floatText(mni.x,FLOOR-100,'+2','#ffd76a');
    if(mni.bugId&&!SV.bugsTaught[mni.bugId])startBriefing(mni);
    else startSkirmish(mni);
    break;
   }}
  if(hit||sh.life<=0||sh.x<0||sh.x>LW)G.shots.splice(si,1);
 }
 /* minions wander */
 for(var m=0;m<G.minions.length;m++){var mn=G.minions[m];if(mn.used)continue;
  mn.hop+=dt*6;mn.x+=mn.dir*MSPEED[G.wing]*dt;
  if(mn.x<mn.a){mn.x=mn.a;mn.dir=1;}if(mn.x>mn.b){mn.x=mn.b;mn.dir=-1;}
  if(Math.abs(G.px-mn.x)<36&&Math.abs(G.py-FLOOR)<60){
   /* HARDCORE: touch = damage. Shoot bugs to learn/fight them. */
   if((G.iframes||0)>0)continue;
   SV.hearts--;save();
   G.iframes=1.5;
   G.vx=(G.px<mn.x?-1:1)*280;G.vy=-220;
   addShake(12);sndBad();
   burst(G.px,G.py-50,16,['#ff5d5d','#fff']);
   floatText(G.px,G.py-110,'-1 ❤️','#ff5d5d');
   mn.kbx=(mn.x<G.px?-1:1)*120;
   if(SV.hearts<=0){outOfHearts();return;}
   continue;}
 }
 /* iframes tick down */
 /* pickups */
 for(var k=G.pickups.length-1;k>=0;k--){var pk=G.pickups[k];if(pk.taken)continue;
  pk.bob+=dt*3;
  if(Math.abs(G.px-pk.x)<38&&Math.abs(G.py-pk.y)<52){
   pk.taken=true;collectPickup(pk);
  }
 }
 /* proximity prompts */
 G.promptFor=null;G.promptPatient=null;G.promptNpc=null;
 var best=null,bd=1e9;
 for(var q=0;q<G.patients.length;q++){var pt=G.patients[q];
  var d=Math.abs(G.px-pt.x);
  if(d<95&&d<bd){bd=d;best=pt;}
 }
 /* NPC proximity */
 var bestNpc=null,bnd=1e9;
 if(G.npcs)for(var nq=0;nq<G.npcs.length;nq++){var npc0=G.npcs[nq];
  var nd=Math.abs(G.px-npc0.x);
  if(nd<110&&nd<bnd){bnd=nd;bestNpc=npc0;}
 }
 if(bestNpc&&(!best||bnd<bd)){G.promptFor='npc';G.promptNpc=bestNpc;G.promptX=bestNpc.x;
  $('actLabel').textContent=bestNpc.captured?'🆘 RESCUE!':'💬 '+bestNpc.name;
 }else if(best){G.promptFor='patient';G.promptPatient=best;G.promptX=best.x;
  $('actLabel').textContent=best.done?'💬 review':'💬 talk';
 }else if(Math.abs(G.px-ELEV_X)<110){
  G.promptFor='elevator';G.promptX=ELEV_X;
  $('actLabel').textContent=allTreated(G.wing)?'⬆️ boss':'🔒';
 }else{$('actLabel').textContent='—';}
 var pr=$('prompt');
 if(G.promptFor){
  var zz=SV.zoom||1,cs=cssScale();
  pr.style.display='block';
  pr.style.left=(zz*(G.promptX-G.cam)*cs)+'px';
  pr.style.top=(zz*(G.py-96-(G.camy||0))*cs)+'px';
  pr.style.fontSize=Math.max(11,Math.round(14*cs))+'px';
  pr.textContent=G.promptFor==='patient'
   ?(G.promptPatient.done?'💬 Review chart':'💬 Talk — '+G.promptPatient.def.name)
   :(G.promptFor==='npc'?'💬 Talk to '+G.promptNpc.name+' ('+G.promptNpc.role+')'
   :(allTreated(G.wing)?'⬆️ Face the boss!':'🔒 Treat all 3 patients first'));
 }else pr.style.display='none';
}

function answerQuiz(i){

 comboTick(ok);

 if(ok){
  sndGood();var award=0;
  if(e.kind==='patient'){
   award=awardCorrect()*cm;
   if(G.talkPatient){G.talkPatient.mood='sick';floatText(G.talkPatient.x,FLOOR-140,'+'+award+' XP'+(cm>1?' x'+cm:''),'#3ddc84');}
   e.fb={ok:true,award:award,explain:Q.e,why:Q.why};
  }else if(e.kind==='skirmish'){
   award=10*cm;earnXP(award);bumpStreak();
   var mn0=e.minion;
   if(mn0){mn0.flash=0.3;mn0.kbx=(mn0.x<G.px?-1:1)*170;
    firePill(G.px,G.py-70,mn0.x,FLOOR-60,function(){
     mn0.used=true;burst(mn0.x,FLOOR-60,24,['#ffd76a','#fff','#ff9d5d']);
     floatText(mn0.x,FLOOR-112,'+'+award+' XP','#ffd76a');sndGood();
    });}
   else burst(G.px,G.py-60,20,['#ffd76a','#fff']);
   e.fb={ok:true,award:award,explain:Q.e,why:Q.why};
  }else if(e.kind==='boss'){
   award=awardCorrect();G.bossHP--;
   if(G.rush){G.rush.answered++;G.rush.correct++;}
   var be=$('bossEmo');if(be){be.classList.remove('hurt');void be.offsetWidth;be.classList.add('hurt');}
   var bwx=VW/2+G.cam;
   firePill(G.px,G.py-70,bwx,180,function(){
    burst(bwx,180,26,['#ff5d5d','#ffd76a']);
    floatText(bwx,118,'+'+award+' XP','#ffd76a');
   });
   e.fb={ok:true,award:award,explain:Q.e,why:Q.why};
  }else if(e.kind==='practice'){
   earnXP(5);award=5;
   if(SV.hearts<5){SV.hearts++;save();setTimeout(function(){mascotSay('+1 heart! Take care of yourself too.');},400);}
   e.fb={ok:true,award:5,explain:Q.e,why:Q.why};
  }else if(e.kind==='journal'){
   earnXP(20);bumpStreak();award=20;
   e.fb={ok:true,award:20,explain:Q.e,why:Q.why};
  }
 }else{
  sndBad();addShake(9);floatText(G.px,G.py-112,'-1 ❤','#ff5d5d');

  resetStreak();
  e.mistakes=(e.mistakes||0)+1;
  unlockPearl(e.pid);
  logMistake({q:Q.q,o:Q.o,a:Q.a,e:Q.e,p:Q.p,why:Q.why,pid:e.pid});
  setTimeout(function(){mascotSay(pick(MASCOT.mistake));},300);
  if(e.kind==='patient'&&G.talkPatient){G.talkPatient.mood='worse';G.vignette=1;}
  if(e.kind==='skirmish'&&e.minion)e.minion.used=true; /* stunned */
  if(e.kind==='boss'&&G.rush)G.rush.answered++;
  save();
  if(SV.hearts<=0){outOfHearts();return;}
  e.fb={ok:false,explain:Q.e,pearl:Q.p,why:Q.why};
 }
 renderQuiz();
}

function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* break position-memorization: shuffle options so the answer isn't always A */
function prepQ(q){
 var idx=q.o.map(function(_,i){return i;});
 shuffleArr(idx);
 return {q:q.q,o:idx.map(function(i){return q.o[i];}),a:idx.indexOf(q.a),e:q.e,p:q.p,why:q.why,gram:q.gram};
}
function bugWhy(b){
 var mech={'Beta-lactams':'bind penicillin-binding proteins and block peptidoglycan cross-linking, causing osmotic lysis with time-dependent killing',
 'Glycopeptides':'bind D-ala-D-ala and block cell-wall synthesis — the answer when beta-lactams cannot bind their target (MRSA, ampicillin-resistant enterococci)',
 'Macrolides':'inhibit 50S protein synthesis and concentrate inside host cells, built for intracellular and atypical organisms',
 'Fluoroquinolones':'inhibit DNA gyrase and topoisomerase IV with concentration-dependent killing and superb tissue penetration',
 'Aminoglycosides':'inhibit 30S protein synthesis with concentration-dependent bactericidal killing, synergistic with beta-lactams against gram-negatives',
 'Tetracyclines':'inhibit 30S protein synthesis and penetrate host cells to reach intracellular organisms such as Rickettsia and atypicals',
 'TMP-SMX':'blocks folate synthesis at two sequential steps; a classic for UTIs and community MRSA skin infections',
 'Metronidazole':'disrupts DNA in obligate anaerobes — the Bacteroides and C. difficile assassin',
 'Antimycobacterials':'mycobacteria demand multi-drug combination therapy to prevent resistance; no single agent is ever enough'}[b.hunt]||'targeted therapy per susceptibilities';
 return b.name+' ('+b.site+') is killed by '+b.hunt+' — '+b.killed+'. Mechanistically, '+b.hunt.toLowerCase()+' '+mech+'. Morphology clue: '+b.morph+'. Inpatient: '+b.dose+'.';
}
function bugQuiz(bug){
 var hunts=[];for(var i=0;i<BUGS.length;i++)if(hunts.indexOf(BUGS[i].hunt)<0)hunts.push(BUGS[i].hunt);
 var pid='bug'+bug.id;
 var roll=Math.random();
 if(roll<0.34){
  /* what kills it? */
  var opts=[bug.hunt];
  while(opts.length<4){var h=pick(hunts);if(opts.indexOf(h)<0)opts.push(h);}
  shuffleArr(opts);
  return{q:'What drug class kills '+bug.emoji+' '+bug.name+'?',o:opts,a:opts.indexOf(bug.hunt),gram:gramLabel(bug),
   e:bug.name+' is killed by '+bug.hunt+': '+bug.killed+'.',
   p:'BUG FILE: '+bug.name+' → '+bug.hunt+' ('+bug.killed+').',why:bugWhy(bug)};
 }else if(roll<0.67){
  /* which bug causes this? */
  var on2=[bug.name];
  while(on2.length<4){var b2=pick(BUGS);if(on2.indexOf(b2.name)<0)on2.push(b2.name);}
  shuffleArr(on2);
  return{q:'Which bug is this?\n"'+bug.clue+'"',o:on2,a:on2.indexOf(bug.name),gram:gramLabel(bug),
   e:'That\'s '+bug.name+'. Treat with: '+bug.killed+'.',
   p:'BUG FILE: "'+bug.clue+'" → '+bug.name+'.',why:bugWhy(bug)};
 }else{
  /* body site */
  var os=[bug.site];
  while(os.length<4){var b3=pick(BUGS);if(b3.site&&os.indexOf(b3.site)<0)os.push(b3.site);}
  shuffleArr(os);
  return{q:'Where is '+bug.emoji+' '+bug.name+' classically found?',o:os,a:os.indexOf(bug.site),gram:gramLabel(bug),
   e:bug.name+' → '+bug.site+'. Treat with: '+bug.killed+'.',
   p:'BUG FILE: '+bug.name+' lives in: '+bug.site+'.',why:bugWhy(bug)};
 }
}

{id:"cap",def:"Bacterial infection of the lung parenchyma (alveoli) acquired outside the hospital — the alveoli fill with inflammatory exudate instead of air.",hm:["Fever + productive cough + pleuritic chest pain + focal crackles","CXR: lobar or multilobar infiltrate (the definitive finding)","Tachypnea, tachycardia; elderly may present with confusion alone","Typical (pneumococcus): abrupt, rusty sputum. Atypical (Mycoplasma): gradual, dry cough, headache"],t:"Community-Acquired Pneumonia — IDSA 2019",b:["Outpatient, no comorbidities: amoxicillin, doxycycline, or a macrolide (use macrolide only if local pneumococcal resistance <25%).","With comorbidities (COPD, diabetes, heart/liver/renal disease) or antibiotics in the past 3 months: amox-clav or cephalosporin + macrolide/doxycycline, OR a respiratory fluoroquinolone alone.","Draw blood cultures before antibiotics — but never delay the first dose for them.","Treat 5–7 days if clinically stable, then stop. Longer is not better."]},
{id:"cystitis",def:"Infection of the bladder mucosa, overwhelmingly from ascending uropathogenic E. coli colonizing the urethra — a mucosal surface infection, NOT tissue-invasive.",hm:["Dysuria + frequency + urgency + suprapubic discomfort","Afebrile — fever means the infection has ascended (think pyelonephritis)","UA: positive leukocyte esterase + nitrites; hematuria common","No vaginal discharge — discharge points to vaginitis/STI instead"],t:"Acute Uncomplicated Cystitis — IDSA 2011",b:["First-line: nitrofurantoin 5 days, TMP-SMX 3 days (only if local E. coli resistance <20%), or fosfomycin single dose.","Sulfa allergy? Nitrofurantoin has no sulfa cross-reactivity — it's the pick.","Fluoroquinolones are NOT first-line here — reserve them for pyelonephritis.","Never treat asymptomatic bacteriuria (exceptions: pregnancy, before urologic procedures)."]},
{id:"cellulitis",def:"Acute bacterial infection of the dermis and subcutaneous tissue — almost always beta-hemolytic streptococci (S. pyogenes) when non-purulent.",hm:["Hot, red, swollen, tender skin with poorly demarcated borders","Non-purulent = strep until proven otherwise; purulent/abscess = think S. aureus","Fever and leukocytosis with rapid spread","Erysipelas variant: raised, sharply demarcated, salmon-red plaques (face/legs)"],t:"Cellulitis — IDSA 2014 Skin & Soft Tissue",b:["Non-purulent cellulitis: a beta-lactam covering streptococci (cephalexin). No routine MRSA coverage needed.","Purulent (abscess): incision & drainage is the therapy; add TMP-SMX or doxycycline only with systemic signs.","Mark the leading edge and elevate the limb; reassess in 24–48h.","5 days suffices if improving. Diabetic foot infection plays by different rules — don't confuse them."]},
{id:"pyelo",def:"Bacterial infection of the renal parenchyma and pelvis — tissue-invasive, with bacteremia in ~25% of cases. This is NOT a bladder infection.",hm:["Fever + flank pain + costovertebral angle tenderness","Nausea/vomiting common; dysuria may or may not precede it","WBC casts in urine = the hallmark distinguishing it from cystitis","Bacteremic in 1 in 4 — always draw blood cultures"],t:"Pyelonephritis — IDSA 2011",b:["Empiric: fluoroquinolone (if local resistance <10%) or TMP-SMX; ceftriaxone if vomiting or severely ill.","Blood AND urine cultures before the first dose.","Nitrofurantoin does NOT treat pyelonephritis — it never reaches kidney tissue levels.","7 days (fluoroquinolone) or 14 days (TMP-SMX/beta-lactam); step down to oral when improving."]},
{id:"dfi",def:"Infection of soft tissue or bone below the malleoli in a diabetic patient — polymicrobial, driven by neuropathy + ischemia + hyperglycemia impairing host defense.",hm:["Ulcer that probes to bone, foul odor, rapidly spreading erythema","Systemic signs (fever, tachycardia) = severe, limb-threatening","Neuropathy masks pain — absence of pain means nothing","Gas on X-ray or crepitus = necrotizing emergency, not routine cellulitis"],t:"Diabetic Foot Infection — IDSA 2023",b:["Mild: oral amox-clav or cephalexin. Moderate/severe: broad IV (pip-tazo ± vancomycin for MRSA risk).","Probe-to-bone test + MRI for suspected osteomyelitis — plain X-ray misses early bone infection.","Do NOT give antibiotics for a clinically uninfected ulcer (colonization ≠ infection).","Necrosis, gas, or systemic toxicity = urgent surgical evaluation, not just broader antibiotics."]},
{id:"sepsis",def:"Life-threatening organ dysfunction from a dysregulated host response to infection (Sepsis-3) — it is the HOST response killing organs, not just the pathogen.",hm:["Suspected infection + SOFA score increase ≥2 (altered mentation, hypotension, hypoxia, oliguria)","qSOFA bedside: RR ≥22, altered mentation, SBP ≤100 (2 of 3 = high risk)","Lactate >2 mmol/L signals tissue hypoperfusion","Septic shock = sepsis + vasopressors needed to maintain MAP ≥65 despite fluids"],t:"Sepsis & Septic Shock — Surviving Sepsis 2021",b:["Septic shock: broad-spectrum antibiotics WITHIN 1 hour — every hour of delay raises mortality (Kumar 2006).","Blood cultures first, but never delay antibiotics to get them.","Start broad (cover MRSA + Pseudomonas per risk factors), then DE-ESCALATE on culture results.","7 days for most infections; and find the source — drain the abscess, pull the infected line."]},
{id:"mrsa-bacteremia",def:"Methicillin-resistant S. aureus in the bloodstream — mecA encodes PBP2a, making ALL beta-lactams (including carbapenems) useless.",hm:["Persistent bacteremia despite therapy; metastatic seeding (joints, spine, heart valves)","Gram-positive cocci in clusters on blood culture Gram stain","Nasal/skin colonization is the reservoir; healthcare exposure is the risk","Never a contaminant when truly positive — always treat, always work up the source"],t:"S. aureus Bacteremia — IDSA / ASH",b:["Vancomycin or daptomycin. Adding a beta-lactam clears cultures faster but causes more kidney injury (CAMERA-2).","Daptomycin NEVER for pneumonia — lung surfactant inactivates it.","Echocardiogram to rule out endocarditis; repeat blood cultures to document clearance.","Uncomplicated: 2 weeks from first negative culture. Complicated (endocarditis, metastatic): 4–6 weeks."]},
{id:"meningitis",def:"Bacterial infection of the leptomeninges — a neurologic emergency where hours determine brain injury. Classic triad is often incomplete.",hm:["Fever + neck stiffness (nuchal rigidity) + altered mental status — the classic triad","Kernig and Brudzinski signs support but don't rule out","CSF: high opening pressure, neutrophilic pleocytosis, low glucose, high protein","Petechial/purpuric rash = think Neisseria meningitidis"],t:"Bacterial Meningitis — IDSA 2004",b:["Never delay: blood cultures, then ceftriaxone + vancomycin immediately; do the LP when safe, not before antibiotics.","Dexamethasone WITH or BEFORE the first antibiotic dose (de Gans 2002).","Add ampicillin for Listeria if age >50, immunocompromised, or neonatal.","Narrow therapy on Gram stain and cultures; 7–10 days for meningococcal/pneumococcal disease."]},
{id:"iai",def:"Infection of the peritoneal cavity from a perforated viscus — polymicrobial by definition (aerobic gram-negatives + anaerobes from gut flora).",hm:["Rigid abdomen with rebound/guarding = peritonitis until proven otherwise","Fever + tachycardia + leukocytosis after the perforation event","Free air on imaging confirms perforation","Source control (surgery/drain) is the therapy — antibiotics alone never suffice"],t:"Complicated Intra-Abdominal Infection — IDSA/SIS",b:["Empiric: ceftriaxone + metronidazole, or piperacillin-tazobactam; add vancomycin if MRSA risk.","SOURCE CONTROL is the therapy — percutaneous drain or surgery. Antibiotics alone don't fix a perforation.","4 days after adequate source control is enough — longer courses don't help.","Mild uncomplicated diverticulitis without systemic signs may need no antibiotics at all."]},
{id:"atypical",def:"Pneumonia from organisms without a classic cell wall (Mycoplasma, Chlamydophila) or intracellular lifestyle (Legionella) — beta-lactams cannot work without a wall to attack.",hm:["Insidious dry cough + low-grade fever + headache ('walking pneumonia')","CXR worse than the exam — patchy infiltrates with minimal crackles","Cold agglutinins (Mycoplasma); hyponatremia + GI symptoms (Legionella)","WBC often normal — don't let a normal WBC reassure you"],t:"Atypical Pneumonia — IDSA CAP 2019",b:["Atypical organisms (Mycoplasma, Chlamydia): macrolide or doxycycline.","Doxycycline is the versatile pick — covers typical + atypical + rickettsial disease.","Test for Legionella urinary antigen when severe, ICU-bound, or outbreak-linked.","Respiratory fluoroquinolones (levofloxacin) cover both typical and atypical CAP."]},
{id:"lyme",def:"Tick-borne Borrelia burgdorferi infection (Ixodes deer tick) — stages progress from local skin to disseminated to late disease if untreated.",hm:["Erythema migrans: expanding bull's-eye rash ≥5cm — pathognomonic, diagnose clinically","Flu-like prodrome: fever, arthralgia, headache days after the bite","Disseminated: facial palsy, AV heart block, migratory arthritis","Serology lags weeks — early disease is a CLINICAL diagnosis"],t:"Lyme Disease — IDSA 2020",b:["Erythema migrans: doxycycline 10–14 days — drug of choice (also covers anaplasmosis).","High-risk tick bite (deer tick, engorged, <72h): single-dose doxycycline prophylaxis.","Amoxicillin when doxycycline is contraindicated (pregnancy, age <8).","Don't chase 'chronic Lyme' serologies without a real exposure history."]},
{id:"cdiff",def:"Toxin-mediated colitis from Clostridioides difficile overgrowth after antibiotics wipe out normal gut flora — the toxins (TcdA/TcdB), not the bacteria, cause disease.",hm:["Watery diarrhea (≥3 unformed stools/day) during or after antibiotics","Crampy abdominal pain + leukocytosis; pseudomembranes on colonoscopy","Clindamycin, fluoroquinolones, and cephalosporins are the classic precipitants","NAAT+/toxin+ with symptoms = treat; positive NAAT without symptoms = colonization"],t:"Clostridioides difficile — IDSA 2021",b:["First episode: fidaxomicin 10 days (fewer recurrences) or oral vancomycin.","Stop the inciting antibiotic if at all possible; stop the PPI too.","Metronidazole only when vancomycin/fidaxomicin are unavailable.","Recurrence: fidaxomicin, vancomycin taper/pulse, or bezlotoxumab; FMT after multiple recurrences."]},{id:"sti",def:"Sexually transmitted bacterial infections — principally Neisseria gonorrhoeae, Chlamydia trachomatis, and Treponema pallidum (syphilis). Screen and treat partners.",hm:["Gonorrhea: purulent urethral/cervical discharge; intracellular bean-shaped diplococci","Chlamydia: often asymptomatic; mucopurulent discharge, treat with doxycycline","Syphilis: painless chancre → palm/sole rash → latent → tertiary (neuro/cardiac)"],t:"STIs — CDC 2021",b:["Gonorrhea: ceftriaxone 500mg IM single dose (+ doxycycline if chlamydia not excluded).","Chlamydia: doxycycline 100mg BID 7 days — azithromycin no longer preferred.","Early syphilis: benzathine penicillin G 2.4M units IM single dose.","Expedited partner therapy — treat partners or reinfection is guaranteed."]},
{id:"hiv",def:"Human immunodeficiency virus destroys CD4 T-cells; untreated, CD4 <200 defines AIDS with opportunistic infections. ART (antiretroviral therapy) suppresses viral load to undetectable.",hm:["CD4 <200: PCP prophylaxis (TMP-SMX); CD4 <100: toxoplasmosis concern; CD4 <50: MAC prophylaxis","Thrush + weight loss + chronic diarrhea in undiagnosed patient = think HIV","Kaposi sarcoma (HHV-8) and cryptococcal meningitis are AIDS-defining","Undetectable = untransmittable (U=U) on effective ART"],t:"HIV & Opportunistic Infections — DHHS",b:["Start ART immediately on diagnosis — same-day start is now standard.","PCP treatment: TMP-SMX 15-20mg/kg/day divided q6-8h for 21 days.","Cryptococcal meningitis: amphotericin B + flucytosine induction, then fluconazole.","Screen for TB, hepatitis B/C, and STIs at HIV diagnosis."]}

var JOURNAL=[
[{t:0,q:"A landmark 2006 study in septic shock found that each hour of delay to effective antibiotics was associated with…",o:["Higher mortality","Shorter ICU stays","Less resistance","Lower drug costs"],a:0,e:"Kumar 2006: each hour of delay to effective antibiotics in septic shock increased mortality.",p:"TRIAL PEARL — Kumar 2006: in septic shock, effective broad-spectrum antibiotics within the hour; each hour of delay raises mortality.",why:"In septic shock, each hour of delay to effective antimicrobials measurably increased mortality — the biologic rationale is exponential bacterial growth and cascading inflammatory injury that becomes irreversible. This underpins the Surviving Sepsis 1-hour bundle: broad-spectrum antibiotics first, de-escalate later. Blood cultures must never delay the dose. The distractors invert the finding: delay worsens every outcome, including resistance selection from prolonged inadequate therapy."},
 {t:1,q:"A 2002 trial in bacterial meningitis found dexamethasone improved outcomes when given…",o:["With or before the first antibiotics","After cultures return","On day 3","Only in viral meningitis"],a:0,e:"de Gans 2002: dexamethasone with or before the first antibiotic dose improved outcomes in bacterial meningitis.",p:"TRIAL PEARL — de Gans 2002: dexamethasone with or before the first antibiotic dose in bacterial meningitis.",why:"Bacterial lysis releases cell-wall components that trigger the inflammatory cascade causing cerebral edema, hearing loss, and neurologic injury — dexamethasone given with or before the first antibiotic dose blunts this inflammation before lysis begins. Given after antibiotics, the cascade is already underway and the benefit is lost. Timing is the entire question: the steroid must precede the bacterial killing it is meant to modulate."}],
[{t:2,q:"A 2006 trial (Fowler) in S. aureus bacteremia and endocarditis showed daptomycin was…",o:["Non-inferior to standard therapy","Superior to all comparators","Ineffective","Only for pneumonia"],a:0,e:"Fowler 2006: daptomycin was non-inferior to standard therapy for S. aureus bacteremia/endocarditis.",p:"TRIAL PEARL — Fowler 2006: daptomycin is an option for S. aureus bacteremia/endocarditis — never for pneumonia (surfactant).",why:"Daptomycin 6 mg/kg was non-inferior to standard therapy (vancomycin or an anti-staphylococcal penicillin plus initial gentamicin) for S. aureus bacteremia and right-sided endocarditis — establishing it as the alternative when vancomycin fails or injures kidneys. The trial excluded left-sided endocarditis and pneumonia (surfactant inactivation), which defines daptomycin's boundaries. Non-inferiority, not superiority, is the correct reading: it is an option, not a mandate."},
 {t:3,q:"Louie 2011 compared fidaxomicin vs vancomycin for C. difficile and found…",o:["Similar cure, fewer recurrences with fidaxomicin","Fidaxomicin inferior","More recurrences with fidaxomicin","No difference at all"],a:0,e:"Louie 2011: similar cure rates, but fewer recurrences with fidaxomicin.",p:"TRIAL PEARL — Louie 2011: fidaxomicin matches vancomycin for C. difficile cure with fewer recurrences.",why:"Fidaxomicin matched vancomycin for initial C. difficile cure but cut recurrence nearly in half — because its narrow spectrum spares Bacteroides and other protective gut flora, allowing colonization resistance to recover. Vancomycin's broader anaerobic activity delays microbiome restoration and invites relapse. IDSA 2021 therefore prefers fidaxomicin for initial episodes when available: same cure, fewer recurrences, less downstream vancomycin exposure."}],
[{t:5,q:"The 2019 OVIVA trial in bone and joint infection showed…",o:["Oral antibiotics non-inferior to IV","IV always superior","Orals only for children","No conclusion"],a:0,e:"OVIVA 2019: oral antibiotics were non-inferior to IV for bone and joint infection.",p:"TRIAL PEARL — OVIVA 2019: highly bioavailable orals can replace IV for bone/joint infection.",why:"Highly bioavailable oral antibiotics with excellent bone penetration were non-inferior to IV therapy for bone and joint infection — because tissue concentrations, not the route of administration, determine efficacy. This dismantled the dogma that osteoarticular infection requires weeks of IV therapy. The qualifier is bioavailability and adherence: not every oral agent qualifies, and the trial used carefully selected regimens with early specialist review."},
 {t:6,q:"POET 2019 studied stable left-sided endocarditis and found oral step-down was…",o:["Non-inferior to continued IV","Dangerous","Only for right-sided disease","Untested"],a:0,e:"POET 2019: oral step-down was non-inferior to continued IV for stable left-sided endocarditis.",p:"TRIAL PEARL — POET 2019: stable left-sided endocarditis can step down to oral therapy.",why:"In stable left-sided endocarditis, stepping down to oral therapy after initial IV treatment was non-inferior to continued IV — again, adequate drug exposure at the vegetation matters more than the infusion route. Patients had to be clinically stable with no abscess or surgical indication. This does not license oral therapy for unstable endocarditis, prosthetic-valve complications, or S. aureus with metastatic seeding — the selection criteria are the entire safety story."}],
[{t:7,q:"CAMERA-2 (2020) added an anti-staphylococcal beta-lactam to vancomycin/daptomycin for MRSA bacteremia. Result?",o:["Faster culture clearance but more kidney injury","No effect","Less kidney injury","Higher mortality"],a:0,e:"CAMERA-2: combination cleared cultures faster but caused more kidney injury.",p:"TRIAL PEARL — CAMERA-2: beta-lactam combo for MRSA bacteremia clears cultures faster at the cost of kidney injury.",why:"Adding an anti-staphylococcal beta-lactam to vancomycin or daptomycin cleared MRSA bacteremia faster — the seesaw effect, in which beta-lactams enhance vancomycin/daptomycin killing despite in-vitro resistance. But the trial stopped early for increased acute kidney injury in the combination arm. The takeaway is nuanced: faster clearance at a renal cost, so combination is not routine — it is a consideration weighed against nephrotoxicity, not a new standard."},
 {t:8,q:"The 2024 BALANCE trial in bloodstream infection compared 7 vs 14 days and found…",o:["7 days non-inferior to 14","14 days clearly better","7 days only for UTIs","No difference in anything"],a:0,e:"BALANCE 2024: 7 days was non-inferior to 14 days for bloodstream infection.",p:"TRIAL PEARL — BALANCE 2024: 7 days is non-inferior to 14 for bloodstream infection.",why:"Seven days was non-inferior to 14 days for 90-day survival in bloodstream infection — with adequate source control, most bacteremias do not need two weeks. Exclusions matter: S. aureus, endocarditis, and undrained foci still require longer courses. The stewardship message is that duration is a modifiable risk factor for resistance, C. difficile, and toxicity — treat the infection, not the calendar."}]
];
